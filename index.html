      return S;
    }
    function del() {
      var s = new LLS([10, 20, 30, 40], { dbl: true, x0: 16, y0: 66, gap: LL.narrow ? 22 : 30 }), S = [], ids = s.chain(), cur = ids[2];
      s.ptr.curr = { t: cur, cls: 'red' }; s.n[cur].cls = 'hl';
      S.push({ line: [1, 2], cap: '`pop(2)` : `curr = self.getNode(2)`로 **지울 노드 자체**를 잡아요(30). 이중 연결 리스트는 앞뒤를 `curr.prev`, `curr.next`로 바로 찾으니 앞 노드를 따로 찾을 필요가 없어요.', ll: s.snap() });
      s.nx[ids[1]] = ids[3]; s.lc = {}; s.lc[ids[1]] = 'new'; s.rt = {}; s.rt[ids[1]] = 'over'; s.rdy = {}; s.rdy[ids[1]] = 64;
      S.push({ line: 3, cap: '`curr.prev.next = curr.next` : 20의 next가 30을 건너뛰고 40으로.', ll: s.snap() });
      s.pv[ids[3]] = ids[1]; s.lpc = {}; s.lpc[ids[3]] = 'new'; s.rpt = {}; s.rpt[ids[3]] = 'under';

      var s = base(), S = [], ids = s.chain(), prev = ids[0], after = ids[1];
      s.ptr.prev = { t: prev, cls: 'blue' };
      var nid = s.add(20, (s.n[prev].x + s.n[after].x) / 2, s.y0 + 96);
      s.ptr.newNode = { t: nid, cls: 'org', below: true };
      s.pv[nid] = prev; s.nx[nid] = after; s.lc = {}; s.lpc = {}; s.lc[nid] = 'new'; s.lpc[nid] = 'new';
      S.push({ line: 1, cap: '새 노드를 만든 데까지는 같아요. 실습 코드는 ③을 `newNode.next.prev`로 써서 안전하지만, 만약 **`prev.next.prev`로 쓰고 ④를 먼저** 하면 어떻게 될까요?', ll: s.snap() });
      s.nx[prev] = nid; s.lc[prev] = 'new';
      S.push({ line: 2, cap: '④ `prev.next = newNode` 를 먼저 했어요. 이제 `prev.next`는 30이 아니라 **새 노드**예요.', ll: s.snap() });
      s.pv[nid] = nid; s.lpc[nid] = 'bad'; s.lpc[after] = 'bad';
      S.push({ line: 3, tone: 'bad', cap: '`prev.next.prev = newNode` 는 `newNode.prev = newNode` 가 돼요 → 새 노드의 prev가 **자기 자신**! 그리고 **30의 prev는 여전히 10**이에요 (빨간 화살표). 뒤에서 앞으로 읽으면 20이 빠져요. 그래서 실습 코드처럼 **새 노드를 기준으로** 이웃을 찾는 게 안전해요.', ll: s.snap() });

  // ------------------------------------------------------------------ 배열 vs 연결: get(i) 경주
  CV.def('ll-compare', function (host) {

      it.push({ k: 'la', x: ax, y: 28, h: CV.t(0, 0, '배열 리스트 a', 'lbl pri', 'start') });

      // 연결 리스트

      });

    CV.form(host, {
      fields: [{ k: 'i', label: '읽을 위치 i (0~5)', v: '4', w: 80 }],

        if (!/^\d+$/.test(v.i.trim()) || +v.i > 5) return 'i는 0 ~ 5 사이의 정수로 입력해 주세요.';
        P.load(steps(+v.i.trim()));
      },
    });
    P = CV.player(host, { id: 'll-compare', draw: draw, interval: 1000 });
    P.stage.appendChild(svg);
    P.load(steps(4));
  });
})();

<script>
/* concept/viz/ch6.js */
/* Ch.6 스택 — 그림 · 시뮬레이터
   st-ops(기본 연산) · st-impl(리스트/연결 리스트 구현) · st-reverse(문자열 뒤집기) · st-paren(괄호 검사) · st-postfix(후위 계산)
   st-infix(중위→후위) · st-callstack(함수 호출 스택) · st-maze(미로 DFS)                         */
(function () {
  'use strict';
  var CV = window.CV, esc = CV.esc, T = CV.t;

  // ------------------------------------------------------------------ 공통: 세로 스택 그리기
  // o = {x, bot, w, h, gap, items:[{id, v, cls}] (아래→위), key, title, topName, max}
  function stackItems(svg, o) {
    var it = [], h = o.h || 36, gap = o.gap == null ? 4 : o.gap, w = o.w || 100, max = o.max || 6;
    var cap = max * (h + gap) + 10;

    it.push({ k: o.key + 'box', x: o.x, y: top, h: '<path class="c6-box" d="M-8 0 L-8 ' + (cap + 6) + ' L' + (w + 8) + ' ' + (cap + 6) + ' L' + (w + 8) + ' 0"/>' + (o.title ? T(w / 2, cap + 28, o.title, 'lbl sm') : '') });
    var shown = o.items.slice(-max), hidden = o.items.length - shown.length;
    shown.forEach(function (s, i) {
      var y = o.bot - (i + 1) * (h + gap) + gap;

    st.push(snap(-1, { line: 2, cap: '중위 표기식 `' + e + '` 를 후위 표기식으로 바꿔요. **피연산자는 바로 출력**, **연산자는 스택에서 잠깐 기다리게** 해요.' }));
    for (var i = 0; i < chars.length; i++) {
      var c = chars[i];
      clr();
      if (/[A-Za-z0-9]/.test(c)) {
        out.push({ id: 'v' + i, v: c, cls: 'new' });
        st.push(snap(i, { line: [5, 6], cap: '`' + c + '` 는 피연산자 → **바로 출력**에 붙여요.' }));
      } else if (c === '(') {
        stack.push({ id: uid++, v: c, cls: 'new' });
        st.push(snap(i, { line: [7, 8], cap: '`(` 는 **무조건 push**. 스택 안에서는 우선순위 0이라 다른 연산자를 막는 “벽” 역할을 해요.' }));
      } else if (c === ')') {
        st.push(snap(i, { line: 9, cap: '`)` → `(` 가 나올 때까지 스택에서 꺼내 출력해요.' }));
        while (stack[stack.length - 1].v !== '(') {
          clr();
          var x = stack.pop(); x.cls = 'new'; out.push(x);
          st.push(snap(i, { line: [10, 11], cap: '`' + x.v + '` 를 pop → **출력**에 붙여요.' }));
        }
        clr();
        stack.pop();
        st.push(snap(i, { line: 12, cap: '`(` 는 출력하지 않고 **버려요**. 괄호는 후위 표기식에 필요 없어요.' }));
      } else {
        var stop = false;
        while (stack.length && PREC[stack[stack.length - 1].v] >= PREC[c]) {
          clr();
          var y = stack.pop(); y.cls = 'new'; out.push(y);
          st.push(snap(i, { line: [14, 15, 16], cmp: [y.v, c, '>='], cap: '`' + c + '`(우선순위 ' + PREC[c] + ') 앞에서 스택 맨 위 `' + y.v + '`(우선순위 ' + PREC[y.v] + ')가 **같거나 높아서** 먼저 계산돼야 해요 → pop해서 출력.' }));
        }
        clr();
        var topv = stack.length ? stack[stack.length - 1].v : null;
        stack.push({ id: uid++, v: c, cls: 'new' });
        st.push(snap(i, { line: 17, cmp: topv ? [topv, c, '<'] : null, cap: '`' + c + '` 를 **push**' + (topv ? ' (스택 맨 위 `' + topv + '`는 우선순위가 ' + (topv === '(' ? '0이라 막혀요' : '더 낮아요') + ')' : ' (스택이 비어 있어요)') + '. 뒤에 더 높은 연산자가 올 수 있어서 기다려요.' }));
      }
    }
    clr();
    if (stack.length) st.push(snap(chars.length, { line: 18, cap: '식을 다 읽었어요. 스택에 남은 연산자를 **위에서부터 모두 꺼내** 출력해요.' }));
    while (stack.length) {
      clr();
      var z = stack.pop(); z.cls = 'new'; out.push(z);
      st.push(snap(chars.length, { line: [18, 19], cap: '`' + z.v + '` 를 pop → 출력.' }));
    }
    clr();
    var res = out.map(function (x) { return x.v; }).join('');
    st.push(snap(chars.length, { line: 20, tone: 'good', result: res, cap: '완성! `' + e + '` → **`' + res + '`**. 피연산자 순서는 그대로, 연산자만 계산 순서대로 자리를 옮겼어요.' }));
    return st;
  }
  CV.inSteps = inSteps; CV.inCheck = inCheck;
  CV.def('st-infix', function (host) {
    var svg = CV.svg(480, 390, 'c6-svg', '중위 표기식을 후위 표기식으로');

      // 우선순위 표
      it.push({ k: 'prec', x: 186, y: 84, h: '<rect class="c6-calc" x="0" y="0" width="280" height="78" rx="10"/>' + T(140, 22, '우선순위 (높을수록 먼저)', 'lbl sm') +
        T(46, 54, '* /', 'c6-pv') + T(46, 70, '2', 'lbl sm pri') + T(140, 54, '+ −', 'c6-pv') + T(140, 70, '1', 'lbl sm pri') + T(234, 54, '(', 'c6-pv') + T(234, 70, '0 (스택 안)', 'lbl sm pri') });
      if (s.cmp) it.push({ k: 'cmp', x: 326, y: 200, h: T(0, 0, '맨 위 ' + s.cmp[0] + ' ' + (s.cmp[2] === '>=' ? '≥' : '<') + ' 지금 ' + s.cmp[1], 'c6-res ' + (s.cmp[2] === '>=' ? 'org' : 'pri')) + T(0, 22, s.cmp[2] === '>=' ? '→ 맨 위를 꺼내 출력' : '→ 지금 연산자를 push', 'lbl sm') });
      // 출력 줄

      var cw = Math.min(26, Math.floor(400 / Math.max(1, s.chars.length)) - 3);
      s.out.forEach(function (x, k) { it.push({ k: (/^v/.test(x.id) ? 'o' : 'si') + x.id, x: 62 + k * (cw + 3), y: 340, cls: 'cell ' + (x.cls || ''), h: '<rect class="cb" x="0" y="-22" width="' + cw + '" height="34" rx="5"/>' + T(cw / 2, 1, x.v, 'cv') }); });
      if (s.result) it.push({ k: 'res', x: 62, y: 380, h: T(0, 0, '후위 표기식: ' + s.result, 'c6-res ok', 'start') });

    }
    CV.form(host, {
      fields: [{ k: 'expr', label: '중위 표기식 (최대 20자)', v: 'a+b*c', w: 220 }],
      buttons: [{ t: '변환', a: 'run', cls: 'pri' }],
      presets: [{ t: 'a+b*c', v: { expr: 'a+b*c' } }, { t: '(a+b)*c', v: { expr: '(a+b)*c' } }, { t: 'A-B-C', v: { expr: 'A-B-C' } }, { t: 'A*(B+C)/D', v: { expr: 'A*(B+C)/D' } }, { t: '(a+b (잘못)', v: { expr: '(a+b' } }],
      on: function (a, v) { var e = inCheck(v.expr); if (e.length && !/^[A-Za-z0-9+\-*/()]+$/.test(e)) return e; P.load(inSteps(e)); },
    });
    P = CV.player(host, { id: 'st-infix', code: IN_CODE, codeTitle: 'ListStack 활용 예시', draw: draw, interval: 1300 });
    P.stage.appendChild(svg);
    P.load(inSteps('a+b*c'));
  });

  // ------------------------------------------------------------------ 6-6 함수 호출 스택
  var CALL_CODE = 'def c():\n    return 3\n\ndef b():\n    return c() + 2\n\ndef a():\n    return b() * 10\n\nprint(a())';
  CV.def('st-callstack', function (host) {
    var svg = CV.svg(540, 300, 'c6-svg', '함수 호출 스택');
    var sc = CV.scene(svg), P;
    var F = { main: ['전체 코드', 'print(a()) 실행 중'], a: ['a()', 'b() * 10 계산 중'], b: ['b()', 'c() + 2 계산 중'], c: ['c()', 'return 3'] };
    function draw(s) {
      var it = [], W = 250, H = 46, x = 60, bot = 280;
      it.push({ k: 'box', x: x, y: 40, h: '<path class="c6-box" d="M-10 0 L-10 ' + (bot - 34) + ' L' + (W + 10) + ' ' + (bot - 34) + ' L' + (W + 10) + ' 0"/>' + T(W / 2, bot - 14, '호출 스택 (메모리)', 'lbl sm') });
      s.frames.forEach(function (f, i) {
        var top = i === s.frames.length - 1;
        it.push({ k: 'f' + f, x: x, y: bot - 46 - (i + 1) * (H + 6), cls: 'c6-fr' + (top ? ' top' : ''), h: '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="8"/>' + T(14, 20, F[f][0], 'c6-fn', 'start') + T(14, 37, (s.wait && s.wait[f]) || F[f][1], 'c6-fd', 'start') });
      });
      if (s.ret) it.push({ k: 'ret', x: 340, y: s.retY || 120, h: '<rect class="c6-calc" x="0" y="-22" width="170" height="34" rx="8"/>' + T(85, 0, s.ret, 'lbl org') });
      if (s.outp) it.push({ k: 'outp', x: 340, y: 250, h: T(0, 0, '화면 출력: ' + s.outp, 'c6-res ok', 'start') });
      sc.render(it);
    }
    var steps = [
      { line: 9, frames: ['main'], cap: '프로그램이 시작되면 맨 아래에 **전체 코드의 칸**이 있어요. `print(a())`를 하려면 먼저 `a()`를 불러야 해요.' },
      { line: [6, 7], frames: ['main', 'a'], cap: '`a()`를 부르면 **a의 칸(프레임)이 push**돼요. a는 `b() * 10`을 하려고 `b()`를 불러요.' },
      { line: [3, 4], frames: ['main', 'a', 'b'], cap: '`b()`의 칸이 위에 쌓여요. a는 **b가 끝날 때까지 아래에서 기다려요.**' },
      { line: [0, 1], frames: ['main', 'a', 'b', 'c'], cap: '`c()`의 칸이 맨 위(top)에 쌓여요. 지금 실행 중인 함수는 **항상 맨 위 칸**이에요.' },
      { line: 1, frames: ['main', 'a', 'b'], ret: 'c() → 3 반환', retY: 90, wait: { b: '3 + 2 = 5' }, cap: '`c()`가 3을 돌려주며 **pop**돼요. 바로 아래의 b가 이어서 `3 + 2`를 계산해요.' },
      { line: 4, frames: ['main', 'a'], ret: 'b() → 5 반환', retY: 140, wait: { a: '5 * 10 = 50' }, cap: '`b()`가 5를 돌려주고 pop. **나중에 불린 함수가 먼저 끝나요** (LIFO).' },
      { line: 7, frames: ['main'], ret: 'a() → 50 반환', retY: 190, wait: { main: 'print(50)' }, cap: '`a()`가 50을 돌려주고 pop. 이제 맨 아래 칸만 남았어요.' },
      { line: 9, frames: ['main'], outp: '50', tone: 'good', cap: '`50`이 출력돼요. 재귀도 똑같이 **자기 자신의 칸이 계속 쌓였다가** 거꾸로 하나씩 빠져요. 너무 깊으면 RecursionError!' },
    ];
    P = CV.player(host, { id: 'st-callstack', code: CALL_CODE, codeTitle: 'Python', draw: draw, interval: 1500 });
    P.stage.appendChild(svg);
    P.load(steps);
    host.appendChild(CV.node('<a class="c6-link" href="#/learn/ch2">🔁 재귀 함수의 호출 스택(팩토리얼 · 피보나치)은 <b>Ch.2 재귀</b>에서 그림으로 볼 수 있어요 →</a>'));
  });

  // ------------------------------------------------------------------ 6-7 미로 DFS
  var MAZES = [
    ['S..#..', '##.#.#', '......', '.####.', '...#..', '##...#'],
    ['S.....', '.####.', '.#..#.', '.#.##.', '.#....', '###.##'],
  ];
  var MZ_CODE = 'stack = [start]\nvisited = {start}\ncount = 1\nwhile stack:\n    i, j = stack.pop()\n    for a, b in neighbors(i, j):\n        if (a, b) not in visited:\n            visited.add((a, b))\n            stack.append((a, b))\n            count += 1\n# neighbors: 아래·위·오른쪽·왼쪽 중\n#            벽(#)이 아닌 칸';
  function mazeSteps(g) {
    var h = g.length, w = g[0].length, st = [], start;
    for (var i = 0; i < h; i++) for (var j = 0; j < w; j++) if (g[i][j] === 'S') start = [i, j];
    var vis = {}, stack = [start], count = 1, cur = null, dn = {};
    vis[start] = 1;
    function key(p) { return p[0] + ',' + p[1]; }
    function snap(o) { var inS = {}; stack.forEach(function (p) { inS[key(p)] = 1; }); return Object.assign({ g: g, vis: Object.assign({}, vis), inS: inS, dn: Object.assign({}, dn), cur: cur, stack: stack.slice(), count: count, vars: [['stack', stack.length + '칸'], ['count', count]] }, o); }
    st.push(snap({ line: [0, 1, 2], cap: '출발점 S를 방문 표시하고 **스택에 넣어요**. 스택에 든 칸 = “가 봐야 할 칸”이에요.' }));

      cur = stack.pop();
      var added = [];

        var a = cur[0] + d[0], b = cur[1] + d[1];

      });

      dn[cur] = 1;
    }
    cur = null;
    st.push(snap({ line: 3, tone: 'good', result: count, cap: '스택이 비었어요 → 탐색 끝! S에서 갈 수 있는 칸은 **' + count + '칸**이에요. 재귀 대신 스택을 쓰면 RecursionError 걱정이 없어요.' }));
    return st;
  }
  CV.mazeSteps = mazeSteps;

          it.push({ k: 'g' + k, x: X0 + j * C, y: Y0 + i * C, cls: 'c6-mc ' + cls, h: '<rect data-cell="' + k + '" x="1" y="1" width="' + (C - 2) + '" height="' + (C - 2) + '" rx="5"/>' + (ch === 'S' ? T(C / 2, C / 2 + 6, 'S', 'c6-ms') : '') });
        });

      it.push({ k: 'sT', x: lx, y: 30, h: T(0, 0, '스택 (위 = top)', 'lbl', 'start') });
      var shown = s.stack.slice().reverse().slice(0, 7);

        it.push({ k: 'sp' + p[0] + '_' + p[1], x: lx, y: 42 + k * 30, cls: 'cell ' + (k === 0 ? 'mv' : ''), h: '<rect class="cb" x="0" y="0" width="92" height="26" rx="5"/>' + T(46, 18, '(' + p[0] + ', ' + p[1] + ')', 'c6-co') });
      });
      if (s.stack.length > 7) it.push({ k: 'smore', x: lx + 46, y: 42 + 7 * 30 + 12, h: T(0, 0, '… ' + (s.stack.length - 7) + '개 더', 'lbl sm') });
      if (!s.stack.length) it.push({ k: 'sE', x: lx, y: 62, h: T(0, 0, '(비어 있음)', 'lbl sm', 'start') });
      if (legend) legend.querySelector('b').textContent = s.count + '칸';
      if (legend) legend.querySelector('b').className = s.result ? 'ok' : '';
      sc.render(it);
    }
    P = CV.player(host, { id: 'st-maze', code: MZ_CODE, codeTitle: 'Python (st-maze 문제와 같은 방식)', draw: draw, interval: 900 });
    CV.tabs(P.el.parentNode, [{ t: '미로 1', s: '갈림길 · 막다른 길' }, { t: '미로 2', s: '빙 돌아가는 길' }], function (i) { grid = MAZES[i].slice(); if (P.n) P.load(mazeSteps(grid)); });
    P.el.parentNode.insertBefore(P.el.parentNode.lastChild, P.el);
    P.stage.appendChild(svg);
    legend = CV.node('<div class="c6-legend"><span>찾은 칸 <b>0칸</b></span><span><i class="cur"></i>지금 칸</span><span><i class="ins"></i>스택에 있음</span><span><i class="done"></i>다녀옴</span><span><i class="wall"></i>벽 (눌러서 바꾸기)</span></div>');
    P.stage.appendChild(legend);
    svg.addEventListener('click', function (e) {
      var r = e.target.closest && e.target.closest('[data-cell]');
      if (!r) return;
      var p = r.getAttribute('data-cell').split(',').map(Number), row = grid[p[0]];
      if (row[p[1]] === 'S') return;
      grid[p[0]] = row.slice(0, p[1]) + (row[p[1]] === '#' ? '.' : '#') + row.slice(p[1] + 1);
      P.load(mazeSteps(grid));
    });
    P.load(mazeSteps(grid));
  });
})();

  function pickExam(kind) {
    var T = TEMPLATES[kind], used = {}, out = [], recent = LSg('recent', []);
    T.slots.forEach(function (s) {
      var base = QS.filter(function (q) { return !used[q.id] && q.ch === s[0]; });
      var c = base.filter(function (q) { return q.type === s[1] && (!s[2] || q.cx); });
      if (!c.length) c = base.filter(function (q) { return q.type === s[1]; });
      if (!c.length) c = base;
      if (!c.length) c = QS.filter(function (q) { return !used[q.id]; });
      c = shuffle(c);
      var fresh = c.filter(function (q) { return recent.indexOf(q.id) < 0; });
      var pick = (fresh.length ? fresh : c)[0];
      if (pick) { used[pick.id] = 1; out.push(pick); }
    });
    out.sort(function (a, b) { return TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || a.ch - b.ch; });
    return out.map(function (q) { return q.id; });

    $('[data-a=flag]', el).onclick = function () { var id = ex.qids[ex.cur]; if (ex.flag[id]) delete ex.flag[id]; else ex.flag[id] = 1; save(); $('[data-a=flag]', el).classList.toggle('on', !!ex.flag[id]); pal(); };
    $('[data-a=submit]', el).onclick = function () {
      var miss = ex.qids.map(function (id, k) { return isAnswered(BYQ[id], ex.ans[id]) ? null : k + 1; }).filter(Boolean);
      var fl = ex.qids.map(function (id, k) { return ex.flag[id] ? k + 1 : null; }).filter(Boolean);
      A.modal({
        title: '답안 제출', body: '<p>답안을 제출하고 채점할까요? 제출하면 답을 고칠 수 없어요.</p>' +
          (miss.length ? '<p style="color:#c4243f;font-weight:700">아직 답하지 않은 문항: ' + miss.join(', ') + '번</p>' : '<p>모든 문항에 답했어요.</p>') +
          (fl.length ? '<p>🚩 표시한 문항: ' + fl.join(', ') + '번</p>' : ''),
        buttons: [{ t: '계속 풀기' }, { t: '제출하고 채점', cls: 'blue', fn: function () { setTimeout(function () { finishExam(false); }, 0); } }],
      });
    };
    var tick = function () {
      var left = ex.end - Date.now(), t = $('#wtimer', el);
      if (t) { t.textContent = '남은 시간 ' + A.hms(left); t.classList.toggle('low', left < 10 * 60000); }
      if (left <= 0) { clearInterval(iv); finishExam(true); }
    };
    var iv = setInterval(tick, 1000); tick();
    A.onCleanup(function () { clearInterval(iv); });
    A.setKey(function (e) {
      if (A.modalOpen()) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') show(ex.cur + 1); else if (e.key === 'ArrowLeft') show(ex.cur - 1);
    });
    show(ex.cur || 0);
  }
  function finishExam(auto) {
    var ex = LSg('exam', null); if (!ex) { A.go('#/'); return; }
    if (!ex.done) { ex.done = true; ex.finishedAt = Math.min(Date.now(), ex.end); ex.auto = !!auto; LSs('exam', ex); A.track('wexam_done'); }
    var hasEssay = ex.qids.some(function (id) { return BYQ[id].type === 'essay' && isAnswered(BYQ[id], ex.ans[id]); });
    A.go(hasEssay && !ex.graded ? '#/w/exam/grade' : '#/w/exam/result');
    if (auto) setTimeout(function () { A.toast('시험 시간이 끝나 자동으로 제출했어요.'); }, 300);
  }
  function showGrade() {
    var ex = LSg('exam', null);
    if (!ex || !ex.done) { A.go(ex ? '#/w/exam' : '#/'); return; }
    var el = A.mount('view home-view wx-view');
    document.title = '서술형 자기 채점 - 자료구조 중간고사 연습실';
    var es = ex.qids.map(function (id, k) { return { q: BYQ[id], k: k }; }).filter(function (x) { return x.q.type === 'essay'; });
    el.innerHTML = topbar('서술형 자기 채점') + '<main class="wx-wrap"><section class="wcard wsum"><h1>서술형 자기 채점</h1><p>짧은 서술형은 자동 채점을 하지 않아요. 내 답과 <b>모범 답안 · 채점 포인트</b>를 비교해서 <b>맞음(만점) · 부분(절반) · 틀림(0점)</b>을 골라 주세요. 채점 포인트를 모두 담았으면 맞음, 일부만 담았으면 부분이에요.</p></section>' +
      es.map(function (x) {
        var a = ex.ans[x.q.id];
        return '<article class="wcard" data-id="' + x.q.id + '">' + tagsHTML(x.q, x.k + 1) + '<div class="wq-q">' + md(x.q.q) + '</div>' + (x.q.code ? codeBlock(x.q.code) : '') +
          '<div class="wsub">내 답</div><div class="wmine">' + (isAnswered(x.q, a) ? esc(a.text).replace(/\n/g, '<br>') : '<i>(답하지 않음 → 0점)</i>') + '</div>' +
          '<div class="wfb-h"></div></article>';
      }).join('') + '<div class="wx-nav"><span id="wleft"></span><button class="btn pri" data-a="done">채점 끝 → 결과 보기</button></div></main>';
    function paint() {
      es.forEach(function (x) {
        var card = $('[data-id="' + x.q.id + '"]', el), a = ex.ans[x.q.id];
        if (!isAnswered(x.q, a)) { $('.wfb-h', card).innerHTML = feedbackHTML(x.q, a, { score: 0 }, {}); return; }
        $('.wfb-h', card).innerHTML = feedbackHTML(x.q, a, grade(x.q, a, ex.self[x.q.id]), { selfGrade: true, self: ex.self[x.q.id] });
        $$('.wsg', card).forEach(function (b) { b.onclick = function () { ex.self[x.q.id] = b.dataset.self; LSs('exam', ex); paint(); }; });
      });
      var left = es.filter(function (x) { return isAnswered(x.q, ex.ans[x.q.id]) && !ex.self[x.q.id]; }).length;
      $('#wleft', el).textContent = left ? '아직 채점하지 않은 서술형 ' + left + '개 (채점하지 않으면 0점)' : '모두 채점했어요.';
    }
    paint();
    $('[data-a=done]', el).onclick = function () { ex.graded = true; LSs('exam', ex); A.go('#/w/exam/result'); };
  }
  function examScore(ex) {
    var per = 100 / ex.qids.length, rows = [], auto = { got: 0, max: 0 }, self = { got: 0, max: 0 };
    ex.qids.forEach(function (id, k) {
      var q = BYQ[id], a = ex.ans[id], res = grade(q, a, ex.self[id], ex.over[id]), s = res.score || 0;
      var bucket = q.type === 'essay' ? self : auto; bucket.got += s * per; bucket.max += per;
      rows.push({ q: q, k: k, a: a, res: res, s: s, pts: s * per });
    });
    return { per: per, rows: rows, auto: auto, self: self, total: auto.got + self.got };
  }
  function showResult() {
    var ex = LSg('exam', null);
    if (!ex || !ex.done) { A.go(ex ? '#/w/exam' : '#/'); return; }
    var el = A.mount('view home-view wx-view');
    document.title = '필기 모의고사 결과 - 자료구조 중간고사 연습실';
    var S = examScore(ex), per = S.per;
    // 처음 결과를 볼 때 한 번만: 기록 · 오답노트
    if (!ex.recorded) {
      S.rows.forEach(function (r) { if (r.q.type === 'essay' && !isAnswered(r.q, r.a)) { record(r.q, 0); return; } if (r.res.score != null) record(r.q, r.res.score); });
      var hist = LSg('hist', []); hist.push({ at: Date.now(), kind: ex.kind, n: ex.qids.length, score: S.total, auto: S.auto.got, self: S.self.got }); LSs('hist', hist.slice(-10));
      ex.recorded = true; LSs('exam', ex);
    }
    var byCh = {}, byTy = {};
    S.rows.forEach(function (r) {
      var c = byCh[r.q.ch] || (byCh[r.q.ch] = { n: 0, got: 0, max: 0 }); c.n++; c.got += r.pts; c.max += per;
      var t = byTy[r.q.type] || (byTy[r.q.type] = { n: 0, got: 0, max: 0 }); t.n++; t.got += r.pts; t.max += per;
    });
    var wrong = S.rows.filter(function (r) { return verdict(r.res.score) !== 'ok'; });
    var used = Math.round(((ex.finishedAt || Date.now()) - ex.start) / 60000);
    var tot = Math.round(S.total * 10) / 10;
    function bar(x) { return '<tr><td>' + x.label + '</td><td class="num">' + x.n + '</td><td class="wbar"><span class="prog"><i style="width:' + (x.max ? 100 * x.got / x.max : 0) + '%"></i></span></td><td class="num"><b>' + r1(x.got) + '</b> / ' + r1(x.max) + '</td></tr>'; }
    function ansText(r) {
      var q = r.q, a = r.a;
      if (!isAnswered(q, a)) return '<i>(답 없음)</i>';
      if (q.type === 'mc') return CIRC[a] + ' ' + md(q.opts[a]);
      if (q.type === 'short') return '<code>' + esc(a) + '</code>';
      if (q.type === 'fill') return a.map(function (x, i) { return (i + 1) + ') <code>' + esc(String(x || '').trim() || '—') + '</code>'; }).join(' ');
      return esc(a.text).slice(0, 120) + (a.text.length > 120 ? '…' : '');
    }
    function review(r) {
      var v = verdict(r.res.score);
      return '<details class="wrv v-' + v + '" data-id="' + r.q.id + '"><summary><span class="wrv-k">' + (r.k + 1) + '</span><span class="wv-dot ' + v + '">' + (v === 'ok' ? '✓' : v === 'part' ? '△' : v === 'wait' ? '?' : '✗') + '</span><span class="wtag ty-' + r.q.type + '">' + TYN[r.q.type] + '</span><span class="wtag">Ch.' + r.q.ch + '</span><span class="wrv-t">' + esc(r.q.topic) + '</span><span class="wrv-p">' + r1(r.pts) + ' / ' + r1(per) + '</span></summary>' +
        '<div class="wn-b">' + questionHTML(r.q, r.a, true) + '<div class="wmine-s"><span>내 답</span> ' + ansText(r) + '</div>' + feedbackHTML(r.q, r.a, r.res, { override: true }) + '</div></details>';
    }
    el.innerHTML = topbar('필기 모의고사 결과', '<a class="btn sm" href="#/w/notes">📒 오답노트</a><a class="btn sm" href="#/">처음으로</a>') +
      '<main class="wx-wrap wide"><section class="rep-hero wres"><div><h1>필기 모의고사 결과</h1><p class="wres-m">' + TEMPLATES[ex.kind || 'full'].name + ' ' + ex.qids.length + '문항 · ' + ex.min + '분 중 ' + used + '분 사용' + (ex.auto ? ' · 시간 종료' : '') + '</p>' +
      '<div class="rep-total" id="wtotal">' + r1(tot) + '<span> / 100</span></div>' +
      '<div class="wres-parts"><div><span>자동 채점</span><b>' + r1(S.auto.got) + '</b> / ' + r1(S.auto.max) + '<small>객관식 · 단답형 · 코드 빈칸</small></div><div><span>자기 채점</span><b>' + r1(S.self.got) + '</b> / ' + r1(S.self.max) + '<small>짧은 서술형</small></div><div><span>틀리거나 부분 정답</span><b>' + wrong.length + '</b>문항<small>오답노트에 저장됨</small></div></div>' +
      '<p class="wres-msg">' + (tot >= 85 ? '아주 좋아요! 오답노트의 몇 문제만 다시 보면 돼요.' : tot >= 60 ? '좋아요. 아래 단원별 결과에서 약한 단원을 골라 연습해 보세요.' : '괜찮아요. 개념 정리를 한 번 보고 단원별 연습부터 차근차근 해 봐요.') + '</p></div>' + (A.IMG.mascot ? '<img src="' + A.IMG.mascot + '" alt="">' : '') + '</section>' +
      '<div class="wres-grid"><section class="wcard"><h3>단원별 결과</h3><table class="wbt"><thead><tr><th>단원</th><th class="num">문항</th><th></th><th class="num">점수</th></tr></thead><tbody>' +
      Object.keys(byCh).sort().map(function (c) { return bar(Object.assign({ label: 'Ch.' + c + ' ' + esc(CHN[c]) }, byCh[c])); }).join('') + '</tbody></table></section>' +
      '<section class="wcard"><h3>유형별 결과</h3><table class="wbt"><thead><tr><th>유형</th><th class="num">문항</th><th></th><th class="num">점수</th></tr></thead><tbody>' +
      TYPE_ORDER.filter(function (t) { return byTy[t]; }).map(function (t) { return bar(Object.assign({ label: TYN[t] }, byTy[t])); }).join('') + '</tbody></table></section></div>' +
      '<h2 class="wn-h">오답노트 <small>' + wrong.length + '문항 · 눌러서 해설 보기</small></h2>' + (wrong.length ? wrong.map(review).join('') : '<div class="empty">틀린 문제가 없어요! 🎉</div>') +
      '<h2 class="wn-h">전체 문항 다시 보기</h2>' + S.rows.map(review).join('') +
      '<div class="hero-cta">' + (wrong.length ? '<button class="btn pri" data-a="wrong">틀린 문제 다시 풀기</button>' : '') + '<button class="btn" data-a="again">새 모의고사</button>' + (S.self.max ? '<a class="btn" href="#/w/exam/grade">서술형 채점 고치기</a>' : '') + '<a class="btn" href="#/">처음으로</a></div></main>';
    var w = $('[data-a=wrong]', el); if (w) w.onclick = function () { startPractice(wrong.map(function (r) { return r.q; }), '모의고사 틀린 문제', true); };
    $('[data-a=again]', el).onclick = examSetup;
    $$('[data-over]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.closest('.wrv').dataset.id; ex.over[id] = true; LSs('exam', ex);
        var nt = LSg('notes', {}); if (nt[id]) { nt[id].fixed = true; LSs('notes', nt); }
        showResult(); A.toast('정답으로 처리했어요.');
      };
    });
  }

  // ------------------------------------------------------------------ 연결
  WX.init = function (api) {
    A = api;
    W = (window.DSL && window.DSL.DATA && window.DSL.DATA.written) || W;
    QS = W.questions || [];
    QS.forEach(function (q, i) { BYQ[q.id] = q; q._i = i; });
    (W.chapters || []).forEach(function (c) { CHN[c.ch] = c.name; });
  };
  WX.route = function (h) {   // h = ['w', 'practice'] …
    if (h[1] === 'practice') return showPractice();
    if (h[1] === 'notes') return showNotes();
    if (h[1] === 'exam') return h[2] === 'result' ? showResult() : h[2] === 'grade' ? showGrade() : showExam();
    A.go('#/');
  };
  WX.noteCount = noteCount;
  WX.countCh = function (ch) { return QS.filter(function (q) { return q.ch === ch; }).length; };
  WX.startChapter = function (ch) { var f = pf(); f.order = f.order || 'seq'; startPractice(QS.filter(function (q) { return q.ch === ch; }), 'Ch.' + ch + ' ' + (CHN[ch] || '')); };
  WX.countType = function (t) { return QS.filter(function (q) { return q.type === t; }).length; };
  WX.startType = function (t) { startPractice(QS.filter(function (q) { return q.type === t; }), TYN[t] || t); };
  WX.examLive = function () { var ex = LSg('exam', null); return !!(ex && !ex.done && Date.now() < ex.end); };
  WX._t = { normShort: normShort, normCode: normCode, grade: grade, pickExam: pickExam, TEMPLATES: TEMPLATES, QS: function () { return QS; }, BYQ: function () { return BYQ; }, questionHTML: questionHTML, feedbackHTML: feedbackHTML, startExam: startExam, finishExam: finishExam, fullCode: fullCode };
})();

<script>
/* app.js */
/* 러닝메이트 자료구조 중간고사 필기 연습실 — 화면 틀 (홈 · 화면 바꾸기 · 모달 · 개념 정리 연결)
   필기 연습 · 모의고사 · 오답노트는 written/written.js, 개념 정리는 concept/ */
(function () {
  'use strict';
  var DS = window.DSL || {};
  var IMG = DS.IMG || {};
  var EXAM_DATE = new Date(2026, 10, 3);         // 중간고사 2026-11-03 (지필 · Closed Book)

  // ------------------------------------------------------------------ 도구
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem('dsl.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('dsl.' + k, JSON.stringify(v)); } catch (e) { } },
    del: function (k) { try { localStorage.removeItem('dsl.' + k); } catch (e) { } },
  };
  function track(n) { try { if (window.LMTrack) window.LMTrack.event(n); } catch (e) { } }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hms(ms) { ms = Math.max(0, ms); var s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }

  // ------------------------------------------------------------------ 화면 바꾸기
  var app = document.getElementById('app');
  var cleanup = [];
  var keyHandler = null;
  document.addEventListener('keydown', function (e) { if (keyHandler) keyHandler(e); });
  function mount(cls) {
    cleanup.forEach(function (f) { try { f(); } catch (e) { } });
    cleanup = []; keyHandler = null;
    closeModal();
    app.innerHTML = '';
    var el = document.createElement('div');
    el.className = cls;
    app.appendChild(el);
    return el;
  }
  function go(h) { if (location.hash === h) route(); else location.hash = h; }
  function route() {
    var h = location.hash.replace(/^#\/?/, '').split('?')[0].split('/');
    if (h[0] === 'learn') return showLearn(h);
    if (h[0] === 'w' && window.WX) return window.WX.route(h);
    showHome();
  }

  // ------------------------------------------------------------------ 모달 · 토스트
  var modalEl = null;
  function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
  function modal(o) {
    closeModal();
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal ' + (o.cls || '') + '" role="dialog" aria-modal="true"><div class="modal-h"><h4>' + o.title + '</h4><button class="modal-x" aria-label="닫기">×</button></div><div class="modal-b">' + o.body + '</div><div class="modal-f">' +
      (o.buttons || [{ t: '닫기', cls: 'blue' }]).map(function (b, i) { return '<button class="mbtn ' + (b.cls || '') + '" data-i="' + i + '">' + b.t + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    modalEl = bg;
    bg.addEventListener('mousedown', function (e) { if (e.target === bg && !o.sticky) closeModal(); });
    $('.modal-x', bg).onclick = closeModal;
    $$('.modal-f .mbtn', bg).forEach(function (btn) {
      btn.onclick = function () { var b = (o.buttons || [{}])[+btn.dataset.i]; if (!b.fn || b.fn(bg) !== false) closeModal(); };
    });
    if (o.onOpen) o.onOpen(bg);
    var f = $('.modal-f .mbtn.blue', bg) || $('.modal-f .mbtn', bg); if (f) f.focus();
    return bg;
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#0c151c;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:60;box-shadow:0 6px 20px #0005;max-width:90vw';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2400);
  }

  // ------------------------------------------------------------------ 홈
  function ddayText() {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var d = Math.round((EXAM_DATE - t) / 86400000);
    return d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : '시험 끝';
  }
  function showHome() {
    var el = mount('view home-view');
    document.title = '러닝메이트 자료구조 중간고사 필기 연습실';
    var WXok = !!(window.WX && window.WX.homeHTML);
    var nNote = WXok ? window.WX.noteCount(true) : 0;
    el.innerHTML =
      '<header class="topbar"><div class="tb-in"><a class="brand" href="#/">' + (IMG.logo ? '<img src="' + IMG.logo + '" alt="">' : '') + '<b>러닝메이트</b><span class="sep">·</span><span class="t">자료구조 중간고사 연습실</span></a>' +
      '<div class="tb-r"><a class="btn sm" href="#/learn">📘 개념 정리</a>' + (WXok ? '<a class="btn sm tb-note" href="#/w/notes">📒 오답노트' + (nNote ? ' <span class="wcnt">' + nNote + '</span>' : '') + '</a>' : '') + '</div></div></header>' +
      '<main class="home">' + (WXok ? window.WX.homeHTML(ddayText()) : '<p class="empty">필기 문제를 불러오지 못했어요.</p>') +
      '<p class="foot">필기 문제는 1학년 자료구조 수업 범위(강의 자료 · 교재 「쉽게 배우는 자료구조 with 파이썬」 · 실습 코드)로 새로 만든 연습용이에요. 코드 빈칸 문제의 정답 코드는 모두 파이썬으로 실제 실행해서 확인했어요. 풀이 기록 · 오답노트는 이 브라우저(localStorage)에만 저장돼요.</p>' +
      '</main>';
    if (WXok) window.WX.bindHome(el);
  }

  // ------------------------------------------------------------------ 개념 정리 (src/concept/)
  function showLearn(parts) {
    var el = mount('view home-view cv-view');
    if (!window.CV) { el.innerHTML = '<p style="padding:40px">개념 정리를 불러오지 못했어요.</p>'; return; }
    keyHandler = function (e) { if (!modalEl) window.CV.key(e); };
    window.CV.show(el, parts, {
      IMG: IMG, LS: LS, track: track, go: go,
      onCleanup: function (f) { cleanup.push(f); },
      written: window.WX ? { count: window.WX.countCh, start: window.WX.startChapter, countType: window.WX.countType, startType: window.WX.startType } : null,
    });
  }

  // ------------------------------------------------------------------ 시작
  if (window.WX) window.WX.init({
    mount: mount, go: go, modal: modal, toast: toast, LS: LS, track: track, IMG: IMG, hms: hms,
    setKey: function (f) { keyHandler = f; }, onCleanup: function (f) { cleanup.push(f); }, modalOpen: function () { return !!modalEl; },
  });
  window.addEventListener('hashchange', route);
  window.DSL.app = { route: route };
  route();
})();
</script>
</body>
</html>
