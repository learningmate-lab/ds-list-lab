        i = self.__numItems - 1\n        if (i >= 0 and i <= self.__numItems - 1):\n            curr = self.getNode(⟦i⟧)\n            retItem = curr.item\n            ⟦curr.prev.next⟧ = curr.next\n            curr.next.prev = ⟦curr.prev⟧\n            self.__numItems -= 1\n            return retItem\n        else:\n            return None\n\n    def isEmpty(self) -> bool:\n        return self.__numItems == 0\n\n    def getNode(self, i:int) -> BidirectNode:\n        curr = self.__head  # 더미 헤드, index: -1\n        for index in range(i + 1):\n            curr = curr.next\n        return curr\n","blanks":[{"ans":["i"],"bad":["i - 1"]},{"ans":["curr.prev.next"],"bad":["curr.next.prev"]},{"ans":["curr.prev"],"bad":["curr.next"]}],"pre":["5-24"]},{"id":"w5-cdll-08","type":"fill","ch":5,"diff":3,"topic":"CircularDoublyLinkedList 생성 · append","q":"실습 코드 `CircularDoublyLinkedList`의 `__init__`과 `append`의 빈칸을 채우세요.","ex":"마지막 노드는 `self.__head.prev`예요. 새 노드를 그 뒤·더미 앞에 끼우고, 더미의 prev를 새 노드로 바꾸면 **O(1)**에 추가돼요.","code":"","cx":false,"src":"class CircularDoublyLinkedList:\n    def __init__(self):\n        self.__head = BidirectNode(\"dummy\", None, None)\n        self.__head.prev = ⟦self.__head⟧\n        self.__head.next = self.__head\n        self.__numItems = 0\n\n    def append(self, newItem) -> None:\n        prev = ⟦self.__head.prev⟧\n        newNode = BidirectNode(newItem, prev, ⟦self.__head⟧)\n        prev.next = newNode\n        ⟦self.__head.prev⟧ = newNode\n        self.__numItems += 1\n","blanks":[{"ans":["self.__head"],"bad":["None"]},{"ans":["self.__head.prev"],"bad":["self.__head.next"]},{"ans":["self.__head","prev.next"],"bad":["prev"]},{"ans":["self.__head.prev"],"bad":["self.__head.next"]}],"pre":["5-24"]},{"id":"w6-lifo-01","type":"mc","ch":6,"diff":1,"topic":"스택의 성질","q":"스택에 1, 2, 3을 차례로 `push`한 뒤 `pop`을 두 번 하면, 두 번째로 꺼낸 값은?","ex":"스택은 LIFO(Last In First Out)예요. 넣고 꺼내는 일이 모두 top 한 곳에서 일어나요.","code":"","cx":false,"opts":["1","2","3","꺼낼 수 없다"],"a":1,"why":["1은 가장 먼저 넣었으므로 가장 나중에 나와요.","첫 pop → 3, 두 번째 pop → 2. 나중에 넣은 것이 먼저 나와요(LIFO).","3은 첫 번째 pop에서 이미 나와요.","원소가 3개 있으니 두 번 꺼낼 수 있어요."]},{"id":"w6-trace-01","type":"mc","ch":6,"diff":1,"topic":"스택 추적","q":"다음 코드를 실행했을 때 마지막 줄이 출력하는 값은?","ex":"스택 상태: [5] → [5, 7] → [5] → [5, 9]. top은 맨 위(리스트의 끝) 9예요.","code":"s = ListStack()\ns.push(5)\ns.push(7)\ns.pop()\ns.push(9)\nprint(s.top())","cx":false,"opts":["5","7","9","None"],"a":2,"why":["5는 맨 아래에 그대로 남아 있지만 top은 아니에요.","7은 `pop()`으로 이미 꺼냈어요.","5, 7을 넣고 7을 꺼낸 뒤 9를 넣었으니 top은 9예요. `top()`은 꺼내지 않고 보기만 해요.","스택이 비어 있지 않으니 `top()`은 None을 돌려주지 않아요."]},{"id":"w6-under-01","type":"mc","ch":6,"diff":2,"topic":"빈 스택에서 pop","q":"실습 코드 `ListStack`(코드 6-6)에서 **빈 스택**에 `pop()`을 부르면 어떻게 될까요?","ex":"빈 스택에서 꺼내는 것을 **언더플로**라고 해요. 그래서 `while not s.isEmpty():`처럼 먼저 확인하고 꺼내요.","code":"","cx":false,"opts":["None을 돌려준다","IndexError 예외가 발생한다","0을 돌려준다","'dummy'를 돌려준다"],"a":1,"why":["`ListStack.pop`에는 isEmpty 검사가 없어요. None을 돌려주는 건 `top()`이에요.","`self.__stack.pop()`이 빈 파이썬 리스트에서 불리므로 `IndexError: pop from empty list`가 나요(스택 언더플로).","0을 돌려주는 코드는 어디에도 없어요.","'dummy'는 연결 리스트의 더미 헤드 값이에요. ListStack은 파이썬 리스트를 써요."]},{"id":"w6-under-02","type":"mc","ch":6,"diff":2,"topic":"빈 스택에서 pop","q":"실습 코드 `LinkedStack`(코드 6-13)에서 **빈 스택**에 `pop()`을 부르면 어떻게 될까요?","ex":"같은 스택 ADT라도 구현에 따라 언더플로 처리가 달라요. ListStack은 예외, LinkedStack은 None.","code":"","cx":false,"opts":["IndexError 예외가 발생한다","'dummy'를 돌려준다","None을 돌려준다","무한 반복에 빠진다"],"a":2,"why":["`LinkedListBasic.pop(i)`은 i가 범위 밖이면 예외 대신 None을 돌려줘요.","더미 헤드는 지우지 않아요. `pop(0)`은 0 <= numItems-1 = -1 조건이 거짓이라 else로 가요.","`self.__list.pop(0)` → 범위 검사(0 <= i <= numItems-1)가 거짓 → `return None`이에요.","반복문을 돌지 않고 바로 None을 돌려줘요."]},{"id":"w6-labbug-01","type":"mc","ch":6,"diff":2,"topic":"실습 코드 오류","q":"실습 파일 `linkedStack.py`의 첫 줄은 `from DS.list.linkedList import LinkedList`인데, 클래스 안에서는 `LinkedListBasic()`을 만들어요. 올바르게 고친 첫 줄은?","ex":"LinkedStack은 Ch.5의 `LinkedListBasic`을 감싸서 만든 스택이에요. 쓰는 이름을 import해야 해요.","code":"","cx":false,"opts":["from DS.list.linkedListBasic import LinkedListBasic","from DS.list.linkedList import LinkedListBasic","import LinkedListBasic","from DS.stack.listStack import *","고칠 필요 없다"],"a":0,"why":["리스트 폴더의 파일은 `linkedListBasic.py`이고, 그 안의 클래스 이름이 `LinkedListBasic`이에요.","`DS/list` 폴더에 `linkedList.py`라는 파일이 없어요.","모듈(파일) 경로 없이 클래스 이름만 import할 수는 없어요.","listStack을 가져와도 `LinkedListBasic`은 정의되지 않아요.","그대로 두면 모듈을 찾지 못하거나, 찾더라도 `LinkedListBasic`이 정의되지 않아 오류가 나요."]},{"id":"w6-pfzero-01","type":"mc","ch":6,"diff":3,"topic":"후위 표기식 계산 (실습 코드)","q":"실습 코드 postfix.py(코드 6-16)의 `evaluate(\"5 0 +\")`를 실행하면?","ex":"딕셔너리 `{...}[ch]`는 모든 값을 계산한 뒤 하나를 고르는 방식이라 필요 없는 나눗셈까지 해요. if-elif로 ch에 맞는 연산만 하면 고쳐져요.","code":"","cx":false,"opts":["5를 돌려준다","0을 돌려준다","ZeroDivisionError가 발생한다","None을 돌려준다"],"a":2,"why":["수학적으로는 5 + 0 = 5지만, 실습 코드의 `operation()`은 그렇게 동작하지 않아요.","0은 오른쪽 피연산자일 뿐 결과가 아니에요.","`operation()`이 딕셔너리를 만들 때 네 연산 `+ - * //`를 **모두 먼저 계산**해요. 그래서 `5 // 0`에서 ZeroDivisionError가 나요.","`evaluate`는 마지막에 `s.pop()`을 돌려주는데, 그 전에 예외가 나서 끝까지 가지 못해요."]},{"id":"w6-pforder-01","type":"mc","ch":6,"diff":3,"topic":"후위 표기식 계산 (실습 코드)","q":"`s.push(operation(s.pop(), s.pop(), ch))`에서 **먼저 꺼낸 값**은 `operation(opr2, opr1, ch)`의 어느 매개변수에 들어갈까요? (식 `9 3 -`를 계산하는 중)","ex":"스택은 나중에 넣은 것이 먼저 나와서, 먼저 꺼낸 값이 **오른쪽** 피연산자예요. 그래서 매개변수 순서가 (opr2, opr1)이에요.","code":"","cx":false,"opts":["opr1 — 왼쪽 피연산자 9","opr2 — 오른쪽 피연산자 3","ch","버려지고 쓰이지 않는다"],"a":1,"why":["9는 먼저 넣었으니 나중에 꺼내져요. 두 번째 `s.pop()`이 opr1이에요.","인자는 왼쪽부터 계산돼서 첫 `s.pop()` = 3이 opr2(오른쪽 피연산자)가 돼요. 결과는 opr1 - opr2 = 9 - 3 = 6.","ch는 세 번째 인자로 따로 넘겨요.","두 값 모두 연산에 쓰여요."]},{"id":"w6-cost-02","type":"mc","ch":6,"diff":2,"topic":"스택 연산의 비용","q":"`ListStack`을 고쳐서 파이썬 리스트의 **0번**을 top으로 쓰도록 `push`는 `insert(0, x)`, `pop`은 `pop(0)`으로 바꿨어요. 원소가 n개일 때 `push` 한 번의 시간 복잡도는?","ex":"배열(파이썬 리스트) 스택은 **끝**을 top으로 써야 push·pop이 O(1)이에요(append는 분할 상환 O(1)).","code":"","cx":true,"opts":["O(1)","O(log n)","O(n)","O(n²)"],"a":2,"why":["리스트 끝에서 하는 `append`·`pop()`이 O(1)이에요. 0번 삽입은 아니에요.","절반씩 줄이는 과정이 없어요.","0번에 넣으면 기존 원소 n개를 모두 한 칸씩 뒤로 옮겨야 해서 O(n)이에요. `pop(0)`도 앞으로 당기느라 O(n).","push 한 번은 원소를 한 번씩만 옮겨요."]},{"id":"w6-paren-01","type":"mc","ch":6,"diff":1,"topic":"괄호 검사","q":"스택으로 괄호 짝을 검사할 때 **실패**하는 문자열은?","ex":"닫는 괄호가 나오면 pop한 여는 괄호와 같은 종류인지 확인해요. 끝났을 때 스택이 비어 있어야 성공이에요.","code":"","cx":false,"opts":["([]{})","{[()]}","([)]","()[]{}"],"a":2,"why":["모든 닫는 괄호가 바로 앞의 여는 괄호와 짝이 맞아요.","안쪽부터 (), [], {} 순서로 맞게 닫혀요.","`)`를 만났을 때 스택 top이 `[`라서 짝이 맞지 않아요. 개수는 맞아도 **순서**가 틀렸어요.","나란히 열고 닫으니 성공이에요."]},{"id":"w6-in2post-01","type":"mc","ch":6,"diff":1,"topic":"중위 → 후위 변환","q":"중위 표기식 `A + B * C`를 후위 표기식으로 바꾸면?","ex":"피연산자 순서(A, B, C)는 그대로, 연산자는 계산되는 순서대로 뒤에 붙여요.","code":"","cx":false,"opts":["A B C * +","A B + C *","+ A * B C","A B C + *"],"a":0,"why":["곱셈이 먼저라 `B C *`를 만들고, 그 결과에 A를 더해 `A (B C *) +`예요.","이건 `(A + B) * C`의 후위 표기예요.","연산자가 앞에 오는 전위 표기예요.","이건 `A * (B + C)`의 후위 표기예요."]},{"id":"w6-call-01","type":"mc","ch":6,"diff":2,"topic":"함수 호출 스택","q":"다음 `fact(4)`를 호출했을 때, 호출 스택에 `fact`의 프레임이 **가장 많이 쌓였을 때** 몇 개일까요?","ex":"함수를 부르면 프레임이 push되고 return하면 pop돼요. 재귀 깊이 = 쌓이는 프레임 수예요.","code":"def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)","cx":false,"opts":["3개","4개","5개","1개"],"a":1,"why":["fact(1)까지 내려가야 종료 조건을 만나요. fact(4), fact(3), fact(2)만 세면 하나가 빠져요.","fact(4) → fact(3) → fact(2) → fact(1)까지 4개가 쌓인 뒤, fact(1)이 return하면서 하나씩 pop돼요.","n <= 1에서 멈추니 fact(0)은 호출되지 않아요.","재귀 호출은 앞의 호출이 끝나지 않은 채로 새 프레임을 push해요."]},{"id":"w6-print-01","type":"mc","ch":6,"diff":2,"topic":"LinkedStack printStack","q":"실습 코드 `LinkedStack`에 1, 2, 3을 차례로 push한 뒤 `printStack()`을 부르면 출력은? (공백에 주의)","ex":"LinkedStack은 `insert(0, x)`로 넣으니 0번 노드가 top이에요. `get(0)`, `get(1)`, … 순서로 출력해요.","code":"","cx":false,"opts":["Stack from top: 3 2 1 ","Stack from top:321","Stack from top: 1 2 3 ","Stack from top:123"],"a":1,"why":["이건 `ListStack.printStack`의 출력 모양이에요(`end=' '`).","`LinkedStack.printStack`은 `end=''`로 출력해서 공백 없이 붙어요. top(0번 노드)부터 3, 2, 1 순서예요.","0번 노드가 top(마지막에 넣은 3)이라 3부터 나와요. 공백도 없어요.","순서가 반대예요. 0번 노드 = 마지막에 push한 값이에요."]},{"id":"w6-lifo-02","type":"short","ch":6,"diff":1,"topic":"스택의 성질","q":"스택처럼 “나중에 넣은 것이 먼저 나오는” 방식을 영어 약자 4글자로 쓰면?","ex":"LIFO = Last In First Out (후입선출). 큐는 FIFO(선입선출)예요.","code":"","cx":false,"ans":["LIFO","Last In First Out","Last-In First-Out","후입선출"],"bad":["FIFO","선입선출","First In First Out"],"ph":"영어 약자"},{"id":"w6-pfval-01","type":"short","ch":6,"diff":1,"topic":"후위 표기식 계산","q":"후위 표기식 `2 3 4 * +`의 값은?","ex":"2, 3, 4를 push → `*`: 4와 3을 꺼내 3*4 = 12 push → `+`: 12와 2를 꺼내 2+12 = 14.","code":"","cx":false,"ans":["14"],"bad":["20","24","9"],"ph":"정수"},{"id":"w6-pfval-02","type":"short","ch":6,"diff":2,"topic":"후위 표기식 계산 (여러 자리 수)","q":"실습 코드 `evaluate(\"12 3 4 + *\")`가 돌려주는 값은? (`digitPreviously`로 여러 자리 수를 만들어요)","ex":"`1`, `2`가 연속으로 나와 10*1 + 2 = 12가 돼요. 3, 4 push → `+`: 7 → `*`: 12*7 = 84.","code":"","cx":false,"ans":["84"],"bad":["21","14","19"],"ph":"정수"},{"id":"w6-in2post-02","type":"short","ch":6,"diff":1,"topic":"중위 → 후위 변환","q":"중위 표기식 `(A - B) / C`를 후위 표기식으로 쓰세요. (띄어 써도 되고 붙여 써도 돼요)","ex":"괄호 안 `A - B`를 먼저 → `A B -`, 그 결과를 C로 나눠 `A B - C /`.","code":"","cx":false,"ans":["A B - C /","AB-C/"],"bad":["A B C / -","A B C - /","/ - A B C"],"ph":"예: A B - …"},{"id":"w6-in2post-03","type":"short","ch":6,"diff":3,"topic":"중위 → 후위 변환","q":"중위 표기식 `A / (B + C) - D`를 후위 표기식으로 쓰세요.","ex":"괄호 안 `B C +` → A를 그 값으로 나눠 `A B C + /` → D를 빼서 `A B C + / D -`.","code":"","cx":false,"ans":["A B C + / D -","ABC+/D-"],"bad":["A B C + D - /","A B + C / D -","A B C / + D -"],"ph":"예: A B …"},{"id":"w6-cost-03","type":"short","ch":6,"diff":1,"topic":"스택 연산의 비용","q":"실습 코드 `LinkedStack`에 원소가 n개 있을 때, `push` 한 번의 시간 복잡도를 빅오로 쓰세요.","ex":"push = `insert(0, x)`이고, `__getNode(-1)`은 반복을 0번 돌아 더미 헤드를 바로 돌려줘요. 화살표 두 개만 바꾸니 O(1)이에요.","code":"","cx":true,"ans":["O(1)","Θ(1)"],"bad":["O(n)","O(log n)","O(n^2)"],"ph":"O( ) 꼴로"},{"id":"w6-depth-01","type":"short","ch":6,"diff":3,"topic":"후위 표기식 계산","q":"후위 표기식 `1 2 3 4 + * +`를 스택으로 계산할 때, 스택에 원소가 **가장 많이** 들어 있는 순간 원소는 몇 개일까요?","ex":"1, 2, 3, 4를 연속으로 push하면 4개 → `+`에서 2개 꺼내 7을 넣어 3개 → `*` 2개 → `+` 1개(결과 15).","code":"","cx":false,"ans":["4","4개"],"bad":["3","7","2"],"ph":"개수"},{"id":"w6-rev-01","type":"short","ch":6,"diff":1,"topic":"스택으로 문자열 뒤집기","q":"실습 코드 6-15의 `reverse(\"stack\")`이 돌려주는 문자열은? (따옴표 없이 쓰세요)","ex":"s, t, a, c, k를 차례로 push한 뒤 빌 때까지 pop하면 k, c, a, t, s 순서로 나와요.","code":"","cx":false,"ans":["kcats","'kcats'"],"bad":["stack","kcat"],"ph":"문자열"},{"id":"w6-paren-02","type":"short","ch":6,"diff":2,"topic":"괄호 검사","q":"괄호 검사 알고리즘(여는 괄호는 push, 닫는 괄호는 pop해서 짝 확인)으로 `(()[`를 끝까지 읽었을 때 스택에 남은 원소는 몇 개일까요?","ex":"`(` push → `(` push → `)` pop → `[` push. `(`와 `[` 2개가 남아 있어서 검사는 실패예요(닫히지 않은 괄호).","code":"","cx":false,"ans":["2","2개"],"bad":["1","3","0"],"ph":"개수"},{"id":"w6-cost-01","type":"essay","ch":6,"diff":2,"topic":"스택 구현 비교","q":"`LinkedStack`은 `push`할 때 연결 리스트의 **맨 앞(0번)**에 넣어요. 맨 뒤에 넣지 않는 이유를 시간 복잡도로 설명하세요.","ex":"","code":"","cx":true,"model":"`LinkedListBasic`의 0번 삽입은 더미 헤드 바로 뒤에 붙이면 되므로 O(1)이에요. 맨 뒤에 넣으려면 tail이 없어서 `__getNode`로 끝까지 따라가야 하므로 O(n)이 걸려요. 꺼낼 때도 0번 삭제는 O(1)이라, 0번을 top으로 하면 push·pop이 모두 O(1)이 돼요.","keys":["맨 앞 삽입/삭제는 O(1)","맨 뒤는 끝까지 따라가야 해서 O(n) (tail 없음)","push와 pop이 같은 쪽(top)에서 일어나야 함"]},{"id":"w6-pfzero-02","type":"essay","ch":6,"diff":3,"topic":"후위 표기식 계산 (실습 코드)","q":"실습 코드의 `operation()`은 아래와 같아요. `evaluate(\"5 0 +\")`가 실패하는 이유와 고치는 방법을 쓰세요.","ex":"","code":"def operation(opr2:int, opr1:int, ch) -> int:\n    return {'+': opr1 + opr2, '-': opr1 - opr2,\n            '*': opr1 * opr2, '/': opr1 // opr2}[ch]","cx":false,"model":"딕셔너리 `{...}`를 만들 때 네 값 `opr1 + opr2`, `opr1 - opr2`, `opr1 * opr2`, `opr1 // opr2`를 모두 먼저 계산한 뒤 `[ch]`로 하나를 골라요. 그래서 덧셈인데도 `5 // 0`이 계산되어 ZeroDivisionError가 나요. `if ch == '+': return opr1 + opr2` … 처럼 if-elif로 ch에 해당하는 연산만 계산하면 고쳐져요.","keys":["딕셔너리를 만들 때 네 연산을 모두 계산함","오른쪽 피연산자가 0이면 // 에서 ZeroDivisionError","if-elif 등으로 필요한 연산만 계산하도록 수정"]},{"id":"w6-paren-03","type":"essay","ch":6,"diff":2,"topic":"괄호 검사","q":"스택을 이용해 `( ) [ ] { }` 괄호의 짝이 맞는지 검사하는 방법을 설명하고, **실패하는 경우 세 가지**를 쓰세요.","ex":"","code":"","cx":false,"model":"문자열을 앞에서부터 읽으며 여는 괄호는 push하고, 닫는 괄호가 나오면 pop해서 같은 종류인지 확인해요. 실패하는 경우는 ① 닫는 괄호가 나왔는데 스택이 비어 있을 때, ② pop한 여는 괄호가 닫는 괄호와 종류가 다를 때, ③ 끝까지 읽었는데 스택에 여는 괄호가 남아 있을 때예요.","keys":["여는 괄호 push, 닫는 괄호에서 pop","닫는 괄호인데 스택이 비어 있음","pop한 괄호와 종류가 다름","끝났는데 스택이 비어 있지 않음"]},{"id":"w6-under-03","type":"essay","ch":6,"diff":2,"topic":"빈 스택에서 pop","q":"빈 스택에서 `pop()`을 부를 때 실습 코드 `ListStack`과 `LinkedStack`의 동작 차이를 쓰고, 사용하는 쪽에서 어떻게 안전하게 꺼내야 하는지 쓰세요.","ex":"","code":"","cx":false,"model":"`ListStack.pop()`은 빈 파이썬 리스트에 `pop()`을 해서 IndexError가 발생해요. `LinkedStack.pop()`은 `LinkedListBasic.pop(0)`이 범위 밖이라 None을 돌려줘요. 그래서 꺼내기 전에 `isEmpty()`로 비었는지 먼저 확인하고 꺼내야 해요(예: `while not s.isEmpty(): s.pop()`).","keys":["ListStack: IndexError 예외","LinkedStack: None 반환","pop 전에 isEmpty()로 확인"]},{"id":"w6-call-02","type":"essay","ch":6,"diff":2,"topic":"함수 호출 스택","q":"재귀 함수가 **호출 스택**에서 어떻게 동작하는지 설명하고, 종료 조건이 없으면 어떻게 되는지 쓰세요.","ex":"","code":"","cx":false,"model":"함수를 호출하면 지역 변수와 돌아갈 위치를 담은 프레임이 호출 스택에 push되고, return하면 pop되어 호출한 곳으로 돌아가요. 재귀는 같은 함수의 프레임이 여러 개 쌓이는 것이고, 가장 위(가장 나중에 호출된) 함수가 먼저 끝나요(LIFO). 종료 조건이 없으면 프레임이 계속 쌓여 파이썬에서는 RecursionError(최대 재귀 깊이 초과)가 나요.","keys":["호출 시 프레임 push, return 시 pop","나중에 호출된 것이 먼저 끝남 (LIFO)","종료 조건이 없으면 RecursionError / 스택 오버플로"]},{"id":"w6-ls-01","type":"fill","ch":6,"diff":1,"topic":"ListStack push/pop/top","q":"실습 코드 `ListStack`(코드 6-6)의 빈칸을 채우세요.","ex":"파이썬 리스트의 맨 끝을 스택의 top으로 써요. `append`·`pop()`은 O(1)이에요.","code":"","cx":false,"src":"class ListStack:\n    def __init__(self):\n        self.__stack = []\n\n    def push(self, x):\n        self.__stack.⟦append(x)⟧\n\n    def pop(self):\n        return self.__stack.⟦pop()⟧\n\n    def top(self):\n        if self.isEmpty():\n            return None\n        else:\n            return self.__stack[⟦-1⟧]\n\n    def isEmpty(self) -> bool:\n        return not bool(self.__stack)\n","blanks":[{"ans":["appen <script>/* concept/engine.js */
/* 개념 정리 — 공통 엔진
   · CV.chapter({...})   : 단원 내용 등록 (content/chN.js)
   · CV.def(id, fn)      : 그림·시뮬레이터 등록 (viz/chN.js)   fn(host, sec) → (선택) 정리 함수
   · CV.player(host, o)  : 한 단계씩 넘기는 플레이어 (그림 + 코드 줄 강조 + 설명 + ◀ ▶ 자동재생 속도)
   · CV.scene(svg)       : key로 SVG 조각을 재사용 → 위치가 바뀌면 부드럽게 움직임
   · CV.LL               : 연결 리스트 노드 · 화살표 · 포인터 그리기
   · CV.show(el, parts, ctx) : 화면 (개념 정리 홈 / 단원 페이지)                          */
(function () {
  'use strict';
  var CV = window.CV = window.CV || {};
  CV.chapters = CV.chapters || [];
  CV.viz = CV.viz || {};
  CV.players = [];
  CV.chapter = function (c) { CV.chapters.push(c); CV.chapters.sort(function (a, b) { return a.no - b.no; }); };
  CV.def = function (id, fn) { CV.viz[id] = fn; };

  // ------------------------------------------------------------------ 작은 도구
  var esc = CV.esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  // 짧은 서식: `코드`, **굵게**, ==강조==, [[red:글자]] / [[blue:글자]] / [[org:글자]]
  CV.md = function (s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
    s = s.replace(/\[\[(red|blue|org|pri|ok|mut):([^\]]+)\]\]/g, '<span class="t-$1">$2</span>');
    s = s.replace(/\[([^\]]+)\]\((#\/[^)\s]*)\)/g, '<a href="$2">$1</a>');
    return s.replace(/\n/g, '<br>');
  };
  CV.$ = function (s, el) { return (el || document).querySelector(s); };
  CV.$$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  CV.node = function (html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
  CV.range = function (n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; };
  CV.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  CV.fmtN = function (n) {
    if (!isFinite(n)) return '∞';
    if (n >= 1e15) { var e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(1) + '×10^' + e; }
    return Math.round(n).toLocaleString('ko-KR');
  };

  // 파이썬 한 줄 색칠
  var KW = { def: 1, return: 1, if: 1, elif: 1, else: 1, while: 1, for: 1, in: 1, not: 1, and: 1, or: 1, is: 1, class: 1, import: 1, from: 1, pass: 1, break: 1, continue: 1, lambda: 1, try: 1, except: 1, raise: 1, global: 1, del: 1, with: 1, as: 1 };
  var CONST = { None: 1, True: 1, False: 1, self: 1 };
  var BI = { print: 1, len: 1, range: 1, int: 1, str: 1, list: 1, dict: 1, set: 1, input: 1, sum: 1, max: 1, min: 1, append: 0, map: 1, sorted: 1, enumerate: 1, abs: 1, id: 1, type: 1, tuple: 1, isinstance: 1, super: 1 };
  CV.pyhl = function (line) {
    var out = '', m, re = /(#.*$)|('(?:[^'\\]|\\.)*'?|"(?:[^"\\]|\\.)*"?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_가-힣][\w가-힣]*)|(\s+)|(.)/g;
    while ((m = re.exec(line))) {
      if (m[1]) out += '<span class="py-c">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="py-s">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="py-n">' + m[3] + '</span>';

    }).join('') + (o.buttons || [{ t: '실행', a: 'run', cls: 'pri' }]).map(function (b) { return '<button type="' + (b.a === 'run' ? 'submit' : 'button') + '" class="btn sm ' + (b.cls || '') + '" data-fa="' + b.a + '">' + esc(b.t) + '</button>'; }).join('') +
      (o.presets ? '<div class="cf-pre">' + o.presets.map(function (p, i) { return '<button type="button" class="chip-s" data-pre="' + i + '">' + esc(p.t) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="cf-err" hidden></div></form>');
    host.appendChild(f);
    var err = CV.$('.cf-err', f);
    function vals() { var v = {}; o.fields.forEach(function (x) { v[x.k] = f.elements[x.k].value; }); return v; }
    f.onsubmit = function (e) { e.preventDefault(); fire('run'); };
    function fire(a) {
      err.hidden = true;
      var r = o.on(a, vals());
      if (typeof r === 'string') { err.textContent = r; err.hidden = false; }
    }
    CV.$$('[data-fa]', f).forEach(function (b) { if (b.dataset.fa !== 'run') b.onclick = function () { fire(b.dataset.fa); }; });
    CV.$$('[data-pre]', f).forEach(function (b) {
      b.onclick = function () { var p = o.presets[+b.dataset.pre]; Object.keys(p.v).forEach(function (k) { f.elements[k].value = p.v[k]; }); fire('run'); };
    });
    return { el: f, vals: vals, set: function (k, v) { f.elements[k].value = v; }, fire: fire, error: function (m) { err.textContent = m; err.hidden = !m; } };
  };

  // 탭 (한 그림 안에서 장면 고르기)
  CV.tabs = function (host, list, onPick, cur) {
    var t = CV.node('<div class="cv-tabs" role="tablist">' + list.map(function (x, i) { return '<button role="tab" data-i="' + i + '" class="' + (x.bad ? 'bad' : '') + '">' + esc(x.t) + (x.s ? '<small>' + esc(x.s) + '</small>' : '') + '</button>'; }).join('') + '</div>');
    host.appendChild(t);
    function pick(i) { CV.$$('button', t).forEach(function (b) { var on = +b.dataset.i === i; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); }); onPick(i, list[i]); }
    CV.$$('button', t).forEach(function (b) { b.onclick = function () { pick(+b.dataset.i); }; });
    pick(cur || 0);
    return { el: t, pick: pick };
  };

  // ------------------------------------------------------------------ 개념 체크 (퀴즈)
  CV.quiz = function (host, qs, key, onAns) {
    var box = CV.node('<div class="qz"><div class="qz-h"><span class="qz-ic">✔</span><b>개념 체크</b><small>' + qs.length + '문제 · 고르면 바로 채점돼요</small></div></div>');
    qs.forEach(function (q, qi) {
      var k = key + '.' + qi;
      var el = CV.node('<div class="qz-q" data-q="' + k + '"><p class="qz-t"><span class="qz-n">Q' + (qi + 1) + '</span>' + CV.md(q.q) + '</p>' + (q.code ? CV.codeHTML(q.code) : '') +
        '<div class="qz-opts' + (q.opts.every(function (x) { return x.length < 14; }) ? ' short' : '') + '">' + q.opts.map(function (op, i) { return '<button class="qz-o" data-i="' + i + '"><i>' + '①②③④⑤⑥'[i] + '</i><span>' + CV.md(op) + '</span></button>'; }).join('') + '</div><div class="qz-ex" hidden></div></div>');
      box.appendChild(el);
      var answered = false;
      CV.$$('.qz-o', el).forEach(function (b) {
        b.onclick = function () {
          if (answered) return;
          answered = true;
          var i = +b.dataset.i, ok = i === q.a;
          CV.$$('.qz-o', el).forEach(function (x) { var j = +x.dataset.i; x.disabled = true; if (j === q.a) x.classList.add('right'); if (j === i && !ok) x.classList.add('wrong'); });
          var ex = CV.$('.qz-ex', el);
          ex.innerHTML = '<b class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '정답이에요!' : '아쉬워요. 정답은 ' + '①②③④⑤⑥'[q.a] + '번') + '</b> ' + CV.md(q.ex || '') + '<button class="qz-re">다시 풀기</button>';
          ex.hidden = false;
          el.classList.add(ok ? 'is-ok' : 'is-no');
          CV.$('.qz-re', ex).onclick = function () {
            answered = false; el.classList.remove('is-ok', 'is-no'); ex.hidden = true;
            CV.$$('.qz-o', el).forEach(function (x) { x.disabled = false; x.classList.remove('right', 'wrong'); });
          };
          if (onAns) onAns(k, ok);
        };
      });
    });
    host.appendChild(box);
    return box;
  };

  // ------------------------------------------------------------------ 화면
  var CALL = {
    tip: ['💡', '비유로 이해하기'],
    warn: ['⚠️', '자주 틀리는 것'],
    exam: ['📝', '시험 포인트'],
    info: ['🔎', '더 알아보기'],
    fill: ['✏️', '코드 빈칸 대비'],
  };
  function store(ctx) { return ctx.LS.get('concept', null) || { seen: {}, quiz: {} }; }
  function chapStat(ctx, c) {
    var s = store(ctx), seen = 0, q = 0, qok = 0;
    c.sections.forEach(function (sec) {
      if (s.seen[c.id + '.' + sec.id]) seen++;
      (sec.quiz || []).forEach(function (_, i) { q++; if (s.quiz[c.id + '.' + sec.id + '.' + i]) qok++; });
    });
    var tot = c.sections.length + q;
    return { seen: seen, n: c.sections.length, q: q, qok: qok, pct: tot ? Math.round(100 * (seen + qok) / tot) : 0 };
  }
  function topbar(ctx, sub, right) {
    return '<header class="topbar"><div class="tb-in"><div class="brand"><a class="brand-a" href="#/">' + (ctx.IMG.logo ? '<img src="' + ctx.IMG.logo + '" alt="">' : '') + '<b>러닝메이트</b></a><span class="sep">·</span><span class="t">' + sub + '</span></div><div class="tb-r">' + (right || '') + '<a class="btn sm" href="#/">처음으로</a></div></div></header>';
  }

  CV.show = function (el, parts, ctx) {
    CV.ctx = ctx;
    CV.players = [];
    activePlayer = null;
    var cid = parts[1];
    var c = CV.chapters.filter(function (x) { return x.id === cid; })[0];
    if (c) return showChapter(el, c, parts[2], ctx);
    return showHome(el, ctx);
  };

  function showHome(el, ctx) {
    document.title = '개념 정리 - 자료구조 중간고사 연습실';
    var stats = CV.chapters.map(function (c) { return chapStat(ctx, c); });
    var all = stats.reduce(function (a, s) { return a + s.pct; }, 0) / Math.max(1, stats.length);
    var last = ctx.LS.get('concept.last', null);
    el.innerHTML = topbar(ctx, '개념 정리') +
      '<main class="cvh">' +
      '<section class="cvh-hero"><div><p class="eyebrow">중간고사 범위 Ch.1 ~ Ch.6 · 그림으로 보는 자료구조</p><h1>개념 정리</h1>' +
      '<p class="lead">단원마다 <b>움직이는 그림</b>을 한 단계씩 넘겨 보고, 핵심 정리 → 시험 포인트 → <b>개념 체크</b> 순서로 확인해요. 📝 <b>시험 포인트</b>와 ✏️ <b>코드 빈칸 대비</b>는 필기 시험(지필 · Closed Book) 기준이에요. 다 보면 그 단원 <b>필기 문제</b>를 바로 풀러 갈 수 있어요.</p>' +
      '<div class="cvh-prog"><div class="ring" style="--p:' + all + '"><span>' + Math.round(all) + '<small>%</small></span></div><div><b>전체 진도</b><span>그림을 본 섹션 + 맞힌 개념 체크 기준</span>' +
      (last && CV.chapters.some(function (c) { return c.id === last; }) ? '<a class="btn sm pri" href="#/learn/' + last + '">이어서 보기 →</a>' : '<a class="btn sm pri" href="#/learn/' + CV.chapters[0].id + '">Ch.1부터 시작 →</a>') + '</div></div>' +
      '</div>' + (ctx.IMG.mascot ? '<img class="mascot" src="' + ctx.IMG.mascot + '" alt="">' : '') + '</section>' +
      (ctx.written && ctx.written.countType && ctx.written.countType('fill') ? '<button class="cvh-lab" id="cvh-lab"><span class="ic">✍️</span><span><b>시험 대비: 코드 빈칸 ' + ctx.written.countType('fill') + '문항</b><small>수업 실습 코드(LinkedListBasic · 원형 · 이중 연결 리스트 · ListStack · LinkedStack · postfix)와 재귀 · 배열 리스트 코드의 빈칸을 채워요. 개념을 본 뒤 바로 풀어 보세요.</small></span><em>풀어 보기 →</em></button>' : '') +
      '<section class="cvh-grid">' + CV.chapters.map(function (c, i) {
        var s = stats[i], np = ctx.written ? ctx.written.count(c.no) : 0;
        return '<a class="cvc" href="#/learn/' + c.id + '" style="--cc:' + (c.color || '#286b82') + '">' +
          '<div class="cvc-art">' + (c.art || '') + '</div>' +
          '<div class="cvc-b"><span class="cvc-no">Ch.' + c.no + '</span><h3>' + esc(c.title) + '</h3><p>' + esc(c.sub) + '</p>' +
          '<ul>' + c.sections.slice(0, 6).map(function (x) { return '<li>' + esc(x.short || x.title) + '</li>'; }).join('') + (c.sections.length > 6 ? '<li>…</li>' : '') + '</ul>' +
          '<div class="cvc-f"><div class="bar"><i style="width:' + s.pct + '%"></i></div><span>' + s.pct + '%</span>' + (np ? '<em>필기 ' + np + '문항</em>' : '<em>개념</em>') + '</div></div></a>';
      }).join('') + '</section>' +
      '<p class="foot">그림 아래 ◀ ▶ 버튼(또는 키보드 ← →)으로 한 단계씩 넘기고, ▶ 자동 재생과 속도(0.5× ~ 2×)도 바꿀 수 있어요. 코드 예시는 강의 교재와 비슷한 스타일로 새로 쓴 것이라 표현이 조금 다를 수 있어요.</p>' +
      '</main>';
    var lb = CV.$('#cvh-lab', el); if (lb) lb.onclick = function () { ctx.written.startType('fill'); };
  }

  function showChapter(el, c, secId, ctx) {
    document.title = 'Ch.' + c.no + ' ' + c.title + ' - 개념 정리';
    ctx.LS.set('concept.last', c.id);
    ctx.track('concept');
    var idx = CV.chapters.indexOf(c), prevC = CV.chapters[idx - 1], nextC = CV.chapters[idx + 1];
    var st = chapStat(ctx, c);
    el.innerHTML = topbar(ctx, '<a href="#/learn" class="crumb-a">개념 정리</a> · Ch.' + c.no + ' ' + esc(c.title)) +
      '<div class="cvp" style="--cc:' + (c.color || '#286b82') + '">' +
      '<aside class="cvp-toc"><a class="toc-back" href="#/learn">← 개념 정리 홈</a><div class="toc-ch">Ch.' + c.no + ' ' + esc(c.title) + '</div><ol>' +
      c.sections.map(function (s, i) { return '<li><a href="#/learn/' + c.id + '/' + s.id + '" data-sec="' + s.id + '"><span>' + c.no + '-' + (i + 1) + '</span>' + esc(s.short || s.title) + '</a></li>'; }).join('') +
      '<li><a href="#/learn/' + c.id + '/practice" data-sec="practice" class="toc-go"><span>▶</span>필기 문제 풀기</a></li></ol>' +
      '<div class="toc-prog"><div class="bar"><i style="width:' + st.pct + '%"></i></div><small id="tocp">섹션 ' + st.seen + '/' + st.n + ' · 체크 ' + st.qok + '/' + st.q + '</small></div></aside>' +
      '<main class="cvp-main">' +
      '<header class="cvp-head"><div class="cvp-art">' + (c.art || '') + '</div><div><p class="eyebrow">Ch.' + c.no + (c.book ? ' · ' + esc(c.book) : '') + '</p><h1>' + esc(c.title) + '</h1><p class="lead">' + CV.md(c.intro || c.sub) + '</p>' +
      (c.goals ? '<ul class="goals">' + c.goals.map(function (g) { return '<li>' + CV.md(g) + '</li>'; }).join('') + '</ul>' : '') + '</div></header>' +
      '<div id="secs"></div>' +
      '<section class="cvs practice" id="sec-practice" data-sec="practice"></section>' +
      '<nav class="cvp-nav">' + (prevC ? '<a class="btn" href="#/learn/' + prevC.id + '">← Ch.' + prevC.no + ' ' + esc(prevC.title) + '</a>' : '<a class="btn" href="#/learn">← 개념 정리 홈</a>') +
      (nextC ? '<a class="btn pri" href="#/learn/' + nextC.id + '">Ch.' + nextC.no + ' ' + esc(nextC.title) + ' →</a>' : '<a class="btn pri" href="#/">처음으로 →</a>') + '</nav>' +
      '</main></div>';
    var secs = CV.$('#secs', el);
    var S = store(ctx);
    function save() { ctx.LS.set('concept', S); var s2 = chapStat(ctx, c); var p = CV.$('#tocp', el); if (p) { p.textContent = '섹션 ' + s2.seen + '/' + s2.n + ' · 체크 ' + s2.qok + '/' + s2.q; CV.$('.toc-prog .bar i', el).style.width = s2.pct + '%'; } }
    c.sections.forEach(function (s, i) {
      var sec = CV.node('<section class="cvs" id="sec-' + s.id + '" data-sec="' + s.id + '"><div class="cvs-h"><span class="cvs-no">' + c.no + '-' + (i + 1) + '</span><div><h2>' + esc(s.title) + '</h2>' + (s.lead ? '<p class="cvs-lead">' + CV.md(s.lead) + '</p>' : '') + '</div></div></section>');
      secs.appendChild(sec);
      (s.viz ? [].concat(s.viz) : []).forEach(function (vid) {
        var box = CV.node('<div class="cvv" data-viz="' + vid + '"></div>');
        sec.appendChild(box);
        var fn = CV.viz[vid];
        if (!fn) { box.innerHTML = '<p class="cvv-miss">그림 준비 중: ' + esc(vid) + '</p>'; return; }
        try { var r = fn(box, s, c); if (typeof r === 'function') ctx.onCleanup(r); } catch (e) { console.error('viz error', vid, e); box.innerHTML = '<p class="cvv-miss">그림을 그리지 못했어요.</p>'; }
      });
      if (s.points && s.points.length) sec.appendChild(CV.node('<ul class="pts">' + s.points.map(function (p) { return '<li>' + CV.md(p) + '</li>'; }).join('') + '</ul>'));
      if (s.code) [].concat(s.code).forEach(function (cd) { sec.appendChild(CV.node('<div class="cvs-code">' + CV.codeHTML(cd.src, cd.title) + (cd.note ? '<p class="code-note">' + CV.md(cd.note) + '</p>' : '') + '</div>')); });
      if (s.table) sec.appendChild(CV.node('<div class="cvt-wrap"><table class="cvt">' + '<thead><tr>' + s.table.head.map(function (h) { return '<th>' + CV.md(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + s.table.rows.map(function (r) { return '<tr>' + r.map(function (x, j) { return (j ? '<td>' : '<th scope="row">') + CV.md(String(x)) + (j ? '</td>' : '</th>'); }).join('') + '</tr>'; }).join('') + '</tbody></table></div>'));
      if (s.callouts && s.callouts.length) {
        var cw = CV.node('<div class="cos"></div>');
        s.callouts.forEach(function (co) { var m = CALL[co.t] || CALL.info; cw.appendChild(CV.node('<div class="co co-' + co.t + '"><div class="co-h"><span>' + m[0] + '</span>' + esc(co.title || m[1]) + '</div><div class="co-b">' + CV.md(co.text) + '</div></div>')); });
        sec.appendChild(cw);
      }
      if (s.quiz && s.quiz.length) CV.quiz(sec, s.quiz, c.id + '.' + s.id, function (k, ok) { if (ok) S.quiz[k] = 1; save(); });
    });
    // 이 단원 필기 문제 풀기
    var pr = CV.$('#sec-practice', el), nW = ctx.written ? ctx.written.count(c.no) : 0;
    if (nW) {
      pr.innerHTML = '<div class="pr-h"><div><span class="pr-ic">✍️</span><h2>이 단원 필기 문제 (시험 형식)</h2><p>객관식 · 단답형 · 짧은 서술형 · 코드 빈칸 ' + nW + '문항 · 바로 채점 · 오답노트</p></div><button class="btn pri" id="pr-w">필기 문제 풀기</button></div>';
      CV.$('#pr-w', pr).onclick = function () { ctx.written.start(c.no); };
    } else {
      pr.innerHTML = '<div class="pr-h"><div><span class="pr-ic">▶</span><h2>다음 단원으로</h2><p>Ch.' + c.no + '은 개념 단원이에요. 여기서 익힌 “자료구조 = 데이터를 담는 방법 + 연산” 관점으로 다음 단원을 봐 주세요.</p></div><a class="btn pri" href="#/learn/' + (nextC ? nextC.id : '') + '">다음 단원 보기</a></div>';
    }
    // 목차: 클릭 시 스크롤 · 보이는 섹션 표시 · 읽음 기록
    var view = el;
    function scrollTo(id, smooth) {
      var t = CV.$('#sec-' + id, el); if (!t) return;
      var top = t.getBoundingClientRect().top - view.getBoundingClientRect().top + view.scrollTop - 70;
      view.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' });
    }
    CV.$$('.cvp-toc a[data-sec]', el).forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); scrollTo(a.dataset.sec, true); try { history.replaceState(null, '', '#/learn/' + c.id + '/' + a.dataset.sec); } catch (x) { } };
    });
    if (secId) setTimeout(function () { scrollTo(secId, false); }, 30);
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) {
          if (!en.isIntersecting) return;
          var id = en.target.dataset.sec;
          CV.$$('.cvp-toc a[data-sec]', el).forEach(function (a) { a.classList.toggle('on', a.dataset.sec === id); });
          if (id && !S.seen[c.id + '.' + id]) { S.seen[c.id + '.' + id] = 1; save(); }
        });
      }, { root: view, rootMargin: '-30% 0px -55% 0px' });
      CV.$$('.cvs[data-sec]', el).forEach(function (s) { io.observe(s); });
      ctx.onCleanup(function () { io.disconnect(); });
    }
    ctx.onCleanup(function () { CV.players.forEach(function (p) { p.stop(); }); });
  }
})();

</script>
<script>
/* concept/viz/ch1.js */
/* Ch.1 자료구조 소개 — 그림 (분류 지도 · ADT · 자료구조×알고리즘 · 효율) */
(function () {
  'use strict';
  var CV = window.CV, esc = CV.esc;

  // ------------------------------------------------------------------ 분류 지도
  var ICON = {
    array: '<svg viewBox="0 0 72 40"><g fill="#fff" stroke="#286b82" stroke-width="2">' + [0, 1, 2, 3].map(function (i) { return '<rect x="' + (4 + i * 16) + '" y="8" width="16" height="18" rx="2"/>'; }).join('') + '</g>' + [0, 1, 2, 3].map(function (i) { return '<text x="' + (12 + i * 16) + '" y="37" font-size="8" fill="#8a9095" text-anchor="middle">' + i + '</text>'; }).join('') + '</svg>',
    linked: '<svg viewBox="0 0 72 40"><g fill="#fff" stroke="#286b82" stroke-width="2"><rect x="3" y="12" width="16" height="14" rx="2"/><rect x="28" y="12" width="16" height="14" rx="2"/><rect x="53" y="12" width="16" height="14" rx="2"/></g><g stroke="#286b82" stroke-width="2" fill="none"><path d="M19 19h7M44 19h7"/></g><path d="M25 16l4 3-4 3zM50 16l4 3-4 3z" fill="#286b82"/></svg>',

<script>

      { line: null, cap: '1부터 4까지의 합 `sum_to(4)`를 구하고 싶어요. 재귀는 “**더 작은 같은 문제**”로 바꿔서 생각하는 방법이에요.', lv: ['q'], val: [], fall: 0 },

      { line: 3, cap: '`sum_to(3) = 3 + 3 = 6` — 처음에 “믿었던” 값이 정말 6이 맞았어요.', lv: ['o', 'o', 'o', 'o', 'base'], val: [null, 6, 3, 1], fall: 4 },
      { line: 3, tone: 'good', cap: '`sum_to(4) = 4 + 6 = 10` 완성! **수학적 귀납법**과 같아요: ① 첫 도미노(기저)가 넘어지고 ② k번째가 넘어지면 k+1번째도 넘어지니 → 전부 넘어져요.', lv: ['o', 'o', 'o', 'o', 'base'], val: [10, 6, 3, 1], fall: 5 },

  // frames: [{k, name, loc, expr, st:'run'|'wait'|'ret'|'main', ret}]
  function stackSteps(mode, N, arr) {

      var v = call(n - 1);

  }
  function noneSteps(N) {

  // ------------------------------------------------------------------ 입력 · 출력

    st.push(Object.assign({}, base, { stage: 1, line: 0, cap: "`input()` : 한 줄을 통째로 **문자열**로 읽어요 → `'" + line.trim() + "'`. 숫자처럼 보여도 아직 글자예요." }));

    st.push(Object.assign({}, base, { stage: 4, ints: ints, outs: [String(sum), ints.join(' '), ints.join(' ')], line: 5, tone: 'good', cap: "`' '.join(map(str, arr))` : join은 **문자열만** 이어 붙여서 `map(str, …)`이 필요해요. 결과는 print(*arr)와 같아요." }));

  CV.c4io = ioSteps;
  function ioDraw(svg, N) {

        var h = '<rect class="c4-con" x="0" y="0" width="' + CW + '" height="' + (24 + s.outs.length * 19) + '" rx="6"/>' + CV.t(10, 15, '출력', 'c4-cont', 'start');
        s.outs.forEach(function (o, i) { h += '<text class="c4-conl" x="10" y="' + (35 + i * 19) + '">' + esc(o) + '</text>'; });
        it.push({ k: 'out', x: X, y: 158, h: h });

      sc.render(it);

  }
  CV.def('py-io', function (host) {
    var N = host.clientWidth < 560;
    var svg = CV.svg(N ? 360 : 480, 236, 'c4-iosvg', '입력 한 줄을 정수 리스트로');
    var P;
    CV.form(host, {
      fields: [{ k: 'line', label: '입력 한 줄 (공백 구분)', v: '3 5 1 9', w: 200 }],

<script>
/* concept/viz/ch5_array.js */
/* Ch.5 리스트 I — 배열 리스트(순차 리스트) 그림: 칸 밀기 · 당기기 · 크기 늘리기 */
(function () {
  'use strict';
  var CV = window.CV;
  var NARROW = (window.innerWidth || 1024) < 600;
  var CW = NARROW ? 46 : 60, CH = NARROW ? 46 : 50, X0 = NARROW ? 8 : 30, Y0 = 74, CAP = 8;

  function cellItems(cap, opt) {
    opt = opt || {};
    var it = [];
    for (var k = 0; k < cap; k++) {
      var cls = 'cell' + (k >= opt.n ? ' empty' : '') + (opt.hl === k ? ' hl' : '') + (opt.ok === k ? ' ok' : '');
      it.push({ k: 'c' + k, x: X0 + k * CW, y: Y0, h: '<rect class="cb" x="0" y="0" width="' + CW + '" height="' + CH + '"/>' + CV.t(CW / 2, CH + 18, k, 'ci'), cls: cls });
    }
    return it;
  }
  // chips: [{id, v, k(칸), cls, lift}]
  function chipItems(chips) {
    return chips.map(function (c) {
      var y = Y0 + (c.lift ? -66 : 0) + (c.drop || 0);
      return { k: 'v' + c.id, x: X0 + c.k * CW, y: y, h: '<rect class="cb" x="5" y="5" width="' + (CW - 10) + '" height="' + (CH - 10) + '" rx="7"/>' + CV.t(CW / 2, CH / 2 + 6, c.v, 'cv'), cls: 'cell chipc ' + (c.cls || ''), z: !!c.cls };
    });
  }
  function moveArrow(svg, from, to, k) {
    var x1 = X0 + from * CW + CW / 2, x2 = X0 + to * CW + CW / 2, y = Y0 - 4;
    var d = 'M' + x1 + ' ' + y + ' C ' + x1 + ' ' + (y - 34) + ', ' + x2 + ' ' + (y - 34) + ', ' + x2 + ' ' + (y - 3);
    return { k: 'mv' + (k || ''), h: CV.arrowPath(svg, d, 'mvar', 'o'), draw: true };
  }
  function header(svg, st) {
    return [
      { k: 'nlab', x: X0, y: 26, h: CV.t(0, 0, 'n = ' + st.n + '  (원소 수)', 'lbl big', 'start') },
      { k: 'cap', x: X0 + CAP * CW, y: 26, h: CV.t(0, 0, '칸 ' + CAP + '개 (capacity)', 'lbl sm', 'end') },
      { k: 'cnt', x: X0 + CAP * CW, y: Y0 + CH + 50, h: '<text class="lbl big" text-anchor="end">옮긴 횟수 <tspan class="cntv">' + st.moves + '</tspan>번</text>' },
    ];
  }

  var CODES = {
    insert: 'def insert(a, n, i, x):     # n: 원소 수\n    for k in range(n-1, i-1, -1):\n        a[k+1] = a[k]       # 오른쪽으로\n    a[i] = x\n    n += 1',
    pop: 'def pop(a, n, i):\n    x = a[i]\n    for k in range(i, n-1):\n        a[k] = a[k+1]       # 왼쪽으로\n    n -= 1\n    return x',
    append: 'def append(a, n, x):\n    a[n] = x                # 끝 칸에 바로\n    n += 1',
  };
  var uid = 0;
  function mk(vals) { return vals.map(function (v, k) { return { id: ++uid, v: v, k: k }; }); }
  function clone(ch) { return ch.map(function (c) { return Object.assign({}, c); }); }

  function insSteps(vals, i, x) {
    var ch = mk(vals), n = vals.length, mv = 0, S = [];
    var snap = function (o) { return Object.assign({ chips: clone(ch), n: n, moves: mv }, o); };
    S.push(snap({ line: 0, hl: i, cap: '`insert(' + i + ', ' + x + ')` : ' + i + '번 칸에 ' + x + '을(를) 넣으려면 그 칸이 비어야 해요. 배열은 칸이 **빈틈없이 붙어 있어서** ' + i + '번부터 끝(' + (n - 1) + '번)까지를 한 칸씩 **오른쪽으로 밀어야** 해요.' + (i === n ? ' (i가 n과 같으면 밀 게 없어요.)' : '') }));
    for (var k = n - 1; k >= i; k--) {
      var c = ch.filter(function (q) { return q.k === k && !q.ghost; })[0];
      ch.forEach(function (q) { q.cls = ''; });
      // 원래 칸에는 같은 값이 남아 있음(복사) → 흐린 사본
      ch.push({ id: ++uid, v: c.v, k: k, ghost: true, cls: 'dim' });
      c.k = k + 1; c.cls = 'mv';
      ch = ch.filter(function (q) { return !(q.ghost && q.k === k + 1); });
      mv++;
      S.push(snap({ line: [1, 2], arrow: [k, k + 1], cap: '`a[' + (k + 1) + '] = a[' + k + ']` : ' + c.v + '을(를) ' + k + '번 → ' + (k + 1) + '번으로 복사 (' + mv + '번째 이동). **뒤에서부터** 옮겨야 아직 안 옮긴 값을 덮어쓰지 않아요.', vars: [['k', k, 'chg'], ['n', n]] }));
    }
    ch.forEach(function (q) { q.cls = ''; });
    ch = ch.filter(function (q) { return !(q.ghost && q.k === i); });
    ch.push({ id: ++uid, v: x, k: i, cls: 'new' });
    S.push(snap({ line: 3, cap: '`a[' + i + '] = ' + x + '` : 비워 둔 ' + i + '번 칸에 새 값을 넣어요.', vars: [['n', n]] }));
    n++;
    ch.forEach(function (q) { if (q.cls === 'new') q.cls = 'ok'; });
    S.push(snap({ line: 4, tone: 'good', cap: '`n += 1` → n = ' + n + '. 원소를 **' + mv + '번** 옮겼어요. 맨 앞(i=0)에 넣으면 n번 모두 옮겨야 해서 **O(n)**, 맨 끝이면 0번이라 **O(1)**이에요.', vars: [['n', n, 'chg']] }));
    return S;
  }
  function popSteps(vals, i) {
    var ch = mk(vals), n = vals.length, mv = 0, S = [];
    var snap = function (o) { return Object.assign({ chips: clone(ch), n: n, moves: mv }, o); };
    S.push(snap({ line: 0, hl: i, cap: '`pop(' + i + ')` : ' + i + '번 원소를 꺼내면 그 자리가 비어요. 빈틈이 있으면 안 되니까 **뒤의 원소들을 한 칸씩 왼쪽으로 당겨야** 해요.' }));
    var t = ch.filter(function (q) { return q.k === i; })[0];
    t.lift = true; t.cls = 'hl';
    S.push(snap({ line: 1, cap: '`x = a[' + i + ']` : 꺼낼 값 ' + t.v + '을(를) x에 기억해 둬요.', vars: [['x', t.v, 'chg'], ['n', n]] }));
    ch = ch.filter(function (q) { return q !== t; });
    var held = Object.assign({}, t);
    for (var k = i; k < n - 1; k++) {
      var c = ch.filter(function (q) { return q.k === k + 1 && !q.ghost; })[0];
      ch.forEach(function (q) { q.cls = ''; });
      ch = ch.filter(function (q) { return !(q.ghost && q.k === k); });
      ch.push({ id: ++uid, v: c.v, k: k + 1, ghost: true, cls: 'dim' });
      c.k = k; c.cls = 'mv';
      mv++;
      S.push(snap({ line: [2, 3], arrow: [k + 1, k], held: held, cap: '`a[' + k + '] = a[' + (k + 1) + ']` : ' + c.v + '을(를) ' + (k + 1) + '번 → ' + k + '번으로 당겨요 (' + mv + '번째 이동). 이번엔 **앞에서부터** 옮겨요.', vars: [['x', held.v], ['k', k, 'chg'], ['n', n]] }));
    }
    ch.forEach(function (q) { q.cls = ''; });
    n--;
    S.push(snap({ line: 4, held: held, cap: '`n -= 1` → n = ' + n + '. 맨 끝 칸(' + n + '번)에 남은 흐린 값은 이제 리스트가 아니에요 (n개까지만 유효).', vars: [['x', held.v], ['n', n, 'chg']] }));
    S.push(snap({ line: 5, held: held, tone: 'good', cap: '`return x` → ' + held.v + '. 원소를 **' + mv + '번** 옮겼어요. `pop(0)`은 n-1번 옮겨서 **O(n)**, `pop()`(맨 끝)은 옮길 게 없어서 **O(1)**이에요.', vars: [['x', held.v], ['n', n]] }));
    return S;
  }
  function appSteps(vals, x) {
    var ch = mk(vals), n = vals.length, S = [];
    var snap = function (o) { return Object.assign({ chips: clone(ch), n: n, moves: 0 }, o); };
    S.push(snap({ line: 0, hl: n < CAP ? n : null, cap: '`append(' + x + ')` : 맨 끝 다음 칸은 **a[n] = a[' + n + ']** 이에요. 위치를 바로 계산할 수 있어요.' }));
    if (n >= CAP) {
      S.push(snap({ line: 1, tone: 'bad', cap: '빈 칸이 없어요! 실제 파이썬 리스트는 이럴 때 **더 큰 배열을 새로 만들어 옮겨요** (아래 “크기 늘리기”).' }));
      return S;
    }
    ch.push({ id: ++uid, v: x, k: n, cls: 'new' });
    S.push(snap({ line: 1, cap: '`a[' + n + '] = ' + x + '` : 끝 칸에 바로 넣어요. 다른 원소는 **하나도 안 움직여요**.' }));
    n++;
    ch.forEach(function (q) { q.cls = q.cls === 'new' ? 'ok' : ''; });
    S.push(snap({ line: 2, tone: 'good', cap: '`n += 1` → n = ' + n + '. 옮긴 횟수 0번 → **O(1)**. 그래서 리스트 끝에 넣고 빼는 `append` / `pop()`이 빨라요.', vars: [['n', n, 'chg']] }));
    return S;
  }

  CV.arrSim = { ins: insSteps, pop: popSteps, app: appSteps };
  CV.def('arr-ops', function (host) {
    var svg = CV.svg(X0 * 2 + CAP * CW, Y0 + CH + 62, '', '배열 리스트의 삽입과 삭제');
    var sc = CV.scene(svg), P, F;
    function draw(st) {
      var it = cellItems(CAP, { n: st.n, hl: st.hl });
      it = it.concat(chipItems(st.chips.filter(function (c) { return !c.lift; })));
      if (st.held) it = it.concat(chipItems([Object.assign({}, st.held, { lift: true })]));
      it = it.concat(chipItems(st.chips.filter(function (c) { return c.lift; })));
      if (st.arrow) it.push(moveArrow(svg, st.arrow[0], st.arrow[1], 'a'));
      if (st.held || st.chips.some(function (c) { return c.lift; })) {
        var hv = st.held || st.chips.filter(function (c) { return c.lift; })[0];
        it.push({ k: 'xlab', x: X0 + hv.k * CW + CW + 8, y: Y0 - 34, h: CV.t(0, 0, '← x', 'lbl red', 'start') });
      }
      sc.render(it.concat(header(svg, st)));
    }
    function parse(v, needI, needX, op) {
      var vals = CV.valsOf(v.vals, CAP - (op === 'pop' ? 0 : 1));
      if (typeof vals === 'string') return vals.replace('노드는', '원소는');
      var i = null, x = null;
      if (needI) { if (!/^\d+$/.test(v.i.trim())) return '위치 i는 0 이상의 정수로 입력해 주세요.'; i = +v.i.trim(); }
      if (needX) { if (!/^-?\d{1,3}$/.test(v.x.trim())) return '값 x는 -99 ~ 999 사이의 정수로 입력해 주세요.'; x = +v.x.trim(); }
      if (op === 'insert' && i > vals.length) return 'insert의 i는 0 ~ n(' + vals.length + ') 사이여야 해요.';
      if (op === 'pop' && !vals.length) return '빈 리스트에서는 pop할 수 없어요 (IndexError).';
      if (op === 'pop' && i >= vals.length) return 'pop의 i는 0 ~ n-1(' + (vals.length - 1) + ') 사이여야 해요. 없는 칸이면 IndexError예요.';
      return { vals: vals, i: i, x: x };
    }
    F = CV.form(host, {
      fields: [{ k: 'vals', label: '배열 값 (최대 7개)', v: '3, 8, 5, 1, 9', w: 160 }, { k: 'i', label: '위치 i', v: '1', w: 60 }, { k: 'x', label: '값 x', v: '7', w: 60 }],
      buttons: [{ t: 'insert(i, x)', a: 'run', cls: 'pri' }, { t: 'pop(i)', a: 'pop' }, { t: 'append(x)', a: 'append' }],
      on: function (a, v) {
        var op = a === 'run' ? 'insert' : a;
        var r = parse(v, op !== 'append', op !== 'pop', op);
        if (typeof r === 'string') return r;
        P.setCode(CODES[op]);
        P.load(op === 'insert' ? insSteps(r.vals, r.i, r.x) : op === 'pop' ? popSteps(r.vals, r.i) : appSteps(r.vals, r.x));
      },
    });
    P = CV.player(host, { id: 'arr-ops', codeTitle: '배열 내부 동작 (개념 코드)', code: CODES.insert, draw: draw, interval: 1300 });
    P.stage.appendChild(svg);
    P.load(insSteps([3, 8, 5, 1, 9], 1, 7));
  });

  // ------------------------------------------------------------------ 크기 늘리기 (resizing)
  var RS_CODE = 'def append(self, x):\n    if self.n == self.cap:          # 꽉 참\n        new = [None] * (2 * self.cap)\n        for k in range(self.n):\n            new[k] = self.a[k]      # 복사\n        self.a = new\n        self.cap *= 2\n    self.a[self.n] = x\n    self.n += 1';
  function resizeSteps(total) {
    var S = [], cap = 2, n = 0, copies = 0, work = [], vals = [], arr = 0;
    function snap(o) { return Object.assign({ capa: cap, n: n, vals: vals.slice(), copies: copies, work: work.slice(), arr: arr }, o); }
    S.push(snap({ line: [], cap: '처음 배열은 칸이 **2개**예요. 1부터 ' + total + '까지 차례로 `append` 해 볼게요. 막대그래프는 append마다 한 일(복사 + 넣기)의 양이에요.' }));
    for (var x = 1; x <= total; x++) {
      var w = 1;
      if (n === cap) {
        S.push(snap({ line: 1, full: true, next: x, tone: 'bad', cap: x + '을(를) 넣으려는데 **' + cap + '칸이 꽉 찼어요.**' }));
        S.push(snap({ line: 2, newCap: cap * 2, next: x, cap: '2배 크기(**' + (cap * 2) + '칸**)의 새 배열을 만들어요.' }));
        copies += n; w += n; arr++;
        cap *= 2;
        S.push(snap({ line: [3, 4, 5, 6], moved: true, oldCap: cap / 2, newCap: cap, next: x, cap: '원소 **' + n + '개를 전부 복사**하고 새 배열로 바꿔요. 이번 append는 일을 ' + (n + 1) + '만큼 해요 (가끔 비싸요).', vars: [['capacity', cap, 'chg'], ['n', n]] }));
      }
      vals.push(x); n++; work.push(w);
      S.push(snap({ line: [7, 8], last: x, cap: '`append(' + x + ')` → 칸 ' + (n - 1) + '에 넣기.' + (w === 1 ? ' 빈칸이 있어서 바로 끝 (일 1).' : ''), vars: [['capacity', cap], ['n', n, 'chg']] }));
    }
    var tot = work.reduce(function (a, b) { return a + b; }, 0);
    S.push(snap({ line: [], tone: 'good', cap: 'append ' + total + '번에 한 일은 모두 **' + tot + '** (복사 ' + copies + ' + 넣기 ' + total + '). 평균 **' + (tot / total).toFixed(2) + '**번 → 2배씩 늘리면 복사가 드물어서 append는 평균 **O(1)** (분할 상환)이에요.' }));
    return S;
  }
  CV.resizeSteps = resizeSteps;
  CV.def('arr-resize', function (host) {
    var W = 600, cw = 34, x0 = 20;
    var svg = CV.svg(W, 312, '', '배열 크기 늘리기');
    var sc = CV.scene(svg), P;
    function draw(st) {
      var it = [];
      var capA = st.oldCap || st.capa, yv = st.moved ? 116 : 40;
      it.push({ k: 'lab1', x: x0, y: 30, h: CV.t(0, 0, st.moved ? '옛 배열 (칸 ' + capA + '개) → 버려요' : '배열 a (칸 ' + capA + '개)', 'lbl' + (st.moved ? ' red' : ''), 'start') });
      for (var k = 0; k < 16; k++) {
        var on = k < capA;
        it.push({ k: 'c' + k, x: x0 + k * cw, y: 40, h: '<rect class="cb" width="' + cw + '" height="' + cw + '"/>', cls: 'cell' + (k >= st.n ? ' empty' : '') + (st.full && on ? ' hl' : '') + (st.moved ? ' dim' : ''), s: on ? 1 : 0.001 });
      }
      st.vals.forEach(function (v, k) {
        it.push({ k: 'v' + v, x: x0 + k * cw, y: yv, h: CV.t(cw / 2, cw / 2 + 6, v, 'cv'), cls: 'cell' + (v === st.last ? ' newv' : ''), z: true });
      });
      if (st.newCap) {
        it.push({ k: 'lab2', x: x0, y: 106, h: CV.t(0, 0, (st.moved ? '새 배열 → 이제 이게 a (칸 ' : '새 배열 (칸 ') + st.newCap + '개)', 'lbl org', 'start') });
        for (var j = 0; j < st.newCap; j++) it.push({ k: 'nc' + j, x: x0 + j * cw, y: 116, h: '<rect class="cb" width="' + cw + '" height="' + cw + '"/>', cls: 'cell new' + (st.moved && j < st.n ? '' : ' empty') });
        if (st.moved) it.push({ k: 'cpar', h: CV.arrowPath(svg, 'M' + (x0 + st.n * cw + 14) + ' 66 C ' + (x0 + st.n * cw + 40) + ' 80, ' + (x0 + st.n * cw + 40) + ' 100, ' + (x0 + st.n * cw + 14) + ' 112', '', 'o'), draw: true });
      }
      // 막대: append마다 한 일
      var bx = x0, by = 290, bw = 30, unit = 12;
      it.push({ k: 'axis', h: '<line x1="' + bx + '" y1="' + by + '" x2="' + (bx + 16 * (bw + 4)) + '" y2="' + by + '" stroke="#c9ced0"/>' });
      it.push({ k: 'blab', x: bx, y: 172, h: CV.t(0, 0, 'append마다 한 일 (넣기 1 + 복사)', 'lbl', 'start') });
      st.work.forEach(function (w, k) {
        var h = w * unit;
        it.push({ k: 'b' + k, x: bx + k * (bw + 4), y: by - h, h: '<rect width="' + bw + '" height="' + h + '" rx="3" fill="' + (w > 1 ? '#e8890c' : '#559cb5') + '"/>' + CV.t(bw / 2, -5, w, 'lbl') + CV.t(bw / 2, h + 15, k + 1, 'lbl sm') });
      });
      it.push({ k: 'cnt', x: W - 10, y: 30, h: '<text class="lbl big" text-anchor="end">복사 누적 ' + st.copies + '번</text>' });
      sc.render(it);
    }
    P = CV.player(host, { id: 'arr-resize', codeTitle: '크기 늘리기 (개념 코드)', code: RS_CODE, draw: draw, interval: 1200 });
    P.stage.appendChild(svg);
    P.load(resizeSteps(9));
  });
})();

</script>
<script>
/* concept/viz/ch5_linked.js */
/* Ch.5 리스트 II — 연결 리스트 그림 (단순 · 더미 헤드 · 원형 · 이중) */
(function () {
  'use strict';
  var CV = window.CV, LL = CV.LL;
  var GAP = LL.narrow ? 22 : 34, STEP = LL.W + GAP;

  // 연결 리스트 상태를 단계마다 찍어 두는 도구
  // ids: 화면에 보이는 노드 순서(체인), n: {id: {v, cls, x, y}}
  function LLS(vals, o) {
    o = o || {};
    this.o = o;
    this.n = {}; this.nx = {}; this.pv = {}; this.ptr = {}; this.notes = [];
    this.uid = 0;
    var ids = [];
    if (o.dummy) { this.n.D = { v: 'dummy', dummy: true }; ids.push('D'); }
    var self = this;
    vals.forEach(function (v) { var id = 'n' + (self.uid++); self.n[id] = { v: v }; ids.push(id); });
    for (var i = 0; i < ids.length - 1; i++) { this.nx[ids[i]] = ids[i + 1]; if (o.dbl) this.pv[ids[i + 1]] = ids[i]; }
    this.step = (o.dbl ? LL.DW : LL.W) + (o.gap || GAP);
    this.head = ids[0] || null;
    this.x0 = o.x0 == null ? 16 : o.x0; this.y0 = o.y0 == null ? 58 : o.y0;
    this.flow();
  }
  LLS.prototype.add = function (v, x, y) { var id = 'n' + (this.uid++); this.n[id] = { v: v, x: x, y: y, cls: 'new' }; return id; };
  LLS.prototype.chain = function (from) {
    var out = [], seen = {}, c = from === undefined ? this.head : from;
    while (c && !seen[c]) { seen[c] = 1; out.push(c); c = this.nx[c]; }
    return out;
  };
  // 체인에 있는 노드를 한 줄로 다시 놓음
  LLS.prototype.flow = function (except) {
    var self = this;
    this.chain().forEach(function (id, i) {
      if (except && except.indexOf(id) >= 0) return;
      self.n[id].x = self.x0 + i * self.step; self.n[id].y = self.y0;
    });
  };
  LLS.prototype.snap = function (extra) {
    var self = this, links = [];
    Object.keys(this.n).forEach(function (id) {
      if (self.nx[id] !== undefined) links.push({ f: id, t: self.nx[id], cls: (self.lc && self.lc[id]) || '', route: self.rt && self.rt[id], dy: self.rdy && self.rdy[id] });
      if (self.pv[id] !== undefined) links.push({ f: id, t: self.pv[id], kind: 'prev', cls: (self.lpc && self.lpc[id]) || '', route: self.rpt && self.rpt[id] });
    });
    var st = {
      dbl: !!this.o.dbl,
      nodes: Object.keys(this.n).map(function (id) { var x = self.n[id]; return { id: id, v: x.v, x: x.x, y: x.y, cls: (x.cls || '') + (x.dummy ? ' dummy' : ''), dummy: x.dummy, tag: x.tag, tagCls: x.tagCls }; }),
      links: links,
      ptrs: Object.keys(this.ptr).map(function (k) { var p = self.ptr[k]; return { n: k, t: p.t, cls: p.cls, below: p.below }; }),
      notes: this.notes.slice(),
    };
    return Object.assign(st, extra || {});
  };
  CV.LLS = LLS;
  CV.drawLL = function (svg) { return drawLL(svg); };
  CV.LLSTEP = STEP;

  function drawLL(svg) {
    var sc = CV.scene(svg);
    return function (st) { sc.render(LL.items(svg, st.ll)); };
  }
  function valsOf(s, max) {
    s = String(s).trim();
    if (!s) return [];
    var a = s.split(/[\s,]+/).filter(Boolean);
    if (a.length > max) return '노드는 ' + max + '개까지만 넣을 수 있어요.';
    for (var i = 0; i < a.length; i++) if (!/^-?\d{1,3}$/.test(a[i])) return '값은 -99 ~ 999 사이의 정수로, 쉼표나 공백으로 구분해 주세요.';
    return a.map(Number);
  }
  CV.valsOf = valsOf;
  function nodeName(s, id) { return id ? (s.n[id].dummy ? '더미 헤드' : '노드 ' + s.n[id].v) : 'None'; }

  // ------------------------------------------------------------------ 노드와 head (구조)
  CV.def('ll-anatomy', function (host) {
    var svg = CV.svg(680, 210, '', '연결 리스트의 구조');
    var draw = drawLL(svg);
    var steps = [];
    var s = new LLS([10], { x0: 260, y0: 70 });
    s.notes = [{ k: 'a', x: 260 + 26, y: 140, s: 'item (값)', cls: 'org' }, { k: 'b', x: 260 + 65, y: 160, s: 'next (다음 노드 주소)', cls: 'org' }];
    steps.push({ line: [0, 1, 2, 3], cap: '노드(node) 하나는 **값을 담는 칸 item**과 **다음 노드를 가리키는 칸 next**로 이루어져요 (실습 코드 5-1 `ListNode`). 다음 노드가 없으면 next는 `None` (그림의 빗금)이에요.', ll: s.snap() });
    s = new LLS([10, 20, 30], { x0: 120, y0: 70 });
    steps.push({ line: [5, 6, 7], cap: '`ListNode(값, 다음 노드)`로 만들면 next가 다음 노드를 가리키며 **사슬처럼 이어져요**. 메모리에서는 흩어져 있어도 화살표(참조)만 따라가면 순서대로 읽을 수 있어요. (뒤 노드부터 만들어야 넘겨줄 수 있어요)', ll: s.snap() });
    s.ptr.head = { t: s.head, cls: 'red' };
    steps.push({ line: [8], cap: '첫 노드를 가리키는 변수 **head**만 알면 리스트 전체에 닿을 수 있어요. head를 잃으면 리스트 전체를 잃어요!', ll: s.snap() });
    s = new LLS([10, 20, 30], { x0: 120, y0: 70, dummy: true });
    s.ptr.__head = { t: 'D', cls: 'red' };
    s.notes = [{ k: 'c', x: 120 + 39, y: 140, s: "값 자리에 'dummy'", cls: 'mut' }];
    steps.push({ line: [10, 11, 12, 13], cap: '실습 코드의 `LinkedListBasic`(코드 5-15)은 맨 앞에 **더미 헤드** `__head`를 두고, 원소 수를 `__numItems`에 따로 세어요. 실제 값은 더미 다음(0번)부터예요. 덕분에 “맨 앞에 넣기/지우기”도 중간과 **똑같은 코드**로 처리돼요.', ll: s.snap() });
    var P = CV.player(host, {
      id: 'll-anatomy', codeTitle: '실습 코드 5-1 ListNode · 코드 5-15 일부',
      code: "class ListNode:\n    def __init__(self, newItem, nextNode:'ListNode'):\n        self.item = newItem\n        self.next = nextNode\n\nn3 = ListNode(30, None)    # 예시\nn2 = ListNode(20, n3)\nn1 = ListNode(10, n2)\nhead = n1\n\nclass LinkedListBasic:\n    def __init__(self):\n        self.__head = ListNode('dummy', None)\n        self.__numItems = 0",
      draw: draw, onLoad: function (st) { LL.fit(svg, st, 520); },
    });
    P.stage.appendChild(svg);
    P.load(steps);
  });

  // ------------------------------------------------------------------ 순회 · 탐색
  var TRAV_CODE = "# [알고리즘 5-7] (코드 5-15)\ndef index(self, x) -> int:\n    curr = self.__head.next  # 0번 노드\n    for index in range(self.__numItems):\n        if curr.item == x:\n            return index\n        else:\n            curr = curr.next\n    return -2 # 안 쓰는 인덱스";
  function travSteps(vals, x) {
    var s = new LLS(vals, { dummy: true }), steps = [];
    var n = vals.length;
    s.ptr.__head = { t: 'D', cls: 'red' };
    steps.push({ line: 1, cap: '`index(' + x + ')` : 값 ' + x + '이(가) 몇 번 원소인지 찾아요. 배열처럼 `a[i]`로 바로 갈 수 없으니 **앞에서부터 하나씩** 봐야 해요.', ll: s.snap(), vars: [['x', x], ['numItems', n]] });
    var c = s.nx.D, i = 0;
    s.ptr.curr = c ? { t: c, cls: 'org', below: true } : undefined; if (!c) delete s.ptr.curr;
    steps.push({ line: 2, cap: '`curr = self.__head.next` : 더미 다음, 즉 **0번 노드**에서 출발해요.' + (c ? '' : ' (빈 리스트라 None)'), ll: s.snap(), vars: [['x', x], ['curr', c ? '노드 ' + s.n[c].v : 'None', 'chg']] });
    while (i < n) {
      s.n[c].cls = 'visit';
      steps.push({ line: 3, cap: '`for index in range(' + n + ')` : index = ' + i + ' — 원소 수(`__numItems`)만큼 반복해요.', ll: s.snap(), vars: [['x', x], ['curr', '노드 ' + s.n[c].v], ['index', i, 'chg']] });
      if (s.n[c].v === x) {
        s.n[c].cls = 'ok';
        steps.push({ line: 4, cap: '`curr.item == x` → ' + s.n[c].v + ' == ' + x + ' **참!**', ll: s.snap(), vars: [['x', x], ['curr', '노드 ' + s.n[c].v], ['index', i]] });
        steps.push({ line: 5, tone: 'good', cap: '`return ' + i + '`. 비교를 **' + (i + 1) + '번** 했어요. 뒤에 있을수록 오래 걸려요 → 최악 O(n).', ll: s.snap(), vars: [['x', x], ['index', i]] });
        return steps;
      }
      steps.push({ line: 4, cap: '`curr.item == x` → ' + s.n[c].v + ' ≠ ' + x + ' : 아니에요.', ll: s.snap(), vars: [['x', x], ['curr', '노드 ' + s.n[c].v], ['index', i]] });
      c = s.nx[c]; i++;
      if (c) s.ptr.curr.t = c; else { delete s.ptr.curr; s.notes = [{ k: 'none', x: s.x0 + s.chain().length * STEP - 6, y: s.y0 + LL.H + 34, s: 'curr → None', cls: 'org', a: 'start' }]; }
      steps.push({ line: [6, 7], cap: '`curr = curr.next` : ' + (c ? '다음 노드(' + s.n[c].v + ')로 한 칸 이동' : '마지막 노드의 next는 None → curr가 None이 됐어요') + '.', ll: s.snap(), vars: [['x', x], ['curr', c ? '노드 ' + s.n[c].v : 'None', 'chg']] });
    }
    steps.push({ line: 8, tone: 'bad', cap: '반복이 끝날 때까지 없었어요 → **-2** (실습 코드는 “안 쓰는 인덱스” -2를 돌려줘요. 파이썬 list.index처럼 오류를 내지 않아요). 노드 ' + n + '개를 전부 확인했어요.', ll: s.snap(), vars: [['x', x], ['curr', 'None']] });
    return steps;
  }
  CV.travSteps = travSteps;
  CV.def('ll-traverse', function (host) {
    var svg = CV.svg(700, 170, '', '연결 리스트 탐색');
    var P;
    CV.form(host, {
      fields: [{ k: 'vals', label: '리스트 값 (최대 5개)', v: '12, 7, 30, 18', w: 170 }, { k: 'x', label: '찾을 값 x', v: '18', w: 70 }],
      buttons: [{ t: '찾기 실행', a: 'run', cls: 'pri' }],
      presets: [{ t: '뒤쪽에 있음', v: { vals: '12, 7, 30, 18', x: '18' } }, { t: '맨 앞에 있음', v: { vals: '12, 7, 30, 18', x: '12' } }, { t: '없음', v: { vals: '12, 7, 30, 18', x: '99' } }],
      on: function (a, v) {
        var vals = valsOf(v.vals, 5); if (typeof vals === 'string') return vals;
        if (!/^-?\d{1,3}$/.test(v.x.trim())) return '찾을 값은 정수 하나로 입력해 주세요.';
        P.load(travSteps(vals, +v.x.trim()));
      },
    });
    P = CV.player(host, { id: 'll-traverse', codeTitle: '실습 코드 linkedListBasic.py', code: TRAV_CODE, draw: drawLL(svg), onLoad: function (st) { LL.fit(svg, st); } });
    P.stage.appendChild(svg);
    P.load(travSteps([12, 7, 30, 18], 18));
  });

  // ------------------------------------------------------------------ 삽입 insert(i, x)
  var INS_CODE = '# [알고리즘 5-2] (코드 5-15)\ndef insert(self, i:int, newItem):\n    if i >= 0 and i <= self.__numItems:\n        prev = self.__getNode(i - 1)\n        newNode = ListNode(newItem, prev.next)\n        prev.next = newNode\n        self.__numItems += 1\n    else:\n        print("index", i, ": out of bound in insert()")\n\n# [알고리즘 5-6]\ndef __getNode(self, i:int) -> ListNode:\n    curr = self.__head # 더미 헤드, index: -1\n    for index in range(i+1):\n        curr = curr.next\n    return curr';
  function insSteps(vals, i, x) {
    var s = new LLS(vals, { dummy: true }), steps = [], n = vals.length;
    var V = function (o) { var a = [['i', i], ['newItem', x], ['numItems', n]]; Object.keys(o || {}).forEach(function (k) { a.push([k, o[k][0], o[k][1]]); }); return a; };
    s.ptr.__head = { t: 'D', cls: 'red' };
    if (!(i >= 0 && i <= n)) {
      steps.push({ line: 1, cap: '`insert(' + i + ', ' + x + ')` : 원소가 ' + n + '개라 넣을 수 있는 자리는 0 ~ ' + n + '번이에요.', ll: s.snap(), vars: V() });
      steps.push({ line: 2, tone: 'bad', cap: '`i >= 0 and i <= self.__numItems` → **거짓**이에요. 범위를 벗어났어요.', ll: s.snap(), vars: V() });
      s.notes = [{ k: 'msg', x: 16, y: s.y0 + 96, s: 'index ' + i + ' : out of bound in insert()', cls: 'red', a: 'start' }];
      steps.push({ line: [7, 8], tone: 'bad', cap: '`else` : 아무것도 넣지 않고 **`index ' + i + ' : out of bound in insert()`**를 출력해요. (오류로 멈추지 않아요)', ll: s.snap(), vars: V() });
      return steps;
    }
    var where = i === 0 ? '맨 앞' : i === n ? '맨 끝' : i + '번 자리';
    steps.push({ line: 1, cap: '`insert(' + i + ', ' + x + ')` : [' + vals.join(', ') + '] 의 **' + where + '**에 ' + x + '을(를) 넣어요.', ll: s.snap(), vars: V() });
    steps.push({ line: 2, cap: '`0 <= ' + i + ' <= ' + n + '` 이라 범위 안이에요. 먼저 넣을 자리의 **앞 노드(' + (i - 1) + '번)**를 찾아요.', ll: s.snap(), vars: V() });
    var c = 'D';
    s.ptr.curr = { t: c, cls: 'org', below: true };
    steps.push({ line: 12, cap: '`__getNode(' + (i - 1) + ')` : curr는 **더미 헤드(-1번)**에서 출발해요.' + (i === 0 ? ' `range(0)`이라 한 칸도 안 움직여요 → 더미가 바로 앞 노드!' : ' `range(' + i + ')` 만큼 ' + i + '칸 이동해요.'), ll: s.snap(), vars: V({ curr: ['더미'] }) });
    for (var k = 0; k < i; k++) {
      c = s.nx[c]; s.ptr.curr.t = c;
      steps.push({ line: [13, 14], cap: '`curr = curr.next` : ' + k + '번 노드(' + s.n[c].v + ')로 이동' + (k === i - 1 ? ' → 찾았어요!' : ''), ll: s.snap(), vars: V({ curr: ['노드 ' + s.n[c].v, 'chg'] }) });
    }
    delete s.ptr.curr;
    s.ptr.prev = { t: c, cls: 'blue' };
    var after = s.nx[c] || null;
    steps.push({ line: 3, cap: '`prev` = ' + nodeName(s, c) + '. 새 노드는 prev **바로 뒤**에 들어가요. 지금 prev.next는 ' + nodeName(s, after) + '이에요.', ll: s.snap(), vars: V({ prev: [nodeName(s, c), 'chg'] }) });
    var px = s.n[c].x, nxX = after ? s.n[after].x : px + STEP;
    var nid = s.add(x, (px + nxX) / 2, s.y0 + 92);
    s.ptr.newNode = { t: nid, cls: 'org', below: true };
    steps.push({ line: 4, cap: '`ListNode(' + x + ', prev.next)` : **새 노드가 생겼어요** (주황).', ll: s.snap(), vars: V({ prev: [nodeName(s, c)], newNode: ['노드 ' + x, 'chg'] }) });
    s.nx[nid] = after; s.lc = {}; s.lc[nid] = 'new';
    steps.push({ line: 4, cap: '두 번째 인자로 `prev.next`를 넘겼기 때문에, 새 노드는 만들어지자마자 ' + (after ? '**' + nodeName(s, after) + '를 붙잡아요** — “뒤를 먼저 잡기”가 이 한 줄에 들어 있어요.' : '**None**을 가리켜요 (맨 끝이니까요).'), ll: s.snap(), vars: V({ prev: [nodeName(s, c)], newNode: ['노드 ' + x] }) });
    s.nx[c] = nid; s.lc[c] = 'new';
    steps.push({ line: 5, cap: '`prev.next = newNode` : ' + nodeName(s, c) + '의 화살표가 **새 노드로 바뀌었어요.** 연결 완성!', ll: s.snap(), vars: V({ prev: [nodeName(s, c)], newNode: ['노드 ' + x] }) });
    s.n[nid].cls = 'new'; s.flow(); delete s.ptr.newNode; delete s.ptr.prev;
    s.lc = {};
    var res = s.chain().filter(function (id) { return id !== 'D'; }).map(function (id) { return s.n[id].v; });
    n += 1;
    steps.push({ line: 6, cap: '`__numItems += 1` → ' + n + '개. 결과: [' + res.join(', ') + ']. 노드를 **옮기지 않고 화살표 2개만** 바꿨어요 (prev를 찾는 데는 i칸 이동).', ll: s.snap(), tone: 'good', vars: V({ numItems: [n, 'chg'] }) });
    return steps;
  }
  CV.insSteps = insSteps;
  CV.def('ll-insert', function (host) {
    var svg = CV.svg(600, 230, '', '연결 리스트 삽입');
    var P;
    CV.form(host, {
      fields: [{ k: 'vals', label: '리스트 값 (최대 4개)', v: '10, 20, 30', w: 150 }, { k: 'i', label: '위치 i', v: '2', w: 60 }, { k: 'x', label: '넣을 값', v: '25', w: 64 }],
      buttons: [{ t: 'insert 실행', a: 'run', cls: 'pri' }],
      presets: [{ t: '맨 앞 insert(0, 5)', v: { vals: '10, 20, 30', i: '0', x: '5' } }, { t: '중간 insert(2, 25)', v: { vals: '10, 20, 30', i: '2', x: '25' } }, { t: '맨 끝 insert(3, 40)', v: { vals: '10, 20, 30', i: '3', x: '40' } }, { t: '빈 리스트 insert(0, 7)', v: { vals: '', i: '0', x: '7' } }, { t: '범위 밖 insert(5, 9)', v: { vals: '10, 20, 30', i: '5', x: '9' } }],
      on: function (a, v) {
        var vals = valsOf(v.vals, 4); if (typeof vals === 'string') return vals;
        if (!/^-?\d{1,2}$/.test(v.i.trim())) return '위치 i는 정수로 입력해 주세요 (범위 밖 값도 넣어 볼 수 있어요).';
        var i = +v.i.trim();
        if (!/^-?\d{1,3}$/.test(v.x.trim())) return '넣을 값은 정수 하나로 입력해 주세요.';
        P.load(insSteps(vals, i, +v.x.trim()));
      },
    });
    P = CV.player(host, { id: 'll-insert', codeTitle: '실습 코드 linkedListBasic.py', code: INS_CODE, draw: drawLL(svg), onLoad: function (st) { LL.fit(svg, st); } });
    P.stage.appendChild(svg);
    P.load(insSteps([10, 20, 30], 2, 25));
  });

  // ------------------------------------------------------------------ 순서를 바꾸면? (잃어버린 노드)
  CV.def('ll-wrong', function (host) {
    var svg = CV.svg(700, 250, '', '포인터를 바꾸는 순서가 틀렸을 때');
    var draw = drawLL(svg);
    var P;
    function bad() {
      var s = new LLS([10, 20, 30, 40], { x0: 30 }), st = [];
      var ids = s.chain(), prev = ids[1], after = ids[2];
      s.ptr.head = { t: ids[0], cls: 'red' };
      s.ptr.prev = { t: prev, cls: 'blue' };
      st.push({ line: [], cap: '10 → 20 → 30 → 40 에서 20(prev) 뒤에 25를 넣을 거예요. 이번엔 **두 줄의 순서를 바꿔서** 해 볼게요.', ll: s.snap() });
      var nid = s.add(25, (s.n[prev].x + s.n[after].x) / 2, s.y0 + 96);
      s.ptr.newNode = { t: nid, cls: 'org', below: true };
      st.push({ line: 0, cap: '새 노드 25를 만들었어요. 여기까지는 똑같아요.', ll: s.snap() });
      s.nx[prev] = nid; s.lc = {}; s.lc[prev] = 'new';
      s.n[after].cls = 'lost'; s.n[ids[3]].cls = 'lost'; s.lc[after] = 'gone';
      s.notes = [{ k: 'lost', x: (s.n[after].x + s.n[ids[3]].x + LL.W) / 2, y: s.y0 - 14, s: '잃어버린 노드 — 아무도 안 가리켜요', cls: 'red' }, { k: 'x', x: s.n[prev].x + LL.W + GAP / 2 + 4, y: s.y0 + LL.H / 2 - 12, s: '✕ 끊김', cls: 'red' }];
      st.push({ line: 1, tone: 'bad', cap: '`prev.next = newNode` 를 먼저 하면 20 → 30 연결이 끊어져요. 이제 **30을 가리키는 변수가 하나도 없어서** 30, 40을 다시는 찾을 수 없어요 (회색 = 잃어버린 노드).', ll: s.snap() });
      s.nx[nid] = nid; s.rt = {}; s.rt[nid] = 'self'; s.lc[nid] = 'bad';
      s.notes = s.notes.slice(0, 1).concat([{ k: 'loop', x: s.n[nid].x + LL.W + 10, y: s.n[nid].y - 26, s: '자기 자신을 가리킴!', cls: 'red', a: 'start' }]);
      st.push({ line: 2, tone: 'bad', cap: '`newNode.next = prev.next` 인데 prev.next는 **이미 newNode**예요. 그래서 25가 자기 자신을 가리켜요. next를 따라가면 25 → 25 → 25 … **끝나지 않아요** (무한 반복).', ll: s.snap() });
      st.push({ line: [1, 2], tone: 'bad', cap: '결과: 10 → 20 → 25 → 25 → … 30과 40은 사라졌어요. 규칙: **새 노드가 뒤를 먼저 잡고(①), 그다음 앞이 새 노드를 가리킨다(②)**. “뒤 먼저, 앞 나중”!', ll: s.snap() });
      return st;
    }
    function good() {
      var s = new LLS([10, 20, 30, 40], { x0: 30 }), st = [];
      var ids = s.chain(), prev = ids[1], after = ids[2];
      s.ptr.head = { t: ids[0], cls: 'red' };
      s.ptr.prev = { t: prev, cls: 'blue' };
      st.push({ line: [], cap: '같은 상황을 올바른 순서로 해 볼게요.', ll: s.snap() });
      var nid = s.add(25, (s.n[prev].x + s.n[after].x) / 2, s.y0 + 96);
      s.ptr.newNode = { t: nid, cls: 'org', below: true };
      st.push({ line: 0, cap: '새 노드 25를 만들어요.', ll: s.snap() });
      s.nx[nid] = after; s.lc = {}; s.lc[nid] = 'new';
      st.push({ line: 1, cap: '① `newNode.next = prev.next` : 25가 30을 먼저 붙잡아요. 지금 30은 **20과 25 두 곳에서** 가리키고 있어서 안전해요.', ll: s.snap() });
      s.nx[prev] = nid; s.lc[prev] = 'new';
      st.push({ line: 2, cap: '② `prev.next = newNode` : 20이 25를 가리켜요. 아무것도 잃어버리지 않았어요.', ll: s.snap() });
      s.flow(); s.lc = {}; delete s.ptr.newNode;
      st.push({ line: [], tone: 'good', cap: '10 → 20 → 25 → 30 → 40 완성!', ll: s.snap() });
      return st;
    }
    var codes = ['newNode = ListNode(25, None)\nnewNode.next = prev.next   # ① 뒤를 먼저\nprev.next = newNode        # ② 앞을 나중에', 'newNode = ListNode(25, None)\nprev.next = newNode        # ✗ 앞을 먼저 바꾸면…\nnewNode.next = prev.next   # prev.next는 이미 newNode!'];
    CV.tabs(host, [{ t: '✅ 올바른 순서', s: '뒤 먼저 → 앞 나중' }, { t: '❌ 순서를 바꾸면?', s: '잃어버린 노드', bad: true }], function (i) {
      if (!P) return;
      P.setCode(codes[i]); P.load(i ? bad() : good());
    }, 1);
    P = CV.player(host, { id: 'll-wrong', codeTitle: '두 줄로 나눠 쓴 형태', code: codes[1], draw: draw, onLoad: function (st) { LL.fit(svg, st); } });
    P.stage.appendChild(svg);
    P.load(bad());
  });
})();

<script>
/* concept/viz/ch5_more.js */
/* Ch.5 리스트 II — 삭제 · 뒤집기 · head 함정 · 원형 · 요세푸스 · 이중 · 비교 */
(function () {
  'use strict';
  var CV = window.CV, LL = CV.LL, LLS = CV.LLS;

  // ------------------------------------------------------------------ 삭제 pop(i)
  var DEL_CODE = '# [알고리즘 5-3] (코드 5-15)\ndef pop(self, i:int):\n    if (i >= 0 and i <= self.__numItems-1):\n        prev = self.__getNode(i - 1)\n        curr = prev.next\n        prev.next = curr.next\n        retItem = curr.item\n        self.__numItems -= 1\n        return retItem\n    else:\n        return None';
  function delSteps(vals, i) {
    var s = new LLS(vals, { dummy: true }), S = [];
    s.ptr.__head = { t: 'D', cls: 'red' };
    var V = function (o) { var a = [['i', i]]; (o || []).forEach(function (x) { a.push(x); }); return a; };
    if (!(i >= 0 && i <= vals.length - 1)) {

      S.push({ line: [2, 9, 10], tone: 'bad', cap: '범위 검사가 **거짓** → `return None`. 실습 코드의 pop은 범위를 벗어나면 오류 대신 **None**을 돌려줘요.', ll: s.snap(), vars: V() });

    S.push({ line: [1, 2], cap: '`pop(' + i + ')` : ' + i + '번 노드(' + vals[i] + ')를 빼요. 범위 안이에요. 단순 연결 리스트는 **뒤로 갈 수 없어서**, 지울 노드의 **바로 앞 노드(prev)**를 잡아야 해요.', ll: s.snap(), vars: V() });
    var c = 'D';
    s.ptr.prev = { t: c, cls: 'blue' };
    S.push({ line: 3, cap: '`__getNode(' + (i - 1) + ')` : 더미(-1번)에서 출발' + (i === 0 ? '. i-1 = -1 이라 **더미가 바로 prev**예요 — 맨 앞 삭제도 특별 처리가 필요 없어요.' : '해 ' + i + '칸 이동해요.'), ll: s.snap(), vars: V([['prev', '더미', 'chg']]) });
    for (var k = 0; k < i; k++) {
      c = s.nx[c]; s.ptr.prev.t = c;
      S.push({ line: 3, cap: 'prev를 한 칸 옮겨요 → ' + nm(s, c) + (k === i - 1 ? ' (' + (i - 1) + '번, 찾았어요!)' : ''), ll: s.snap(), vars: V([['prev', nm(s, c), 'chg']]) });

    s.nx[c] = after; s.lc = {}; s.lc[c] = 'new'; s.rt = {}; if (after) s.rt[c] = 'under';
    s.n[cur].cls = 'gone'; s.lc[cur] = 'gone';
    S.push({ line: 5, cap: '`prev.next = curr.next` : ' + nm(s, c) + '가 ' + s.n[cur].v + '을(를) **건너뛰고** ' + (after ? nm(s, after) + '를 가리켜요.' : 'None을 가리켜요 (맨 끝 노드를 지웠으니까요).') + ' 이제 next를 따라가면 ' + s.n[cur].v + '을(를) 만나지 않아요.', ll: s.snap(), vars: V([['prev', nm(s, c)], ['curr', nm(s, cur)]]) });
    S.push({ line: 6, cap: '`retItem = curr.item` → ' + s.n[cur].v + '. 지운 값을 돌려주려고 기억해 둬요.', ll: s.snap(), vars: V([['retItem', s.n[cur].v, 'chg']]) });
    S.push({ line: 7, cap: '`__numItems -= 1` → ' + (vals.length - 1) + '개.', ll: s.snap(), vars: V([['retItem', s.n[cur].v], ['numItems', vals.length - 1, 'chg']]) });
    var rv = s.n[cur].v;

    s.flow();

    S.push({ line: 8, tone: 'good', cap: '`return ' + rv + '`. 결과 [' + res.join(', ') + ']. 아무도 가리키지 않는 노드는 파이썬이 알아서 치워요(가비지 컬렉션). 화살표는 **1개만** 바꿨어요.', ll: s.snap(), vars: V([['retItem', rv]]) });

  CV.delSteps = delSteps;
  CV.def('ll-delete', function (host) {
    var svg = CV.svg(600, 200, '', '연결 리스트 삭제'), P;

  // ------------------------------------------------------------------ 뒤집기 (prev · curr · nxt)
  var REV_CODE = 'def reverse(head):\n    prev = None\n    curr = head\n    while curr != None:\n        nxt = curr.next   # ① 다음 기억\n        curr.next = prev  # ② 방향 뒤집기\n        prev = curr       # ③ 한 칸씩\n        curr = nxt        #    앞으로\n    return prev           # 새 head';
  function revSteps(vals) {
    var s = new LLS(vals, { x0: 70, y0: 66 }), S = [];
    var ids = s.chain();
    s.ptr.head = { t: ids[0], cls: 'red', below: true };
    var prev = null, cur = ids[0];
    function P_() {
      s.ptr.prev = prev ? { t: prev, cls: 'blue' } : { t: null, x: 4, y: s.y0 + 10, cls: 'blue', none: false };
      if (cur) s.ptr.curr = { t: cur, cls: 'org' }; else delete s.ptr.curr;
    }
    function V(extra) { return [['prev', prev ? nm(s, prev) : 'None'], ['curr', cur ? nm(s, cur) : 'None']].concat(extra || []); }
    P_();
    s.notes = [{ k: 'pn', x: 4, y: s.y0 + 46, s: '= None', cls: 'mut', a: 'start' }];
    S.push({ line: [1, 2], cap: '세 변수 **prev(이미 뒤집은 쪽), curr(지금 노드), nxt(남은 쪽)**를 써요. 처음엔 prev = None, curr = head.', ll: s.snap(), vars: V() });
    var round = 0;
    while (cur) {
      round++;
      var nx = s.nx[cur] || null;
      s.ptr.nxt = nx ? { t: nx, cls: 'red', below: true } : undefined; if (!nx) delete s.ptr.nxt;
      S.push({ line: [3, 4], cap: '① `nxt = curr.next` : 화살표를 바꾸기 **전에** 다음 노드(' + nm(s, nx) + ')를 기억해 둬요. 안 그러면 뒤쪽을 잃어버려요.', ll: s.snap(), vars: V([['nxt', nx ? nm(s, nx) : 'None', 'chg']]) });
      s.nx[cur] = prev; s.lc = {}; s.lc[cur] = 'new';
      S.push({ line: 5, cap: '② `curr.next = prev` : ' + nm(s, cur) + '의 화살표가 ' + (prev ? '**' + nm(s, prev) + ' 쪽으로** 뒤집혔어요.' : '**None**이 됐어요 (새 리스트의 맨 끝이 될 노드).'), ll: s.snap(), vars: V([['nxt', nx ? nm(s, nx) : 'None']]) });
      prev = cur; P_();
      if (s.notes.length) s.notes = [];
      S.push({ line: 6, cap: '③ `prev = curr` : prev가 ' + nm(s, prev) + '로 왔어요. 여기까지가 “뒤집기 끝난 부분”이에요.', ll: s.snap(), vars: V([['nxt', nx ? nm(s, nx) : 'None']]) });
      cur = nx; P_();

      S.push({ line: 7, cap: '`curr = nxt` : ' + (cur ? '다음 노드 ' + nm(s, cur) + '로 넘어가요. (' + round + '번째 노드 끝)' : 'curr가 None → 반복 끝!'), ll: s.snap(), vars: V([['nxt', nx ? nm(s, nx) : 'None']]) });

  // ------------------------------------------------------------------ 더미 없이 head를 다룰 때
  CV.def('ll-head', function (host) {
    var svg = CV.svg(560, 200, '', 'head를 다룰 때 주의할 점'), P;
    var draw = CV.drawLL(svg);
    var CODES = [
      'def push_front(head, x):\n    node = Node(x)\n    node.next = head   # ① 첫 노드를 잡고\n    head = node        # ② head를 새 노드로\n    return head        # ③ 꼭 돌려주기',
      'def push_back(head, x):\n    while head.next != None:\n        head = head.next   # ✗ head를 옮김\n    head.next = Node(x)\n    return head            # 앞부분이 사라짐',

    function front() {
      var s = new LLS([10, 20, 30], { x0: 120, y0: 60 }), S = [];
      var ids = s.chain();
      s.ptr.head = { t: ids[0], cls: 'red' };
      S.push({ line: 0, cap: '더미가 없는 리스트의 **맨 앞**에 5를 넣어요. 앞 노드(prev)가 없어서 head 자체를 바꿔야 해요.', ll: s.snap() });

      s.ptr.head.t = nid;
      S.push({ line: 3, cap: '② `head = node` : head가 5를 가리켜요. 이 줄이 없으면 head는 여전히 10이라 5는 리스트에 안 보여요.', ll: s.snap() });
      s.head = nid; s.x0 = 16; s.flow(); s.lc = {}; delete s.ptr.node;
      S.push({ line: 4, tone: 'good', cap: '③ `return head` : 함수 안에서 바꾼 head는 **돌려줘야** 밖에서도 바뀌어요. 그래서 이런 함수는 head를 return해요. 결과 [5, 10, 20, 30].', ll: s.snap() });

      S.push({ line: 0, cap: '맨 끝에 40을 붙이려고 **head 변수로 직접** 끝까지 가 볼게요.', ll: s.snap() });
      for (var k = 1; k < ids.length; k++) {

        s.n[ids[k - 1]].cls = 'lost';
        S.push({ line: [1, 2], tone: k === ids.length - 1 ? 'bad' : '', cap: '`head = head.next` → head가 ' + s.n[ids[k]].v + '로 왔어요. 그런데 **' + s.n[ids[0]].v + (k > 1 ? '~' + s.n[ids[k - 1]].v : '') + '을(를) 가리키는 변수가 이제 없어요!**', ll: s.snap() });
      }

      S.push({ line: 3, cap: '`head.next = Node(40)` : 40은 잘 붙었어요.', ll: s.snap() });
      s.notes = [{ k: 'r', x: 16, y: 150, s: '돌려받은 리스트: [30, 40]  ← 10, 20이 사라짐!', cls: 'red', a: 'start' }];
      S.push({ line: 4, tone: 'bad', cap: '`return head` 는 30을 돌려줘요. 호출한 쪽은 [30, 40]만 받아서 **앞 노드를 잃어버려요**! 순회는 항상 `cur = head`로 **복사본 변수**를 움직이세요.', ll: s.snap() });

  // ------------------------------------------------------------------ 원형 연결 리스트 (tail)
  var CIR_CODE = '# circularLinkedList.py (코드 5-22)\ndef __init__(self):\n    self.__tail = ListNode("dummy", None)\n    self.__tail.next = self.__tail\n    self.__numItems = 0\n\ndef append(self, newItem) -> None:\n    newNode = ListNode(newItem, self.__tail.next)\n    self.__tail.next = newNode\n    self.__tail = newNode\n    self.__numItems += 1';
  function cirSteps(vals) {
    var s = new LLS([], { x0: 16, y0: 66, dummy: true }), S = [], ids = ['D'];

      var tail = ids[ids.length - 1];

      s.lc = {}; s.rt = {};
      s.nx[nid] = 'D'; s.lc[nid] = 'new'; s.rt[nid] = 'under';
      if (tail !== 'D') s.rt[tail] = '';
      s.ptr.newNode = { t: nid, cls: 'org' };
      S.push({ line: 7, cap: '`append(' + v + ')` : `ListNode(' + v + ', self.__tail.next)` — 새 노드의 next가 `__tail.next`, 즉 **더미(맨 앞)**를 가리켜요.', ll: s.snap(), vars: [['newItem', v], ['numItems', k]] });
      s.nx[tail] = nid; s.lc[tail] = 'new';
      S.push({ line: 8, cap: '`self.__tail.next = newNode` : 지금까지의 끝(' + (tail === 'D' ? '더미' : s.n[tail].v) + ')이 새 노드를 가리켜요. 원 안에 끼어들었어요.', ll: s.snap(), vars: [['newItem', v], ['numItems', k]] });
      s.ptr.__tail.t = nid; delete s.ptr.newNode;
      S.push({ line: 9, cap: '`self.__tail = newNode` : __tail이 새 노드로 옮겨 가요.', ll: s.snap(), vars: [['newItem', v], ['numItems', k]] });

      S.push({ line: 10, cap: '`__numItems += 1` → ' + (k + 1) + '개. 맨 끝에 넣는 데 **O(1)** — 끝까지 따라갈 필요가 없어요.', ll: s.snap(), vars: [['newItem', v], ['numItems', k + 1, 'chg']] });

  CV.def('ll-circular', function (host) {

    P.stage.appendChild(svg);

  });

  // ------------------------------------------------------------------ 요세푸스 (원형으로 둘러앉기)
  var JOS_CODE = 'def josephus(n, k):\n    # 1~n 원형 리스트, tail = n번\n    prev = tail\n    out = []\n    for _ in range(n):\n        for _ in range(k - 1):\n            prev = prev.next\n        out.append(prev.next.data)\n        prev.next = prev.next.next\n    return out';
  function josSteps(n, k) {
    var alive = CV.range(n).map(function (i) { return i + 1; }), gone = {}, out = [], S = [];
    var prev = n;
    function nextOf(v) { var i = alive.indexOf(v); return alive[(i + 1) % alive.length]; }
    function snap(o) { return Object.assign({ n: n, alive: alive.slice(), gone: Object.assign({}, gone), out: out.slice(), prev: prev }, o); }
    S.push(snap({ line: [1, 2, 3], cap: n + '명이 원으로 앉아 있어요. **' + k + '번째** 사람을 빼는 일을 반복해요. 노드를 빼려면 **바로 앞 노드**가 필요하니까 prev = tail(' + n + '번)에서 시작해요.' }));
    for (var r = 0; r < n; r++) {
      for (var c = 1; c < k; c++) {
        prev = nextOf(prev);
        S.push(snap({ line: [5, 6], count: c, cap: '`prev = prev.next` : ' + c + '칸 이동 → prev = ' + prev + '번 (' + c + '번째로 센 사람)' }));
      }
      var t = nextOf(prev);
      S.push(snap({ line: 7, target: t, count: k, cap: (k === 1 ? '' : '') + '**' + t + '번**이 ' + k + '번째예요 → `out.append(' + t + ')`' }));
      out.push(t); gone[t] = out.length;
      alive.splice(alive.indexOf(t), 1);
      S.push(snap({ line: 8, removed: t, tone: alive.length ? '' : 'good', cap: '`prev.next = prev.next.next` : ' + prev + '번이 ' + t + '번을 건너뛰어 ' + (alive.length ? nextOf(prev) + '번을 가리켜요.' : '빼면 아무도 안 남아요.') + ' 빠진 순서: [' + out.join(', ') + ']' + (alive.length ? '' : ' — 끝!') }));
      if (!alive.length) break;
    }
    return S;
  }
  CV.josSteps = josSteps;
  CV.def('cl-josephus', function (host) {
    var W = 600, Hh = 300, cx = 200, cy = 150, R = 108;
    var svg = CV.svg(W, Hh, '', '요세푸스 문제'), sc = CV.scene(svg), P;
    function pos(v, n) { var a = -Math.PI / 2 + 2 * Math.PI * (v - 1) / n; return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a: a }; }
    function draw(st) {
      var it = [], n = st.n;

        var r2 = R + 6, mid = (a1 + a2) / 2, span = a2 - a1;

        it.push({ k: 'e' + v, h: CV.arrowPath(svg, 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q ' + mx.toFixed(1) + ' ' + my.toFixed(1) + ', ' + x2.toFixed(1) + ' ' + y2.toFixed(1), isNew ? 'll-ar new' : 'll-ar next', isNew ? 'o' : 'a'), draw: isNew });

      if (st.count && !st.target) { var cp = pos(st.prev, n); it.push({ k: 'cnt', x: cp.x, y: cp.y - 32, h: '<circle r="11" class="jcnt"/>' + CV.t(0, 5, st.count, 'jcnt-t'), z: true }); }

      on: function (a, v) {

    P = CV.player(host, { id: 'cl-josephus', codeTitle: 'Python (원형 연결 리스트로 요세푸스)', code: JOS_CODE, draw: draw, interval: 1000 });

  // ------------------------------------------------------------------ 이중 연결 리스트
  CV.def('ll-doubly', function (host) {

    var CODES = [
      '# circularDoublyLinkedList.py insert (코드 5-25)\nprev = self.getNode(i - 1)\nnewNode = BidirectNode(newItem, prev, prev.next)\nnewNode.next.prev = newNode\nprev.next = newNode\nself.__numItems += 1',
      '# circularDoublyLinkedList.py pop (코드 5-25)\ncurr = self.getNode(i)\nretItem = curr.item\ncurr.prev.next = curr.next\ncurr.next.prev = curr.prev\nself.__numItems -= 1',
      '# 만약 ③을 prev.next.prev 로 쓴다면?\nnewNode = BidirectNode(newItem, prev, prev.next)\nprev.next = newNode         # ④를 먼저 하고\nprev.next.prev = newNode    # = newNode.prev!',
    ];

    function ins() {

      s.ptr.prev = { t: prev, cls: 'blue' };
      S.push({ line: 1, cap: '이중 연결 리스트의 노드 `BidirectNode`(코드 5-24)는 **prev | item | next** 세 칸이에요. 위 화살표(진한 색)는 next, 아래 화살표(하늘색)는 prev예요. `getNode(i - 1)`로 찾은 prev(10)와 30 사이에 20을 넣어요.', ll: s.snap() });

      S.push({ line: 2, cap: '`BidirectNode(newItem, prev, prev.next)` : 새 노드 20이 생겼어요.', ll: s.snap() });
      s.pv[nid] = prev; s.nx[nid] = after; s.lc = {}; s.lpc = {}; s.lc[nid] = 'new'; s.lpc[nid] = 'new';
      S.push({ line: 2, cap: '생성자에 `prev`와 `prev.next`를 넘겼으니 새 노드의 **prev → 10, next → 30**이 한 번에 정해져요 (① ②).', ll: s.snap() });
