<style>/* 러닝메이트 자료구조 중간고사 필기 연습실 — 공통 화면 (홈 · 버튼 · 모달)
   필기 연습 화면은 written/written.css, 개념 정리는 concept/*.css */
:root {
  color-scheme: light;
  --bg: #f6f8f8; --card: #ffffff; --fg: #171a1c; --mut: #56595c; --line: #d9ddde; --input: #c9ced0;
  --pri: #286b82; --pri-h: #20576b; --pri-soft: #e7f3f7;
  --red: #d81247; --red-soft: #fce7ec; --blue: #559cb5; --gray: #6d6e71;
  --ok: #236c50; --ok-soft: #e4f2ea; --warn: #8a4d08; --warn-soft: #fff0dc;
  --l0: #2f9e6f; --l1: #286b82; --l2: #d81247;
  --ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "D2Coding", Consolas, Menlo, "Courier New", monospace;
  /* 시험 화면(어두운 남색) */
  --pg-nav: #0c151c; --pg-bg: #263747; --pg-ed: #1e2b3a; --pg-line: #172334; --pg-panel: #202b3d;
  --pg-fg: #d4dce5; --pg-hi: #ffffff; --pg-mut: #98a8b9; --pg-btn: #44576c; --pg-btn-h: #576b81;
  --pg-blue: #0078ff; --pg-blue-h: #0062d1; --pg-pass: #5fb2ff; --pg-fail: #ff6b6b; --pg-yel: #ffd666;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body { font: 15px/1.6 var(--ui); color: var(--fg); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font-family: inherit; }
.view { position: fixed; inset: 0; overflow: auto; }

/* ======================= 공통 버튼(홈) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14px; line-height: 1.3; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--pri); color: var(--pri); }
.btn:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
.btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.pri:hover { background: var(--pri-h); border-color: var(--pri-h); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.lg { padding: 13px 22px; font-size: 15.5px; border-radius: 12px; }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--mut); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }

/* ======================= 홈 */
.home-view { background: var(--bg); }
.topbar { position: sticky; top: 0; z-index: 5; background: #fffffff2; border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.tb-in { max-width: 1160px; margin: 0 auto; height: 58px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); font-size: 15px; min-width: 0; text-decoration: none; }
.brand img { width: 30px; height: 29px; flex: none; }
.brand b { font-weight: 800; color: var(--pri); white-space: nowrap; }
.brand .sep { color: var(--input); }
.brand .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-r { display: flex; align-items: center; gap: 8px; }
@keyframes blink { 50% { opacity: .3; } }

.home { max-width: 1160px; margin: 0 auto; padding: 26px 20px 60px; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 220px; align-items: center; gap: 24px; background: linear-gradient(135deg, #fff 0%, var(--pri-soft) 100%); border: 1px solid var(--line); border-radius: 20px; padding: 30px 34px; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -60px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: #ffd23f33; }
.hero > * { position: relative; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--red); letter-spacing: .4px; }
.hero h1 { margin: 0; font-size: 31px; line-height: 1.3; letter-spacing: -.6px; }
.lead { margin: 12px 0 0; color: var(--mut); max-width: 62ch; }
.lead b { color: var(--fg); }
.dday { margin-top: 16px; display: inline-flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px 8px 10px; max-width: 100%; }
.dday > b { font-size: 24px; font-weight: 800; color: #fff; background: var(--red); border-radius: 10px; padding: 1px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dday span { display: flex; flex-direction: column; line-height: 1.4; font-size: 13px; color: var(--mut); }
.dday span strong { color: var(--fg); font-size: 14px; }
.hero-cta { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
.mascot { width: 210px; height: auto; justify-self: center; filter: drop-shadow(0 10px 18px #286b8222); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.card h3 { margin: 0 0 10px; font-size: 15.5px; letter-spacing: -.2px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 small { font-weight: 500; color: var(--mut); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: #f1f4f5; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 13.5px; color: var(--mut); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--pri); box-shadow: 0 1px 3px #0002; }
.chip { border: 1px solid var(--input); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--mut); }

.empty { padding: 30px; text-align: center; color: var(--mut); }
.foot { margin-top: 34px; color: var(--mut); font-size: 12.5px; line-height: 1.7; }

/* ======================= 모달 */
.modal-bg { position: fixed; inset: 0; background: #0b1520a6; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; color: #263747; border-radius: 10px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 50px #0006; }

.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }
.mbtn { border: 0; border-radius: 4px; padding: 9px 18px; font-weight: 700; font-size: 14px; cursor: pointer; background: #e9ecf3; color: #263747; }

/* 코드 색칠 (필기 문제 코드 블록 · CodeMirror runMode) */

.cm-s-pg .cm-def { color: #6bdfff; }

.cm-s-pg .cm-string { color: #a5e07a; }

.cm-s-pg .cm-variable-2 { color: #c9a3ff; }
.cm-s-pg .cm-operator { color: #8be9fd; }
.cm-s-pg .cm-property { color: #9cdcfe; }
.cm-s-pg .cm-meta { color: #ffd479; }

.rep-hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
.rep-hero h1 { margin: 0; font-size: 24px; }
.rep-total { font-size: 46px; font-weight: 800; color: var(--pri); font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 6px; }

@media (max-width: 820px) {

  .mascot { display: none; }
  .hero h1 { font-size: 25px; }

  .brand .sep, .brand .t { display: none; }

  .rep-hero { grid-template-columns: 1fr; }

}
@media (prefers-reduced-motion: reduce) { .wx-timer.low { animation: none; } }

/* ======================= 개념 정리 */
.cv-view { background: var(--bg); }
.brand-a { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; flex: none; }
.crumb-a { color: inherit; text-decoration: none; }
.crumb-a:hover { color: var(--pri); }
.t-red { color: var(--red); font-weight: 700; } .t-blue { color: #2f7d99; font-weight: 700; } .t-org { color: #c26a00; font-weight: 700; }
.t-pri { color: var(--pri); font-weight: 700; } .t-ok { color: var(--ok); font-weight: 700; } .t-mut { color: var(--mut); }
.cvh mark, .cvp mark { background: #ffe9a8; color: inherit; padding: 0 2px; border-radius: 3px; }
.cvp code, .cvh code { font: 600 .9em var(--mono); background: #eef3f5; color: #1d4f61; padding: 1px 5px; border-radius: 4px; word-break: break-word; }

/* 홈 */
.cvh { max-width: 1160px; margin: 0 auto; padding: 26px 20px 60px; }
.cvh-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 24px; align-items: center; background: linear-gradient(135deg, #fff 0%, var(--pri-soft) 100%); border: 1px solid var(--line); border-radius: 20px; padding: 28px 32px; overflow: hidden; }
.cvh-hero::before { content: ""; position: absolute; right: -50px; top: -70px; width: 280px; height: 280px; border-radius: 50%; background: #ffd23f33; }
.cvh-hero > * { position: relative; }
.cvh-hero h1 { margin: 0; font-size: 31px; letter-spacing: -.6px; }
.cvh-hero .mascot { width: 180px; }
.cvh-prog { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
.cvh-prog > div:last-child { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.cvh-prog > div:last-child span { color: var(--mut); font-size: 13px; margin-bottom: 6px; }
.ring { --p: 0; width: 74px; height: 74px; border-radius: 50%; background: conic-gradient(var(--pri) calc(var(--p) * 1%), #dfe8eb 0); display: grid; place-items: center; flex: none; }
.ring span { width: 58px; height: 58px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; color: var(--pri); }
.ring small { font-size: 11px; }
.cvh-lab { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 16px; text-align: left; border: 2px solid #f3c2cf; background: linear-gradient(90deg, #fff 0%, #fff4f6 100%); border-radius: 16px; padding: 14px 18px; cursor: pointer; font: inherit; color: var(--fg); }
.cvh-lab:hover { border-color: var(--red); }
.cvh-lab .ic { font-size: 26px; flex: none; }
.cvh-lab b { display: block; font-size: 16px; color: var(--red); }
.cvh-lab small { display: block; color: var(--mut); font-size: 13px; margin-top: 2px; }
.cvh-lab em { margin-left: auto; font-style: normal; font-weight: 800; color: var(--red); white-space: nowrap; }
@media (max-width: 640px) { .cvh-lab em { display: none; } }
.cvh-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.cvc { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; color: var(--fg); text-decoration: none; transition: transform .15s, box-shadow .15s, border-color .15s; }
.cvc:hover { transform: translateY(-2px); box-shadow: 0 10px 26px #1c3b4a1c; border-color: var(--cc); }
.cvc-art { height: 118px; background: color-mix(in srgb, var(--cc) 9%, #fff); border-bottom: 1px solid #eef0f1; display: grid; place-items: center; }
.cvc-art svg { height: 100px; width: auto; max-width: 92%; }
.cvc-b { padding: 14px 18px 16px; display: flex; flex-direction: column; flex: 1; }
.cvc-no { font-weight: 800; font-size: 13px; color: var(--cc); }
.cvc h3 { margin: 2px 0 2px; font-size: 19px; letter-spacing: -.3px; }
.cvc p { margin: 0; color: var(--mut); font-size: 13.5px; }
.cvc ul { list-style: none; margin: 10px 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.cvc li { font-size: 12px; background: #f1f4f5; border-radius: 99px; padding: 2px 9px; color: #3d4245; }
.cvc-f { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mut); font-variant-numeric: tabular-nums; }
.cvc-f .bar { flex: 1; }
.cvc-f em { font-style: normal; font-weight: 700; color: var(--cc); background: color-mix(in srgb, var(--cc) 10%, #fff); padding: 1px 8px; border-radius: 6px; }
.bar { height: 7px; background: #e5ebed; border-radius: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cc, var(--pri)); border-radius: 9px; transition: width .4s; }

/* 단원 페이지 */
.cvp { --cc: var(--pri); max-width: 1240px; margin: 0 auto; padding: 22px 20px 70px; display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 28px; align-items: start; }
.cvp-toc { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; font-size: 13.5px; padding-right: 4px; }
.toc-back { color: var(--mut); text-decoration: none; font-size: 13px; font-weight: 600; }
.toc-back:hover { color: var(--pri); }
.toc-ch { font-weight: 800; font-size: 15px; margin: 10px 0 8px; color: var(--cc); }
.cvp-toc ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid #e2e7e9; }
.cvp-toc li a { display: flex; gap: 8px; padding: 6px 10px; margin-left: -2px; border-left: 2px solid transparent; color: #3d4245; text-decoration: none; line-height: 1.4; }
.cvp-toc li a span { color: #9aa1a5; font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; flex: none; min-width: 24px; }
.cvp-toc li a:hover { color: var(--cc); }
.cvp-toc li a.on { border-left-color: var(--cc); color: var(--cc); font-weight: 700; background: color-mix(in srgb, var(--cc) 6%, transparent); }
.cvp-toc li a.on span { color: var(--cc); }
.cvp-toc .toc-go { font-weight: 700; color: var(--red); }
.toc-prog { margin-top: 14px; }
.toc-prog small { display: block; color: var(--mut); margin-top: 5px; font-size: 12px; }
.cvp-main { min-width: 0; }
.cvp-head { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 22px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; }
.cvp-art { background: color-mix(in srgb, var(--cc) 9%, #fff); border-radius: 14px; height: 130px; display: grid; place-items: center; }
.cvp-art svg { width: 92%; height: 110px; }
.cvp-head h1 { margin: 0; font-size: 28px; letter-spacing: -.5px; }
.cvp-head .eyebrow { color: var(--cc); }
.cvp-head .lead { margin-top: 6px; }
.goals { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.goals li { padding-left: 22px; position: relative; }
.goals li::before { content: "🎯"; position: absolute; left: 0; font-size: 13px; }

.cvs { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px 22px; margin-top: 20px; scroll-margin-top: 70px; }
.cvs-h { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.cvs-no { flex: none; background: var(--cc); color: #fff; font-weight: 800; font-size: 14px; border-radius: 10px; padding: 5px 10px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.cvs h2 { margin: 0; font-size: 21px; letter-spacing: -.4px; line-height: 1.35; }
.cvs-lead { margin: 4px 0 0; color: var(--mut); font-size: 14.5px; }
.cvv { margin: 6px 0 4px; }
.cvv + .cvv { margin-top: 18px; }
.cvv-miss { color: var(--mut); background: #f5f7f8; border: 1px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; }
.cvv-title { font-weight: 800; font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.cvv-title small { font-weight: 500; color: var(--mut); font-size: 13px; }
.pts { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 7px; }
.pts li { position: relative; padding: 9px 12px 9px 40px; background: #f6f9fa; border-radius: 10px; font-size: 15px; line-height: 1.65; }
.pts li::before { content: "✓"; position: absolute; left: 12px; top: 9px; width: 19px; height: 19px; border-radius: 50%; background: var(--cc); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; margin-top: 3px; }
.cos { display: grid; gap: 10px; margin-top: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.co { border-radius: 12px; padding: 12px 15px; border: 1px solid; font-size: 14.5px; line-height: 1.65; }
.co-h { font-weight: 800; font-size: 13.5px; display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
.co-tip { background: #eef6fb; border-color: #cfe3ee; } .co-tip .co-h { color: #2f7d99; }
.co-warn { background: #fff3f5; border-color: #f6cbd5; } .co-warn .co-h { color: var(--red); }
.co-exam { background: #fff8e6; border-color: #f3dc9f; } .co-exam .co-h { color: #9a6200; }
.co-info { background: #f4f2fb; border-color: #dcd5f1; } .co-info .co-h { color: #5b3fa6; }
.co-fill { background: #ecf7f1; border-color: #c4e3d2; } .co-fill .co-h { color: #236c50; }
.pr-w { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: #fff8e6; border: 1px solid #f3dc9f; border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
.pr-w > div { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; min-width: 0; }
.pr-w h2 { margin: 0; font-size: 17px; }
.pr-w p { grid-column: 2; margin: 2px 0 0; color: var(--mut); font-size: 13.5px; }
.cvs-code { margin-top: 14px; }
.code-note { margin: 6px 2px 0; font-size: 13px; color: var(--mut); }
.cv-code { background: #1e2b3a; border-radius: 10px; overflow: hidden; }
.cv-code-t { font: 700 11.5px var(--ui); color: #98a8b9; padding: 7px 14px 0; letter-spacing: .3px; }
.cv-code pre { margin: 0; padding: 8px 0 10px; color: #d4dce5; font: 13.5px/1.62 var(--mono); overflow-x: auto; }
.cv-code .ln { display: block; padding: 0 14px; white-space: pre; }
.py-k { color: #ff9cac; } .py-s { color: #a5e075; } .py-n { color: #ffd479; } .py-c { color: #7a8ea3; font-style: italic; } .py-o { color: #c9a3ff; } .py-b { color: #8be9fd; } .py-f { color: #82c8ff; }
.cvt-wrap { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; }
.cvt { border-collapse: collapse; width: 100%; font-size: 14px; background: #fff; }
.cvt th, .cvt td { padding: 9px 12px; border-bottom: 1px solid #edf0f1; text-align: left; vertical-align: top; }
.cvt thead th { background: #f3f6f7; font-size: 13px; color: #3d4245; white-space: nowrap; }
.cvt tbody tr:last-child > * { border-bottom: 0; }
.cvt tbody th { font-weight: 700; white-space: nowrap; }

/* 개념 체크 */
.qz { margin-top: 18px; border: 1.5px solid color-mix(in srgb, var(--cc) 30%, #fff); border-radius: 14px; padding: 14px 16px 6px; background: color-mix(in srgb, var(--cc) 3%, #fff); }
.qz-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.qz-h b { font-size: 15px; }
.qz-h small { color: var(--mut); font-size: 12.5px; }

.qz-q { padding: 10px 0 12px; border-top: 1px dashed #dfe5e7; }
.qz-q:first-of-type { border-top: 0; }
.qz-t { margin: 0 0 8px; font-weight: 600; font-size: 15px; }
.qz-n { display: inline-block; font-weight: 800; color: var(--cc); margin-right: 7px; }
.qz-q .cv-code { margin: 0 0 8px; }
.qz-opts { display: grid; gap: 6px; }
.qz-opts.short { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.qz-o { display: flex; gap: 8px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 14.5px; color: var(--fg); line-height: 1.5; }
.qz-o i { font-style: normal; color: #8a9095; font-weight: 700; }
.qz-o:hover:not(:disabled) { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 5%, #fff); }
.qz-o:disabled { cursor: default; color: #6d7377; }
.qz-o.right { border-color: var(--ok); background: var(--ok-soft); color: #174d38; font-weight: 600; }
.qz-o.right i { color: var(--ok); }
.qz-o.wrong { border-color: var(--red); background: var(--red-soft); color: #8d0f30; }
.qz-o.wrong i { color: var(--red); }
.qz-ex { margin-top: 8px; font-size: 14px; background: #fff; border-radius: 10px; padding: 9px 12px; border: 1px solid #e6ebed; line-height: 1.65; }
.qz-ex b.ok { color: var(--ok); } .qz-ex b.no { color: var(--red); }
.qz-re { border: 0; background: none; color: var(--mut); text-decoration: underline; cursor: pointer; font-size: 12.5px; margin-left: 6px; }

/* 이 단원 필기 문제 풀기 */
.cvs.practice { border: 2px solid color-mix(in srgb, var(--red) 35%, #fff); background: linear-gradient(180deg, #fff 0%, #fff7f9 100%); }
.pr-h { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.pr-h > div { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
.pr-h h2 { margin: 0; font-size: 20px; }
.pr-h p { grid-column: 2; margin: 2px 0 0; color: var(--mut); font-size: 14px; }
.pr-ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 16px; }
.cvp-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* ======================= 플레이어 */
.pl { border: 1px solid #dfe5e7; border-radius: 14px; background: #fff; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "cap" "ctl"; }
.pl.has-code { grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); grid-template-rows: 1fr auto auto; grid-template-areas: "stage side" "cap side" "ctl ctl"; }
.pl.has-code.wide { grid-template-columns: minmax(0, 2.2fr) minmax(250px, 1fr); }
.pl.has-code.code-below { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "stage" "cap" "side" "ctl"; }
.pl-stage { grid-area: stage; background: #fbfcfc; padding: 14px 12px 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 190px; position: relative; min-width: 0; }
.pl-stage > svg, .cvv > svg, .cv-svg { width: 100%; height: auto; display: block; }
.pl-side { grid-area: side; background: #1e2b3a; display: flex; flex-direction: column; min-width: 0; }
.pl-codebox { flex: 1; overflow: auto; max-height: 460px; position: relative; }
.pl-code { margin: 0; padding: 6px 0 10px; color: #d4dce5; font: 12.5px/1.7 var(--mono); }
.pl-code .ln { display: block; padding: 0 12px 0 0; white-space: pre; transition: background .25s; border-left: 3px solid transparent; }
.pl-code .ln i { display: inline-block; width: 26px; padding-right: 7px; text-align: right; color: #5d7088; font-style: normal; user-select: none; }
.pl-code .ln.on { background: #2f4a66; border-left-color: #ffd23f; color: #fff; }
.pl-code .ln.on i { color: #ffd23f; }
.pl-code .ln.on.bad { background: #5a2236; border-left-color: #ff6b8b; }
.pl-code .ln.done { opacity: .55; }
.pl-vars { border-top: 1px solid #2c3d52; padding: 6px 0 10px; font: 12.5px/1.5 var(--mono); color: #d4dce5; }
.pl-vars .pv { display: flex; gap: 10px; padding: 2px 14px; }
.pl-vars .pv b { color: #8be9fd; font-weight: 600; min-width: 52px; }
.pl-vars .pv span { color: #fff; word-break: break-all; }
.pl-vars .pv.chg span { color: #ffd23f; font-weight: 700; }
.pl-cap { grid-area: cap; display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-top: 1px dashed #e3e8ea; background: #fbfcfc; min-height: 64px; font-size: 15px; line-height: 1.65; }
.pl-no { flex: none; min-width: 26px; height: 26px; border-radius: 13px; background: var(--cc, var(--pri)); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; padding: 0 6px; margin-top: 1px; font-variant-numeric: tabular-nums; }
.pl-cap.bad { background: #fff4f6; } .pl-cap.bad .pl-no { background: var(--red); } .pl-cap.bad .pl-txt { color: #9e0c33; }
.pl-cap.good { background: #f1f9f4; } .pl-cap.good .pl-no { background: var(--ok); }
.pl-ctl { grid-area: ctl; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid #e6ebed; background: #f7f9fa; }
.pl-btns { display: flex; gap: 4px; flex: none; }
.pb { width: 34px; height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0; color: #2b3135; }
.pb svg { width: 15px; height: 15px; fill: currentColor; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.pb[data-a=first] svg path, .pb[data-a=last] svg path { fill: currentColor; }
.pb:hover:not(:disabled) { border-color: var(--pri); color: var(--pri); }
.pb:disabled { opacity: .35; cursor: default; }
.pb.main { width: 42px; background: var(--pri); border-color: var(--pri); color: #fff; }
.pb.main:hover { background: var(--pri-h); color: #fff; }
.pb .i-pause { display: none; }
.pl.playing .pb .i-play { display: none; } .pl.playing .pb .i-pause { display: block; }
.pl-range { flex: 1; min-width: 60px; accent-color: var(--pri); height: 20px; }
.pl-cnt { font-size: 12.5px; color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 46px; text-align: right; }
.pl-spd { border: 1px solid var(--line); background: #fff; border-radius: 8px; height: 32px; padding: 0 9px; font: 700 12.5px var(--ui); cursor: pointer; color: #2b3135; min-width: 44px; }
.pl-spd:hover { border-color: var(--pri); color: var(--pri); }

/* 입력 줄 · 탭 */
.cv-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px; margin: 0 0 10px; padding: 10px 12px; background: #f4f7f8; border: 1px solid #e3e8ea; border-radius: 12px; }

.cf input { font: 600 14.5px var(--mono); padding: 7px 10px; border: 1.5px solid var(--input); border-radius: 8px; background: #fff; color: var(--fg); max-width: 100%; }
.cf input:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px #286b8222; }
.cf-pre { display: flex; flex-wrap: wrap; gap: 5px; flex-basis: 100%; }
.chip-s { border: 1px solid #cfd6d9; background: #fff; border-radius: 99px; padding: 3px 10px; font: 600 12.5px var(--mono); cursor: pointer; color: #3d4245; }
.chip-s:hover { border-color: var(--pri); color: var(--pri); }
.cf-err { flex-basis: 100%; color: var(--red); font-size: 13.5px; font-weight: 700; }
.cv-tabs, .scrollx { display: flex; gap: 6px; margin: 0 0 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.cv-tabs button { flex: none; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 13.5px; color: #3d4245; text-align: left; line-height: 1.35; }
.cv-tabs button small { display: block; font-weight: 500; color: var(--mut); font-size: 11.5px; }
.cv-tabs button.on { border-color: var(--cc, var(--pri)); background: color-mix(in srgb, var(--cc, var(--pri)) 8%, #fff); color: var(--cc, var(--pri)); }
.cv-tabs button.bad.on { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.cv-tabs button:hover { border-color: var(--cc, var(--pri)); }

/* ======================= SVG 공통 */

.sc-it { transition: transform .5s cubic-bezier(.4, .1, .2, 1), opacity .35s; }
.sc-enter { opacity: 0; }
.sc-exit { opacity: 0; }
.sc-draw .ar { animation: drawAr .6s ease-out both; stroke-dasharray: 1; }
@keyframes drawAr { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.ar { fill: none; stroke: #286b82; stroke-width: 2.3; }

.ll-ar.next { stroke: #286b82; }
.ll-ar.prev { stroke: #559cb5; }
.ll-ar.new { stroke: #e8890c; stroke-width: 2.8; }

.ll-ptr .pp { fill: #171a1c; }

.ll-note .nt.red { fill: #d81247; } .ll-note .nt.org { fill: #c26a00; } .ll-note .nt.ok { fill: #2f9e6f; } .ll-note .nt.big { font-size: 15px; }

/* 요세푸스 */

.jcnt { fill: #e8890c; } .jcnt.hot { fill: #d81247; } .jcnt-t { fill: #fff; font-size: 12px; font-weight: 800; }

.mvar { stroke: #e8890c; stroke-width: 2.4; }

/* ======================= Ch.1 자료구조 소개 */
.c1-map { border: 1px solid #dfe5e7; border-radius: 14px; background: #fbfcfc; padding: 18px 18px 12px; }
.c1-root { margin: 0 auto; width: max-content; max-width: 100%; text-align: center; background: #286b82; color: #fff; border-radius: 12px; padding: 8px 22px; position: relative; }
.c1-root b { display: block; font-size: 17px; }
.c1-root span { font-size: 12.5px; opacity: .85; }
.c1-brs { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 22px; position: relative; }
.c1-brs::before { content: ""; position: absolute; left: 33%; right: 16%; top: -12px; height: 12px; border: 2px solid #9cc6d4; border-bottom: 0; border-radius: 10px 10px 0 0; }
.c1-brs::after { content: ""; position: absolute; left: 50%; top: -22px; height: 10px; border-left: 2px solid #9cc6d4; }
.c1-br { border-radius: 12px; padding: 10px 10px 12px; }
.c1-br.lin { background: #eef6fb; border: 1px solid #cfe3ee; }
.c1-br.non { background: #f4f2fb; border: 1px solid #dcd5f1; }
.c1-bh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 0 4px 8px; }
.c1-bh b { font-size: 15px; }
.c1-br.lin .c1-bh b { color: #2f7d99; } .c1-br.non .c1-bh b { color: #5b3fa6; }
.c1-bh span { font-size: 12.5px; color: var(--mut); }
.c1-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.c1-card { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fff; border: 1.5px solid #dfe5e7; border-radius: 10px; padding: 8px 6px 8px; cursor: pointer; font: inherit; color: var(--fg); transition: border-color .15s, transform .15s; }
.c1-card:hover { border-color: #559cb5; transform: translateY(-1px); }
.c1-card.on { border-color: #e8890c; box-shadow: 0 0 0 3px #e8890c22; }
.c1-ic svg { width: 64px; height: 36px; display: block; }
.c1-card b { font-size: 13.5px; line-height: 1.3; text-align: center; }
.c1-card em { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: #286b82; border-radius: 99px; padding: 0 7px; }
.c1-card em.later { background: #c9ced0; color: #3d4245; }
.c1-detail { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 14px; background: #fff; border: 1.5px solid #f3d7ae; border-radius: 12px; padding: 12px 14px; }
.c1-dic svg { width: 96px; height: 54px; }
.c1-detail h4 { margin: 0; font-size: 16px; }
.c1-detail h4 small { font-weight: 600; color: var(--mut); font-size: 12.5px; margin-left: 4px; }
.c1-detail p { margin: 3px 0 6px; font-size: 14.5px; }
.c1-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 13.5px; }
.c1-detail dt { color: var(--mut); font-weight: 700; }
.c1-detail dd { margin: 0; }
.c1-hint { margin: 10px 2px 0; font-size: 13px; color: var(--mut); }
.c1-why { border: 1px solid #dfe5e7; border-radius: 14px; background: #fbfcfc; padding: 14px 16px; }
.c1-wtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.c1-wtop b { font-size: 14.5px; }
.c1-wn { display: flex; gap: 5px; flex-wrap: wrap; }
.c1-wn button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 11px; font: 700 12.5px var(--mono); cursor: pointer; color: #3d4245; }
.c1-wn button.on { border-color: var(--cc, #286b82); background: var(--cc, #286b82); color: #fff; }
.c1-bars { margin-top: 12px; display: grid; gap: 10px; }
.c1-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 150px; gap: 10px; align-items: center; }
.c1-rl { font-weight: 700; font-size: 14px; }
.c1-track { height: 22px; background: #edf1f2; border-radius: 6px; overflow: hidden; }
.c1-track i { display: block; height: 100%; border-radius: 0 4px 4px 0; transition: width .6s cubic-bezier(.4, .1, .2, 1); }
.c1-row.seq i { background: #d81247; } .c1-row.bin i { background: #2f9e6f; }
.c1-rv { display: flex; flex-direction: column; line-height: 1.3; font-variant-numeric: tabular-nums; }

.c1-ratio { margin: 2px 0 0; font-size: 14px; }
.c1-wnote { margin: 8px 0 0; font-size: 12px; color: var(--mut); }

/* ======================= Ch.3 알고리즘의 성능 */
.c3-box { border: 1px solid #dfe5e7; border-radius: 14px; background: #fbfcfc; padding: 14px 16px; }
.c3-ctl { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }

.c3-ctl input[type=range] { flex: 1; min-width: 160px; accent-color: #c26a00; }
.c3-nval { font: 800 18px var(--mono); color: #c26a00; min-width: 96px; font-variant-numeric: tabular-nums; }
.c3-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.c3-chips button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 3px 10px; font: 700 12.5px var(--mono); cursor: pointer; color: #3d4245; }
.c3-chips button.on, .c3-chips button:hover { border-color: #c26a00; color: #c26a00; }
.c3-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
.c3-chart { position: relative; }
.c3-chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.c3-ax { stroke: #c9ced0; stroke-width: 1; }
.c3-gl { stroke: #edf0f1; stroke-width: 1; }
.c3-tk { font-size: 12px; fill: #6d7377; font-family: var(--mono); }
.c3-axt { font-size: 12.5px; font-weight: 700; fill: #56595c; }
.c3-ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.c3-dot { stroke: #fff; stroke-width: 2; }
.c3-dl { font-size: 13px; font-weight: 800; fill: #171a1c; }
.c3-cur { stroke: #171a1c; stroke-width: 1.2; stroke-dasharray: 4 3; }
.c3-curl { font: 700 12px var(--mono); fill: #171a1c; }
.c3-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.c3-tbl th, .c3-tbl td { padding: 7px 9px; border-bottom: 1px solid #edf0f1; text-align: right; font-variant-numeric: tabular-nums; }
.c3-tbl th:first-child, .c3-tbl td:first-child { text-align: left; white-space: nowrap; }
.c3-tbl thead th { background: #f3f6f7; font-size: 12.5px; color: #3d4245; }
.c3-tbl tr:last-child td { border-bottom: 0; }
.c3-sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.c3-tbl td.bad { color: #b00e3a; font-weight: 700; }
.c3-tbl td.ok { color: #1f7a52; }
.c3-tnote { font-size: 12px; color: var(--mut); margin: 6px 2px 0; }
.c3-tip { position: absolute; pointer-events: none; background: #171a1c; color: #fff; font-size: 12px; border-radius: 6px; padding: 4px 8px; white-space: nowrap; transform: translate(-50%, -120%); display: none; }
/* 항 비교(규칙) */
.c3-stack { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin-top: 12px; gap: 2px; background: #fbfcfc; }
.c3-stack i { display: flex; align-items: center; justify-content: center; color: #fff; font: 700 12px var(--mono); min-width: 0; overflow: hidden; white-space: nowrap; transition: flex-basis .4s; }
.c3-leg { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 8px; font-size: 13.5px; }
.c3-leg span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.c3-leg i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.c3-fx { font: 700 16px var(--mono); margin: 0 0 4px; }
.c3-say { margin: 10px 0 0; font-size: 14.5px; }
/* 복잡도 → 실행 시간 계산기 */
