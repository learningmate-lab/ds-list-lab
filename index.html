<script>window.DSL = {DATA: {"written":{"chapters":[{"ch":1,"name":"자료구조 소개"},{"ch":2,"name":"재귀"},{"ch":3,"name":"알고리즘의 성능"},{"ch":4,"name":"파이썬 기초"},{"ch":5,"name":"리스트"},{"ch":6,"name":"스택"}],"types":{"mc":"객관식","short":"단답형","essay":"짧은 서술형","fill":"코드 빈칸"},"questions":[{"id":"w1-def-01","type":"mc","ch":1,"diff":1,"topic":"자료구조의 정의","q":"자료구조(data structure)에 대한 설명으로 **가장 알맞은** 것은?","ex":"자료구조 = 데이터를 담는 방법, 알고리즘 = 문제를 푸는 절차. 둘은 짝을 이뤄요.","code":"","cx":false,"opts":["컴퓨터 하드웨어의 저장 장치 구조","데이터를 효율적으로 저장·접근·변경할 수 있도록 조직하는 방법","프로그램을 실행하는 순서를 정한 절차","파이썬에서만 쓰는 자료형의 목록"],"a":1,"why":["하드웨어(메모리·디스크) 구조가 아니라 데이터를 담는 **논리적인 방법**이에요.","맞아요. 자료구조는 데이터를 **어떻게 담고 꺼낼지** 정한 조직 방법이에요. 담는 방법에 따라 찾기·넣기·빼기의 속도가 달라져요.","문제를 푸는 절차는 **알고리즘**이에요.","배열·연결 리스트·스택 같은 자료구조는 어느 언어에서나 쓰는 개념이에요."]},{"id":"w1-class-01","type":"mc","ch":1,"diff":1,"topic":"선형 · 비선형","q":"다음 중 **비선형** 자료구조로만 짝지어진 것은?","ex":"선형: 배열(리스트) · 연결 리스트 · 스택 · 큐 / 비선형: 트리 · 그래프.","code":"","cx":false,"opts":["스택, 큐","배열, 연결 리스트","트리, 그래프","연결 리스트, 트리"],"a":2,"why":["스택과 큐는 원소가 한 줄로 늘어선 **선형** 구조예요.","배열과 연결 리스트도 앞뒤 순서가 하나씩인 **선형** 구조예요.","맞아요. 트리(계층)와 그래프(그물)는 한 원소가 여러 원소와 연결될 수 있는 **비선형** 구조예요.","연결 리스트는 선형이라 “비선형으로만”이 아니에요."]},{"id":"w1-class-02","type":"mc","ch":1,"diff":1,"topic":"선형 · 비선형","q":"**선형 자료구조**의 특징으로 옳은 것은?","ex":"선형인지는 “메모리에 붙어 있나”가 아니라 “논리적으로 한 줄 순서인가”로 판단해요.","code":"","cx":false,"opts":["한 원소에 여러 개의 다음 원소가 연결될 수 있다","원소들이 한 줄로 늘어서 각 원소의 앞·뒤 원소가 최대 하나씩이다","반드시 연속된 메모리에 저장해야 한다","원소를 꺼내는 순서가 항상 LIFO이다"],"a":1,"why":["여러 원소로 갈라지는 것은 트리·그래프 같은 **비선형** 구조의 특징이에요.","맞아요. 선형 구조는 원소들이 **한 줄로 앞뒤 순서**를 가져요.","연결 리스트도 선형 구조지만 노드가 메모리 여기저기 흩어져 있어요. 연속 저장은 **배열**의 특징이에요.","LIFO는 선형 구조 중 **스택**만의 규칙이에요. 큐는 FIFO예요."]},{"id":"w1-adt-01","type":"mc","ch":1,"diff":1,"topic":"ADT","q":"ADT(추상 자료형, Abstract Data Type)에 대한 설명으로 **옳은** 것은?","ex":"인터페이스(무엇을) ↔ 구현(어떻게)을 나누는 것이 ADT의 핵심이에요.","code":"","cx":false,"opts":["연산이 내부에서 어떻게 동작하는지 코드까지 정해 둔 것","데이터와 그 데이터에 할 수 있는 연산(무엇을)만 정하고, 구현 방법(어떻게)은 정하지 않은 것","추상 클래스를 상속해야만 만들 수 있는 파이썬 문법","정수·실수처럼 언어가 기본으로 주는 자료형만 가리키는 말"],"a":1,"why":["코드(구현)까지 정한 것은 ADT가 아니라 **구현**(예: `LinkedListBasic` 클래스)이에요.","맞아요. ADT는 “무엇을 할 수 있는가”(인터페이스)만 약속해요. 배열로 구현할지 연결 리스트로 구현할지는 정하지 않아요.","ADT는 설계 개념이지 특정 문법이 아니에요.","리스트 ADT, 스택 ADT처럼 사용자가 정의하는 자료형도 ADT로 설명해요."]},{"id":"w1-adt-02","type":"mc","ch":1,"diff":2,"topic":"ADT","q":"리스트 ADT를 **배열 리스트**로 구현했다가 **연결 리스트**로 바꿨어요. 이 리스트를 사용하는 쪽 코드 `a.insert(1, 20)`에 대해 옳은 것은?","ex":"ADT 덕분에 구현을 바꿔도 사용하는 쪽 코드는 영향을 받지 않아요.","code":"","cx":false,"opts":["메서드 이름이 바뀌므로 반드시 고쳐야 한다","그대로 쓸 수 있고, 결과도 같다. 다만 연산 속도는 달라질 수 있다","그대로 쓸 수 있지만 결과 리스트의 순서가 달라진다","연결 리스트에는 insert 연산이 없으므로 실행할 수 없다"],"a":1,"why":["인터페이스(이름·인자·결과)가 같으면 사용하는 코드는 바꿀 필요가 없어요.","맞아요. 인터페이스가 같으니 코드와 결과는 그대로이고, 내부 구현에 따라 **걸리는 시간**만 달라져요.","같은 ADT를 구현했다면 결과(원소 순서)는 같아야 해요.","`LinkedListBasic`에도 `insert(i, newItem)`이 있어요."]},{"id":"w1-algo-01","type":"mc","ch":1,"diff":1,"topic":"알고리즘의 조건","q":"알고리즘이 갖춰야 할 조건이 **아닌** 것은?","ex":"알고리즘의 조건: 입력 · 출력 · 명확성 · 유한성 · 효과성(실행 가능성).","code":"","cx":false,"opts":["입력: 0개 이상의 입력이 있다","출력: 1개 이상의 결과를 낸다","명확성: 각 단계가 모호하지 않다","유한성: 유한한 단계 뒤에 반드시 끝난다","최적성: 항상 가장 빠른 방법이어야 한다"],"a":4,"why":["입력은 알고리즘의 조건이에요(없을 수도 있으니 0개 이상).","출력은 알고리즘의 조건이에요. 결과가 하나도 없으면 문제를 푼 게 아니에요.","명확성은 조건이에요. “적당히 더한다” 같은 모호한 단계는 안 돼요.","유한성은 조건이에요. 끝나지 않는 절차는 알고리즘이 아니에요.","맞아요(조건이 아님). 느려도 알고리즘이에요. 빠르기는 Ch.3에서 **성능**으로 비교하는 별도의 문제예요."]},{"id":"w1-search-01","type":"mc","ch":1,"diff":2,"topic":"순차 · 이진 탐색","q":"원소 1,000개가 **정렬된** 배열에서 값을 찾을 때, 최악의 경우 비교 횟수를 가장 잘 짝지은 것은? (순차 탐색 / 이진 탐색)","ex":"정렬해서 담아 두면(자료구조) 이진 탐색(알고리즘)을 쓸 수 있어요 — 자료구조와 알고리즘은 짝이에요.","code":"","cx":true,"opts":["1,000번 / 500번","1,000번 / 약 10번","500번 / 약 10번","약 10번 / 1,000번"],"a":1,"why":["이진 탐색은 절반씩 버리므로 500번까지 가지 않아요.","맞아요. 순차 탐색은 최악 n = 1,000번, 이진 탐색은 약 log₂1000 ≈ 10번이에요.","순차 탐색의 **최악**은 n번(맨 끝에 있거나 없을 때)이에요. 평균이 약 n/2예요.","두 값이 뒤바뀌었어요."]},{"id":"w1-search-02","type":"mc","ch":1,"diff":1,"topic":"순차 · 이진 탐색","q":"이진 탐색을 쓰기 위해 **반드시** 필요한 조건은?","ex":"정렬 안 된 배열에 이진 탐색을 쓰면 있는 값도 못 찾을 수 있어요.","code":"","cx":false,"opts":["원소가 모두 양수일 것","원소 개수가 2의 거듭제곱일 것","배열이 정렬되어 있을 것","중복된 값이 없을 것"],"a":2,"why":["값의 부호는 상관없어요.","개수가 몇 개든 가운데(`mid`)를 정해 절반씩 줄일 수 있어요.","맞아요. 가운데 값과 비교해 “왼쪽/오른쪽에 있다”고 판단하려면 정렬되어 있어야 해요.","중복이 있어도 찾을 수는 있어요(어느 위치가 나올지만 달라져요)."]},{"id":"w1-adt-03","type":"short","ch":1,"diff":1,"topic":"ADT","q":"데이터와 그 데이터에 할 수 있는 **연산의 목록만** 정하고 구현 방법은 감춘 자료형을 무엇이라고 하나요? (우리말 또는 영어 약자)","ex":"ADT = Abstract Data Type = 추상 자료형(추상 데이터 타입).","code":"","cx":false,"ans":["ADT","추상 자료형","추상 데이터 타입","추상자료형","Abstract Data Type","추상 데이터형","ADT(추상 자료형)","추상 자료형(ADT)","추상 데이터 타입(ADT)"],"bad":["자료구조","알고리즘","클래스"],"ph":"용어"},{"id":"w1-class-03","type":"short","ch":1,"diff":1,"topic":"선형 · 비선형","q":"한 노드에서 여러 자식 노드로 갈라지는 **계층** 구조의 비선형 자료구조는?","ex":"트리는 부모-자식 계층, 그래프는 그물처럼 얽힌 연결이에요.","code":"","cx":false,"ans":["트리","tree","트리 구조","트리(tree)","tree(트리)"],"bad":["그래프","스택","연결 리스트"],"ph":"용어"},{"id":"w1-search-03","type":"short","ch":1,"diff":2,"topic":"순차 · 이진 탐색","q":"원소 n = 1,024개가 정렬된 배열에서 이진 탐색을 하면, 비교는 **최대 몇 번**인가요? (가운데 원소와 비교할 때마다 1번으로 셉니다)","ex":"범위가 1024 → 512 → … → 1로 줄며 log₂1024 + 1 = 11번까지 비교할 수 있어요. 최대 ⌊log₂n⌋ + 1번이에요.","code":"","cx":true,"ans":["11","11번","11회"],"bad":["10","1024","512"],"ph":"숫자"},{"id":"w1-why-01","type":"essay","ch":1,"diff":2,"topic":"자료구조의 필요성","q":"같은 데이터를 다루더라도 **자료구조를 잘 골라야 하는 이유**를 예를 하나 들어 2~3문장으로 설명하세요.","ex":"","code":"","cx":false,"model":"자료구조에 따라 같은 연산(찾기·넣기·빼기)에 드는 시간이 크게 달라지기 때문이에요. 예를 들어 배열은 i번째 원소를 바로 읽지만(인덱스 접근) 맨 앞에 넣으려면 원소를 모두 밀어야 하고, 연결 리스트는 맨 앞 삽입이 빠르지만 i번째 원소를 찾으려면 앞에서부터 따라가야 해요. 그래서 자주 하는 연산이 빠른 구조를 골라야 해요.","keys":["자료구조에 따라 연산 속도(효율)가 달라진다","구체적 예(배열 vs 연결 리스트, 순차 vs 이진 탐색 등)를 들었다","“자주 하는 연산”에 맞춰 고른다는 결론"]},{"id":"w1-adt-04","type":"essay","ch":1,"diff":2,"topic":"ADT","q":"ADT에서 **인터페이스**와 **구현**을 나눠 두면 좋은 점을 리스트 ADT를 예로 2~3문장으로 설명하세요.","ex":"","code":"","cx":false,"model":"인터페이스는 `insert(i, x)`, `pop(i)`, `get(i)`처럼 무엇을 할 수 있는지만 약속하고, 구현은 배열이나 연결 리스트로 어떻게 할지를 정해요. 둘을 나누면 구현을 배열에서 연결 리스트로 바꿔도 사용하는 쪽 코드는 고칠 필요가 없어요. 사용자는 내부 구조를 몰라도 되고, 상황에 맞는 구현으로 쉽게 바꿀 수 있어요.","keys":["인터페이스 = 무엇을(연산 이름·입력·결과)","구현 = 어떻게(배열/연결 리스트 등)","구현을 바꿔도 사용하는 코드는 그대로","리스트 ADT 연산 예시를 들었다"]},{"id":"w1-algo-02","type":"essay","ch":1,"diff":1,"topic":"자료구조와 알고리즘","q":"“프로그램 = 자료구조 + 알고리즘”이라는 말의 뜻을 2~3문장으로 설명하세요.","ex":"","code":"","cx":false,"model":"알고리즘은 문제를 푸는 절차이고 자료구조는 그 절차가 다룰 데이터를 담는 방법이에요. 데이터를 어떻게 담았는지에 따라 쓸 수 있는 알고리즘과 그 효율이 달라져요. 예를 들어 데이터를 정렬해서 담아 두면 순차 탐색 대신 훨씬 빠른 이진 탐색을 쓸 수 있어요.","keys":["알고리즘 = 문제를 푸는 절차","자료구조 = 데이터를 담는 방법","둘이 서로 영향을 준다(구조가 쓸 수 있는 알고리즘·효율을 정함)","예시(정렬 + 이진 탐색 등)"]},{"id":"w2-base-01","type":"mc","ch":2,"diff":1,"topic":"재귀의 구성","q":"재귀 함수가 올바르게 끝나기 위해 **반드시** 갖춰야 할 두 가지로 알맞은 것은?","ex":"기저 사례가 없거나, 호출이 기저 사례 쪽으로 작아지지 않으면 끝나지 않아요.","code":"","cx":false,"opts":["전역 변수와 반복문","기저 사례(종료 조건)와 기저 사례 쪽으로 작아지는 재귀 호출","return 문 두 개와 print 문","매개변수 두 개 이상과 기본값","딕셔너리 memo와 리스트"],"a":1,"why":["재귀에는 전역 변수나 반복문이 꼭 필요하지 않아요.","맞아요. ① 바로 답이 나오는 **기저 사례**와 ② 기저 사례에 **가까워지는** 재귀 호출(`n - 1`, `arr[1:]` 등)이 필요해요.","return/print의 개수는 재귀의 조건과 상관없어요.","`factorial(n)`처럼 매개변수 하나로도 재귀를 만들 수 있어요.","memo는 중복 계산을 줄이는 **최적화**일 뿐 필수가 아니에요."]},{"id":"w2-stack-01","type":"mc","ch":2,"diff":2,"topic":"호출 스택","q":"다음 `factorial(4)`를 실행할 때, 호출 스택에 `factorial`의 프레임이 **가장 많이 쌓였을 때** 몇 개일까요?","ex":"재귀 깊이 = 동시에 쌓이는 프레임 수 = 메모리 사용량이에요. 프레임은 나중에 들어간 것이 먼저 나오는 **스택**(Ch.6)으로 관리돼요.","code":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)","cx":false,"opts":["1개","3개","4개","5개","24개"],"a":2,"why":["재귀 호출이 끝나기 전까지 앞의 프레임이 사라지지 않고 계속 쌓여요.","factorial(1)도 프레임 하나를 차지해요. 4 → 3 → 2 → 1이에요.","맞아요. factorial(4), (3), (2), (1)의 프레임 4개가 동시에 쌓였다가, factorial(1)이 return하면서 위에서부터 사라져요.","기저 사례가 `n <= 1`이라 factorial(0)은 호출되지 않아요.","24는 결괏값(4!)이지 프레임 수가 아니에요."]},{"id":"w2-trace-01","type":"mc","ch":2,"diff":2,"topic":"출력 순서 추적","q":"다음 코드를 실행하면 무엇이 출력될까요?","ex":"재귀 호출 **앞**의 일은 내려가면서(3, 2, 1), **뒤**의 일은 돌아오면서(1, 2, 3) 실행돼요.","code":"def f(n):\n    if n == 0:\n        return\n    f(n - 1)\n    print(n, end=' ')\n\nf(3)","cx":false,"opts":["3 2 1","1 2 3","3 2 1 0","0 1 2 3"],"a":1,"why":["print가 재귀 호출 **뒤**에 있어요. f(3)은 f(2)가 다 끝난 다음에야 3을 출력해요.","맞아요. f(3) → f(2) → f(1) → f(0)(바로 return)까지 내려간 뒤, 돌아오면서 1, 2, 3 순서로 출력해요.","f(0)은 print 전에 return해서 0은 출력되지 않아요.","f(0)은 아무것도 출력하지 않아요."]},{"id":"w2-err-01","type":"mc","ch":2,"diff":2,"topic":"RecursionError","q":"다음 함수로 `half(5)`를 호출하면 어떻게 될까요?","ex":"기저 사례를 `n <= 0`처럼 쓰면 홀수에서도 멈춰요. 호출할 때마다 기저 사례에 **반드시** 가까워지는지 확인하세요.","code":"def half(n):\n    if n == 0:\n        return 0\n    return n + half(n - 2)","cx":false,"opts":["5 + 3 + 1 = 9를 return한다","0을 return한다","기저 사례에 도달하지 못해 RecursionError가 난다","SyntaxError가 난다"],"a":2,"why":["5 → 3 → 1 → -1 → … 로 줄어서 n이 정확히 0이 되는 순간이 없어요.","0이 되지 않으니 `return 0`에 도달하지 못해요.","맞아요. 홀수에서 2씩 빼면 0을 건너뛰어 음수로 끝없이 내려가요. 파이썬은 깊이 한도(기본 약 1000)를 넘으면 RecursionError를 내요.","문법에는 문제가 없어요. 실행 중(런타임)에 나는 오류예요."]},{"id":"w2-fib-01","type":"mc","ch":2,"diff":2,"topic":"피보나치 중복 호출","q":"정의대로 짠 재귀 `fib`로 `fib(5)`를 계산할 때 `fib` 함수는 **모두 몇 번** 호출될까요? (`fib(5)` 자신도 셉니다)","ex":"호출 수가 n이 1 늘 때마다 약 1.6배씩 늘어나는 지수 시간이에요. 메모이제이션으로 O(n)으로 줄일 수 있어요.","code":"def fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)","cx":true,"opts":["5번","8번","9번","15번","32번"],"a":3,"why":["한 번씩만 부른다면 5~6번이지만, 같은 값을 여러 번 다시 계산해요.","8은 fib(6)의 값이에요. 호출 횟수와 달라요.","9는 fib(4)를 계산할 때의 호출 횟수예요.","맞아요. 호출 수 C(n) = C(n-1) + C(n-2) + 1, C(0) = C(1) = 1 → C(2)=3, C(3)=5, C(4)=9, C(5)=15.","2⁵ = 32는 대략적인 상한일 뿐 정확한 횟수는 아니에요."]},{"id":"w2-hanoi-01","type":"mc","ch":2,"diff":2,"topic":"하노이 탑","q":"원판 n개짜리 하노이 탑의 이동 횟수를 T(n)이라 할 때, 알맞은 점화식과 답은?","ex":"n = 3 → 7번, n = 10 → 1,023번. 시간 복잡도는 O(2ⁿ)이에요.","code":"","cx":true,"opts":["T(n) = T(n-1) + 1 → n","T(n) = 2T(n-1) + 1 → 2ⁿ − 1","T(n) = 2T(n/2) + 1 → n","T(n) = T(n-1) + n → n(n+1)/2"],"a":1,"why":["n-1개를 **두 번**(경유 기둥으로, 다시 목표 기둥으로) 옮겨야 해서 T(n-1)이 두 번 들어가요.","맞아요. n-1개를 경유 기둥으로(T(n-1)) → 가장 큰 원판 1번 이동(+1) → n-1개를 목표 기둥으로(T(n-1)). T(1) = 1이면 T(n) = 2ⁿ − 1이에요.","문제가 절반(n/2)으로 줄지 않고 n-1로 줄어요.","한 단계에서 n번 옮기지 않아요. 가장 큰 원판은 딱 1번만 움직여요."]},{"id":"w2-iter-01","type":"mc","ch":2,"diff":2,"topic":"재귀 vs 반복","q":"재귀와 반복에 대한 설명으로 **틀린** 것은?","ex":"재귀의 장점은 **생각과 코드가 간단해지는 것**이지 속도가 아니에요.","code":"","cx":false,"opts":["factorial 같은 재귀 함수는 반복문으로도 바꿀 수 있다","재귀는 호출할 때마다 프레임이 쌓여 깊이만큼 메모리를 더 쓴다","재귀는 항상 반복문보다 빠르다","하노이 탑처럼 문제를 같은 모양의 작은 문제로 나눌 수 있으면 재귀로 짧게 표현하기 좋다"],"a":2,"why":["맞는 설명이에요. `for i in range(2, n + 1): result *= i`처럼 바꿀 수 있어요.","맞는 설명이에요. 깊이가 n이면 프레임 n개가 동시에 쌓여요.","틀린 설명이라 정답이에요. 재귀는 함수 호출·프레임 비용이 더 들어서 보통 같거나 더 느려요. 정의대로 짠 피보나치처럼 중복 호출이 생기면 훨씬 느려지기도 해요.","맞는 설명이에요. 큰 원판 하나만 생각하고 나머지는 “n-1개 옮기기”에 맡기면 돼요."]},{"id":"w2-bs-01","type":"mc","ch":2,"diff":3,"topic":"재귀 이진 탐색","q":"정렬된 배열(원소 n개)에서 재귀 이진 탐색을 할 때, 시간 복잡도와 재귀 깊이로 알맞은 것은?","ex":"n = 1,000이면 최대 약 10번 호출로 끝나요.","code":"","cx":true,"opts":["O(n), 깊이 약 n","O(log n), 깊이 약 log₂n","O(n log n), 깊이 약 log₂n","O(1), 깊이 1"],"a":1,"why":["범위를 1씩 줄이는 게 아니라 **절반씩** 줄여요.","맞아요. 호출할 때마다 범위가 절반 → 약 log₂n번 호출, 한 번 호출에서 하는 일은 O(1)이라 O(log n)이에요. T(n) = T(n/2) + 1.","각 호출에서 하는 일은 비교 몇 번(O(1))뿐이라 n log n이 아니에요.","찾는 값이 가운데에 있으면 1번에 끝나지만(최선), 최악은 log₂n번이에요."]},{"id":"w2-base-02","type":"short","ch":2,"diff":1,"topic":"재귀의 구성","q":"재귀 함수에서 **더 이상 자기 자신을 부르지 않고 바로 답을 return하는 경우**를 무엇이라고 하나요?","ex":"기저 사례(base case) = 종료 조건. 예) factorial의 `n <= 1`일 때 1.","code":"","cx":false,"ans":["기저 사례","base case","기저 조건","종료 조건","기본 사례","베이스 케이스","탈출 조건","기저 케이스","base condition","기저 사례(base case)","기저 사례(종료 조건)"],"bad":["재귀 호출","점화식","프레임"],"ph":"용어"},{"id":"w2-hanoi-02","type":"short","ch":2,"diff":1,"topic":"하노이 탑","q":"원판 **5개**짜리 하노이 탑을 옮기려면 원판을 최소 몇 번 옮겨야 하나요?","ex":"2⁵ − 1 = 31번이에요. T(n) = 2T(n-1) + 1.","code":"","cx":true,"ans":["31","31번","31회"],"bad":["32","25","15","10"],"ph":"숫자"},{"id":"w2-fib-02","type":"short","ch":2,"diff":3,"topic":"피보나치 중복 호출","q":"정의대로 짠 재귀 `fib(n) = fib(n-1) + fib(n-2)` (기저: `n <= 1`이면 n)로 `fib(5)`를 계산할 때, `fib(2)`는 **몇 번** 호출될까요?","ex":"fib(5) → fib(4), fib(3) / fib(4) → fib(3), fib(2) / fib(3)은 두 번 계산되고 각각 fib(2)를 부르니 1 + 2 = 3번이에요. 같은 계산이 반복되는 게 느린 이유예요.","code":"","cx":true,"ans":["3","3번","3회"],"bad":["1","2","5"],"ph":"숫자"},{"id":"w2-trace-02","type":"short","ch":2,"diff":2,"topic":"출력 순서 추적","q":"다음 코드의 출력 결과를 쓰세요. (공백 없이 써도 됩니다)","ex":"재귀 호출 앞의 print는 내려가면서 3, 2, 1, 뒤의 print는 돌아오면서 1, 2, 3을 출력해요.","code":"def g(n):\n    if n == 0:\n        return\n    print(n, end='')\n    g(n - 1)\n    print(n, end='')\n\ng(3)","cx":false,"ans":["321123","3 2 1 1 2 3"],"bad":["123321","321","123","3210123"],"ph":"출력"},{"id":"w2-err-02","type":"short","ch":2,"diff":1,"topic":"RecursionError","q":"파이썬에서 재귀 호출이 최대 깊이(기본 약 1000)를 넘으면 나는 **오류(예외)의 이름**은?","ex":"`RecursionError: maximum recursion depth exceeded`. 기저 사례가 없거나 도달하지 못할 때 주로 나요.","code":"","cx":false,"ans":["RecursionError","RecursionError: maximum recursion depth exceeded"],"bad":["StackOverflow","StackOverflowError","IndexError","SyntaxError"],"ph":"오류 이름"},{"id":"w2-sum-01","type":"short","ch":2,"diff":2,"topic":"배열의 합 (재귀)","q":"다음 `total([5, 1, 4, 2])`를 실행하면 `total` 함수는 **모두 몇 번** 호출될까요? (처음 호출도 셉니다)","ex":"[5,1,4,2] → [1,4,2] → [4,2] → [2] → [] 로 5번이에요. 빈 리스트에서 기저 사례를 만나요.","code":"def total(arr):\n    if len(arr) == 0:\n        return 0\n    return arr[0] + total(arr[1:])","cx":false,"ans":["5","5번","5회"],"bad":["4","1","12"],"ph":"숫자"},{"id":"w2-induct-01","type":"essay","ch":2,"diff":2,"topic":"귀납적 사고","q":"재귀 함수를 만들 때의 **귀납적 사고**를 `factorial(n)`을 예로 2~3문장으로 설명하세요.","ex":"","code":"","cx":false,"model":"먼저 바로 답이 나오는 기저 사례(n이 1 이하이면 1)를 정해요. 그다음 `factorial(n - 1)`이 (n-1)!을 올바르게 구한다고 **믿고**, 그 결과에 n을 곱해 n!을 만들어요. 기저 사례가 맞고 한 단계가 맞으면 모든 n에 대해 맞게 돼요(수학적 귀납법과 같아요).","keys":["기저 사례(n ≤ 1 → 1)를 정한다","더 작은 문제 factorial(n-1)이 맞다고 믿는다","작은 답으로 큰 답을 만든다(n × (n-1)!)","수학적 귀납법과의 관계 또는 “모든 n에서 성립”"]},{"id":"w2-memo-01","type":"essay","ch":2,"diff":3,"topic":"피보나치와 메모이제이션","q":"정의대로 짠 재귀 피보나치가 느린 이유와, **메모이제이션**으로 어떻게 빨라지는지 시간 복잡도를 넣어 2~4문장으로 설명하세요.","ex":"","code":"","cx":true,"model":"`fib(n-1)`과 `fib(n-2)`가 같은 값(예: fib(n-3))을 여러 번 다시 계산해서 호출 수가 지수적으로(약 1.6ⁿ, O(2ⁿ)) 늘어나요. 메모이제이션은 한 번 계산한 fib(k)를 딕셔너리 memo에 저장해 두고, 다시 필요하면 계산하지 않고 꺼내 써요. 그러면 fib(0)~fib(n)을 한 번씩만 계산하므로 O(n)이 돼요.","keys":["같은 부분 문제를 중복 계산한다","호출 수가 지수적(O(2ⁿ))으로 늘어난다","계산한 값을 저장(memo)하고 다시 쓴다","메모이제이션 후 O(n)"]},{"id":"w2-hanoi-03","type":"essay","ch":2,"diff":2,"topic":"하노이 탑","q":"하노이 탑에서 원판 n개를 A에서 C로(B를 거쳐) 옮기는 재귀 방법을 3단계로 설명하고, 이동 횟수가 2ⁿ − 1인 이유를 쓰세요.","ex":"","code":"","cx":true,"model":"① 위의 n-1개를 C를 거쳐 A에서 B로 옮기고, ② 가장 큰 원판을 A에서 C로 옮기고, ③ B의 n-1개를 A를 거쳐 C로 옮겨요. 이동 횟수는 T(n) = 2T(n-1) + 1, T(1) = 1이고, 풀면 T(n) = 2ⁿ − 1이에요.","keys":["n-1개를 경유 기둥(B)으로","가장 큰 원판을 목표(C)로 1번","n-1개를 목표(C)로","T(n) = 2T(n-1) + 1 → 2ⁿ − 1"]},{"id":"w2-fact-01","type":"fill","ch":2,"diff":1,"topic":"factorial","q":"`factorial(n)` = n! 을 재귀로 구하는 함수예요. 빈칸을 채우세요. (0! = 1)","ex":"기저 사례(n ≤ 1 → 1)와 작아지는 호출(n-1)이 함께 있어야 해요. `== 1`로 쓰면 factorial(0)에서 끝나지 않아요. (`n == 0`이면 1을 돌려줘도 0! = 1, 1! = 1 · 0!이라 맞아요.)","code":"","cx":false,"src":"def factorial(n):\n    if ⟦n <= 1⟧:\n        return ⟦1⟧\n    return ⟦n * factorial(n - 1)⟧\n","blanks":[{"ans":["n <= 1","n < 2","n == 0","n < 1","n <= 0","n in (0, 1)","n == 0 or n == 1"],"bad":["n == 1","n < 0"]},{"ans":["1"],"bad":["0","n"]},{"ans":["n * factorial(n - 1)","factorial(n - 1) * n"],"bad":["n * factorial(n)","factorial(n - 1)","n * factorial(n - 2)"]}]},{"id":"w2-fib-03","type":"fill","ch":2,"diff":2,"topic":"fibonacci 메모이제이션","q":"메모이제이션을 쓰는 피보나치 함수예요. 한 번 계산한 값은 `memo`에 저장해 다시 쓰도록 빈칸을 채우세요.","ex":"계산 전에 memo를 먼저 확인하고, 계산한 뒤 저장해요. 각 fib(k)를 한 번만 계산하므로 O(n)이에요.","code":"","cx":true,"src":"memo = {}\n\ndef fib(n):\n    if n <= 1:\n        return n\n    if ⟦n in memo⟧:\n        return memo[n]\n    memo[n] = ⟦fib(n - 1) + fib(n - 2)⟧\n    return ⟦memo[n]⟧\n","blanks":[{"ans":["n in memo","n in memo.keys()","memo.get(n) is not None"],"bad":["n not in memo","memo[n]"]},{"ans":["fib(n - 1) + fib(n - 2)","fib(n - 2) + fib(n - 1)"],"bad":["fib(n - 1) + fib(n - 1)","fib(n - 1)"]},{"ans":["memo[n]","memo.get(n)"],"bad":["n","memo"]}]},{"id":"w2-hanoi-04","type":"fill","ch":2,"diff":2,"topic":"하노이 탑","q":"`hanoi(n, a, b, c)`는 a 기둥의 원판 n개를 b를 거쳐 c로 옮기며 이동을 `moves`에 기록해요. 빈칸을 채우세요. (빈칸에는 기둥 이름 세 개를 순서대로)","ex":"재귀 호출마다 기둥의 역할(출발 · 경유 · 도착)을 바꿔서 넘기는 게 핵심이에요. 이동 횟수는 2ⁿ − 1이에요.","code":"","cx":false,"src":"moves = []\n\ndef hanoi(n, a, b, c):   # a → c (b 경유)\n    if n == 0:\n        return\n    hanoi(n - 1, ⟦a, c, b⟧)   # n-1개: a → b\n    moves.append((a, ⟦c⟧))    # 가장 큰 원판\n    hanoi(n - 1, ⟦b, a, c⟧)   # n-1개: b → c\n","blanks":[{"ans":["a, c, b"],"bad":["a, b, c","b, a, c"]},{"ans":["c"],"bad":["b"]},{"ans":["b, a, c"],"bad":["a, b, c","b, c, a"]}]},{"id":"w2-bs-02","type":"fill","ch":2,"diff":2,"topic":"재귀 이진 탐색","q":"정렬된 리스트 `a`에서 `x`의 인덱스를 찾는 재귀 이진 탐색이에요. 없으면 -1을 return해요. 빈칸을 채우세요.","ex":"가운데보다 크면 오른쪽 절반(mid+1 ~ high), 작으면 왼쪽 절반(low ~ mid-1)만 다시 탐색해요. `mid`를 그대로 넘기면 범위가 줄지 않아 끝나지 않을 수 있어요. O(log n).","code":"","cx":true,"src":"def bsearch(a, x, low, high):\n    if low > high:\n        return ⟦-1⟧\n    mid = ⟦(low + high) // 2⟧\n    if a[mid] == x:\n        return mid\n    elif a[mid] < x:\n        return bsearch(a, x, ⟦mid + 1⟧, high)\n    else:\n        return bsearch(a, x, low, ⟦mid - 1⟧)\n","blanks":[{"ans":["-1"],"bad":["0","None","mid"]},{"ans":["(low + high) // 2","(high + low) // 2","low + (high - low) // 2","int((low + high) / 2)"],"bad":["(low + high) / 2","len(a) // 2"]},{"ans":["mid + 1"],"bad":["mid","mid - 1"]},{"ans":["mid - 1"],"bad":["mid","mid + 1"]}]},{"id":"w2-sum-02","type":"fill","ch":2,"diff":1,"topic":"배열의 합 (재귀)","q":"리스트 `arr`의 합을 재귀로 구하는 함수예요. 빈칸을 채우세요.","ex":"“맨 앞 원소 + 나머지의 합(나머지는 재귀에 맡기기)”이에요. 빈 리스트의 합 0이 기저 사례예요.","code":"","cx":false,"src":"def total(arr):\n    if ⟦len(arr) == 0⟧:\n        return 0\n    return ⟦arr[0] + total(arr[1:])⟧\n","blanks":[{"ans":["len(arr) == 0","not arr","arr == []","len(arr) < 1","len(arr) <= 0"],"bad":["len(arr) == 1","arr[0] == 0"]},{"ans":["arr[0] + total(arr[1:])","total(arr[1:]) + arr[0]","arr[-1] + total(arr[:-1])","total(arr[:-1]) + arr[-1]"],"bad":["arr[0] + total(arr)","total(arr[1:])","arr[0] + total(arr[2:])"]}]},{"id":"w2-pow-01","type":"fill","ch":2,"diff":3,"topic":"거듭제곱 (분할)","q":"`power(x, n)`은 xⁿ (n ≥ 0)을 구해요. 지수를 절반으로 줄여 O(log n)번만 호출되도록 빈칸을 채우세요.","ex":"x¹⁰ = (x⁵)², x⁵ = (x²)² · x처럼 지수를 반씩 줄여요. T(n) = T(n/2) + 1 → O(log n). 빈칸 2에 `n - 1`을 넣으면 `half * half`가 x^(2n−2)가 되어 결과가 틀려요(지수를 1씩 줄이는 방식은 `x * power(x, n - 1)` 꼴이고 O(n)이에요).","code":"","cx":true,"src":"def power(x, n):\n    if n == 0:\n        return ⟦1⟧\n    half = power(x, ⟦n // 2⟧)\n    if n % 2 == 0:\n        return ⟦half * half⟧\n    return half * half * x\n","blanks":[{"ans":["1"],"bad":["0","x"]},{"ans":["n // 2"],"bad":["n / 2","n - 1"]},{"ans":["half * half","half ** 2"],"bad":["half * x","half","half * half * x"]}]},{"id":"w2-rev-01","type":"fill","ch":2,"diff":2,"topic":"문자열 뒤집기 (재귀)","q":"문자열 `s`를 뒤집은 문자열을 재귀로 만드는 함수예요. 빈칸을 채우세요.","ex":"“첫 글자를 뺀 나머지를 뒤집고, 첫 글자를 맨 뒤에 붙이기”예요. 길이 0·1인 문자열은 뒤집어도 그대로예요.","code":"","cx":false,"src":"def reverse(s):\n    if len(s) <= 1:\n        return ⟦s⟧\n    return ⟦reverse(s[1:]) + s[0]⟧\n","blanks":[{"ans":["s"],"bad":["''","s[0]"]},{"ans":["reverse(s[1:]) + s[0]","reverse(s[1:]) + s[:1]","s[-1] + reverse(s[:-1])"],"bad":["s[0] + reverse(s[1:])","reverse(s[1:])","reverse(s) + s[0]"]}]},{"id":"w3-def-01","type":"mc","ch":3,"diff":1,"topic":"점근 표기 정의","q":"`f(n) ∈ O(g(n))`의 **정의**로 옳은 것은?","ex":"O는 상한(≤ c·g), Ω는 하한(≥ c·g), Θ는 둘 다(c₁·g ≤ f ≤ c₂·g). 세 정의 모두 “어떤 양의 상수 c와 n₀가 존재해서 n ≥ n₀인 모든 n에 대해”로 시작해요.","code":"","cx":true,"opts":["모든 n ≥ 1에 대해 f(n) ≤ g(n)이다.","어떤 양의 상수 c, n₀가 있어서 모든 n ≥ n₀에 대해 f(n) ≥ c·g(n)이다.","어떤 양의 상수 c, n₀가 있어서 모든 n ≥ n₀에 대해 f(n) ≤ c·g(n)이다.","어떤 양의 상수 c₁, c₂, n₀가 있어서 모든 n ≥ n₀에 대해 c₁·g(n) ≤ f(n) ≤ c₂·g(n)이다.","n이 커질수록 f(n) / g(n)이 0에 가까워진다."],"a":2,"why":["상수 배(c)와 “충분히 큰 n(n₀ 이상)”이라는 조건이 빠졌어요. 예를 들어 3n ∈ O(n)이지만 3n ≤ n은 성립하지 않아요.","부등호 방향이 반대예요. f(n) ≥ c·g(n)은 점근적 하한인 Ω(g(n))의 정의예요.","맞아요. n₀ 이후로는 c·g(n)이 f(n)을 위에서 눌러 주는 **점근적 상한**이 O예요.","위아래를 모두 감싸는 이 정의는 Θ(g(n))예요.","이건 f가 g보다 “훨씬 느리게” 큰다는 더 강한 조건이에요. 예: n ∈ O(n)이지만 n/n = 1은 0으로 가지 않아요."]},{"id":"w3-def-02","type":"mc","ch":3,"diff":1,"topic":"점근 표기 정의","q":"`f(n) ∈ Ω(g(n))`의 뜻으로 옳은 것은?","ex":"Ω(오메가)는 점근적 **하한**이에요. 예: 3n² + 2n ∈ Ω(n²), Ω(n)도 성립해요.","code":"","cx":true,"opts":["어떤 양의 상수 c, n₀가 있어서 모든 n ≥ n₀에 대해 f(n) ≥ c·g(n)이다. (점근적 하한)","어떤 양의 상수 c, n₀가 있어서 모든 n ≥ n₀에 대해 f(n) ≤ c·g(n)이다. (점근적 상한)","모든 n에 대해 f(n) = g(n)이다.","f(n)은 항상 g(n)보다 작다."],"a":0,"why":["맞아요. n이 충분히 크면 f(n)이 c·g(n) **이상** — f는 적어도 g만큼 빨리 증가해요.","이건 O(g(n))의 정의예요. Ω는 부등호가 반대(≥)예요.","점근 표기는 두 함수가 같다는 뜻이 아니라 증가율의 크기 관계를 말해요.","“항상 작다”는 오히려 상한에 가까운 말이고, 상수 c와 n₀ 조건도 없어요."]},{"id":"w3-def-03","type":"mc","ch":3,"diff":2,"topic":"Θ = O ∩ Ω","q":"O, Ω, Θ의 관계에 대한 설명으로 **옳은** 것은?","ex":"Θ(g) = O(g) ∩ Ω(g). 그리고 f ∈ O(g) ⇔ g ∈ Ω(f)예요.","code":"","cx":true,"opts":["f ∈ Θ(g)이면 f ∈ O(g)이지만, f ∈ Ω(g)일 필요는 없다.","f ∈ O(g)이고 f ∈ Ω(g)이면 f ∈ Θ(g)이다.","f ∈ O(g)이면 항상 f ∈ Θ(g)이다.","f ∈ Ω(g)이면 g ∈ Ω(f)이다."],"a":1,"why":["Θ는 상한과 하한을 **모두** 만족하는 것이라 f ∈ Θ(g)이면 f ∈ Ω(g)도 반드시 성립해요.","맞아요. 위에서(O) 아래에서(Ω) 모두 g의 상수 배로 감싸지면 Θ예요. Θ(g) = O(g) ∩ Ω(g).","n ∈ O(n²)이지만 n ∉ Θ(n²)이에요. O는 상한일 뿐 꽉 끼는 증가율은 아니에요.","n² ∈ Ω(n)이지만 n ∉ Ω(n²)이에요. 올바른 관계는 f ∈ Ω(g) ⇔ g ∈ O(f)예요."]},{"id":"w3-cn-01","type":"mc","ch":3,"diff":2,"topic":"c와 n₀ 찾기","q":"`f(n) = 3n + 5`가 O(n)임을 정의대로 보이려고 해요. 모든 n ≥ n₀에서 `f(n) ≤ c·n`을 만족하는 (c, n₀)는?","ex":"c를 최고차항 계수보다 조금 크게 잡고, 부등식이 성립하기 시작하는 n을 n₀로 잡으면 돼요. (c = 8, n₀ = 1도 가능해요.)","code":"","cx":true,"opts":["c = 3, n₀ = 1","c = 4, n₀ = 1","c = 2, n₀ = 100","c = 4, n₀ = 5"],"a":3,"why":["3n + 5 ≤ 3n은 어떤 n에서도 성립하지 않아요(항상 5만큼 커요).","n = 1이면 f(1) = 8 > 4·1 = 4라서 n₀ = 1부터는 성립하지 않아요.","3n + 5 ≤ 2n은 n ≥ 1에서 성립하지 않아요. c가 최고차항 계수 3보다 작으면 안 돼요.","3n + 5 ≤ 4n ⇔ 5 ≤ n. 그러니 n ≥ 5인 모든 n에서 성립해요."]},{"id":"w3-tf-01","type":"mc","ch":3,"diff":2,"topic":"점근 표기 판단","q":"`f(n) = 3n² + 2n`에 대한 설명으로 **옳지 않은** 것은?","ex":"O는 “이 정도보다 느리거나 같다”, Ω는 “이 정도보다 빠르거나 같다”, Θ는 “정확히 이 정도”예요. 3n² + 2n은 정확히 n² 정도라서 Θ(n²) 하나뿐이에요.","code":"","cx":true,"opts":["f(n) ∈ O(n²)","f(n) ∈ O(n³)","f(n) ∈ Ω(n)","f(n) ∈ Θ(n²)","f(n) ∈ Θ(n³)"],"a":4,"why":["n ≥ 1에서 3n² + 2n ≤ 5n²이므로 옳아요 (c = 5, n₀ = 1).","O는 상한이라 더 큰 n³으로도 위에서 누를 수 있어요. 옳아요.","n ≥ 1에서 3n² + 2n ≥ n이므로 옳아요. Ω는 하한이라 더 작은 n도 돼요.","O(n²)이면서 Ω(n²)(3n² + 2n ≥ 3n²)이므로 Θ(n²)이 맞아요.","옳지 않아요. Θ(n³)이려면 Ω(n³)도 만족해야 하는데, (3n² + 2n) / n³ → 0이라 c·n³ 이상이 될 수 없어요."]},{"id":"w3-tf-02","type":"mc","ch":3,"diff":3,"topic":"점근 표기 판단","q":"다음 중 **옳은** 것은?","ex":"지수에 **더한** 상수(2ⁿ⁺¹ = 2·2ⁿ)는 상수 배지만, 지수에 **곱한** 상수(2²ⁿ = 4ⁿ)는 밑이 바뀌어 증가율 자체가 달라져요.","code":"","cx":true,"opts":["2²ⁿ ∈ O(2ⁿ)","n² ∈ O(n log n)","n ∈ Ω(n²)","2ⁿ⁺¹ ∈ O(2ⁿ)","100 ∉ O(1)"],"a":3,"why":["2²ⁿ = 4ⁿ이고 4ⁿ / 2ⁿ = 2ⁿ은 끝없이 커지므로 어떤 상수 c로도 누를 수 없어요.","n² / (n log n) = n / log n은 끝없이 커져요. n²이 더 빨리 증가해요.","n은 n²보다 느리게 커지므로 n²의 상수 배 이상이 될 수 없어요. 반대로 n ∈ O(n²)이에요.","맞아요. 2ⁿ⁺¹ = 2·2ⁿ이므로 c = 2로 잡으면 돼요. 지수에 **더해진** 상수는 상수 배일 뿐이에요.","100 ≤ 100·1이므로 c = 100이면 100 ∈ O(1)이에요. 상수는 모두 O(1)이에요."]},{"id":"w3-tf-03","type":"mc","ch":3,"diff":3,"topic":"로그의 밑","q":"로그 함수에 대한 설명으로 **옳은** 것은?","ex":"로그의 밑 바꾸기: logₐn = log_b n / log_b a. 밑이 달라도 상수 배 차이라 점근 표기에서는 같아요.","code":"","cx":true,"opts":["log₂n이 log₁₀n보다 점근적으로 더 빨리 커지므로 log₂n ∉ O(log₁₀n)이다.","log n ∈ Ω(√n)이다.","log₂n = log₁₀n / log₁₀2 이므로 밑이 다른 로그는 상수 배 차이이고, log₂n ∈ Θ(log₁₀n)이다.","log(n²) ∈ Θ((log n)²)이다."],"a":2,"why":["log₂n은 log₁₀n의 약 3.32배일 뿐이에요. 상수 배 차이는 O로 무시되므로 log₂n ∈ O(log₁₀n)이에요.","√n이 log n보다 훨씬 빨리 커져요. 오히려 log n ∈ O(√n)이에요.","맞아요. 그래서 빅오에서는 밑을 생략하고 그냥 O(log n)이라고 써요.","log(n²) = 2 log n이라 Θ(log n)이에요. (log n)²은 그보다 빨리 커져요."]},{"id":"w3-ord-01","type":"mc","ch":3,"diff":1,"topic":"증가율 순서","q":"n이 충분히 클 때, **느리게 증가하는 것부터** 바르게 나열한 것은?","ex":"외워 두기: 1 < log n < √n < n < n log n < n² < n³ < 2ⁿ < n!","code":"","cx":true,"opts":["1 < log n < n < √n < n log n < n² < 2ⁿ < n!","1 < log n < √n < n < n log n < n² < 2ⁿ < n!","1 < √n < log n < n < n² < n log n < 2ⁿ < n!","1 < log n < √n < n < n log n < n² < n! < 2ⁿ"],"a":1,"why":["√n은 n보다 느리게 커져요(√n = n^0.5). n 앞에 와야 해요.","맞아요. 상수 < 로그 < 제곱근 < 선형 < n log n < 다항식(n²) < 지수(2ⁿ) < 팩토리얼(n!).","log n이 √n보다 느리고, n log n이 n²보다 느려요. 두 곳이 바뀌었어요.","n!이 2ⁿ보다 훨씬 빨리 커져요(n = 64면 2ⁿ ≈ 1.8×10¹⁹, n! ≈ 1.3×10⁸⁹)."]},{"id":"w3-ord-02","type":"mc","ch":3,"diff":2,"topic":"증가율 순서","q":"n이 충분히 클 때 **가장 빠르게** 증가하는 함수는?","ex":"계수는 무시하고 증가율만 봐요: 상수 < log n < n < n log n < n^1.5.","code":"","cx":true,"opts":["1000n","n log₂n","50 log₂n","10⁶","n√n"],"a":4,"why":["계수 1000이 커 보여도 증가율은 n이에요. n > 10⁶이면 n√n이 더 커져요.","n log n / n√n = log n / √n → 0이라 n√n보다 느려요.","로그 함수라 아주 느리게 커져요.","상수라 전혀 증가하지 않아요. O(1)이에요.","맞아요. n√n = n^1.5. 다항식의 차수 1.5가 n(1)이나 n log n보다 커요."]},{"id":"w3-loop-01","type":"mc","ch":3,"diff":1,"topic":"반복문 분석","q":"다음 코드의 시간 복잡도를 가장 간단한 빅오로 나타내면?","ex":"겹친(중첩) 반복은 곱하고, 나란한 반복은 더해요. 그리고 가장 빨리 크는 항만 남겨요.","code":"for i in range(n):\n    for j in range(n):\n        print(i, j)\nfor k in range(n):\n    print(k)","cx":true,"opts":["O(n)","O(n log n)","O(n²)","O(n³)","O(2ⁿ)"],"a":2,"why":["아래쪽 반복문만 보면 n이지만, 위쪽은 반복문이 겹쳐 있어요.","log n번 도는 반복(절반씩 줄이기, 2배씩 늘리기)이 없어요.","맞아요. 중첩 부분 n × n = n², 나란한 반복 n → n² + n → O(n²).","반복문이 세 겹으로 겹친 곳은 없어요.","지수 시간은 호출이 두 갈래씩 갈라지는 재귀 같은 경우예요."]},{"id":"w3-loop-02","type":"mc","ch":3,"diff":2,"topic":"반복문 분석","q":"다음 코드에서 `cnt += 1`이 실행되는 횟수는?","ex":"i = 0, 1, …, n − 1일 때 안쪽이 i번 → 합은 n(n − 1)/2. 절반이어도 n²에 비례하므로 Θ(n²)이에요.","code":"cnt = 0\nfor i in range(n):\n    for j in range(i):\n        cnt += 1","cx":true,"opts":["n","n(n − 1) / 2","n(n + 1) / 2","n²","2n"],"a":1,"why":["안쪽 반복이 i에 따라 0번, 1번, …, n − 1번 돌아서 n보다 훨씬 많아요.","맞아요. 0 + 1 + 2 + … + (n − 1) = n(n − 1)/2. 빅오로는 O(n²)이에요.","1 + 2 + … + n의 합이에요. range(i)는 0부터 i − 1까지라 i번 돌아요(i = 0이면 0번).","안쪽이 항상 n번 돌 때의 횟수예요. 여기서는 i번만 돌아요.","나란한 반복 두 개일 때의 횟수예요."]},{"id":"w3-loop-03","type":"mc","ch":3,"diff":2,"topic":"반복문 분석","q":"다음 코드의 시간 복잡도를 Θ로 나타내면?","ex":"2배씩 커지거나 절반씩 줄어드는 반복은 log n번이에요. 겹쳐 있으니 곱해요.","code":"for i in range(n):\n    j = 1\n    while j < n:\n        j *= 2","cx":true,"opts":["Θ(log n)","Θ(n)","Θ(n²)","Θ(n log n)"],"a":3,"why":["안쪽 반복만 보면 log n이지만, 바깥 반복이 n번 있어요.","안쪽 반복이 상수 번이 아니라 log n번 돌아요.","안쪽 반복은 j가 2배씩 커지므로 n번이 아니라 약 log₂n번만 돌아요.","맞아요. 바깥 n번 × 안쪽 약 log₂n번 = Θ(n log n)."]},{"id":"w3-rec-01","type":"mc","ch":3,"diff":2,"topic":"점화식","q":"점화식 `T(n) = 2T(n/2) + n`, `T(1) = 1`의 해를 Θ로 나타내면? (n은 2의 거듭제곱)","ex":"정확히 풀면 T(n) = n log₂n + n이에요. 병합 정렬이 이 모양이에요.","code":"","cx":true,"opts":["Θ(n log n)","Θ(n)","Θ(log n)","Θ(n²)"],"a":0,"why":["맞아요. 재귀 트리의 각 깊이에서 하는 일의 합이 n이고, 깊이가 log₂n이라 n log n이에요.","한 단계에서만 n이고, 이런 단계가 log₂n개 있어요.","T(n) = T(n/2) + 1처럼 한 갈래로 절반씩 줄 때의 답이에요.","각 단계 합이 n씩이라 n²까지 커지지는 않아요."]},{"id":"w3-case-01","type":"mc","ch":3,"diff":1,"topic":"최선 · 최악","q":"정렬되지 않은 원소 n개에서 **순차 탐색**으로 x를 찾을 때, 최선과 최악의 시간 복잡도는?","ex":"성능은 보통 **최악의 경우**를 기준으로 말해요. 순차 탐색의 평균도 약 n/2번이라 O(n)이에요.","code":"","cx":true,"opts":["최선 O(1), 최악 O(log n)","최선 O(n), 최악 O(n)","최선 O(log n), 최악 O(n²)","최선 O(1), 최악 O(n)"],"a":3,"why":["최악이 log n이 되려면 이진 탐색처럼 범위를 절반씩 줄여야 해요. 정렬되지 않았으니 하나씩 봐야 해요.","맨 앞에서 바로 찾으면 1번 만에 끝나요. 최선은 O(1)이에요.","최선에 log n이 걸릴 이유도, 최악에 n²이 걸릴 이유도 없어요.","맞아요. 맨 앞에 있으면 1번(최선), 맨 끝에 있거나 없으면 n번(최악) 비교해요."]},{"id":"w3-cost-01","type":"mc","ch":3,"diff":2,"topic":"파이썬 리스트 연산 비용","q":"길이 n인 파이썬 리스트 `a`에서 시간 복잡도가 **O(1)이 아닌** 연산은? (append는 분할 상환 기준)","ex":"배열 리스트는 **끝**에서 넣고 빼는 건 빠르고, **앞이나 중간**에서 넣고 빼면 뒤 원소를 미느라 O(n)이에요. `pop(0)`, `x in a`, `a.index(x)`도 O(n)이에요.","code":"","cx":true,"opts":["`a[i]`","`a.append(x)`","`a.pop()`","`a.insert(0, x)`","`len(a)`"],"a":3,"why":["배열은 칸이 붙어 있어 i번 칸 주소를 바로 계산해요. O(1).","빈 칸에 넣기만 하면 되고, 가끔 있는 확장 비용을 나누면 한 번당 O(1)이에요.","맨 끝 원소를 빼는 건 옮길 원소가 없어서 O(1)이에요.","맞아요. 맨 앞에 넣으려면 원소 n개를 모두 한 칸씩 뒤로 밀어야 해서 O(n)이에요.","리스트가 길이를 저장해 두므로 O(1)이에요."]},{"id":"w3-why-01","type":"mc","ch":3,"diff":1,"topic":"점근적 분석을 하는 이유","q":"알고리즘의 성능을 실제 실행 시간(초) 대신 **입력 크기 n에 대한 증가율**로 비교하는 이유로 가장 알맞은 것은?","ex":"점근적 분석은 “n이 충분히 클 때 얼마나 빨리 늘어나는가”만 비교해요.","code":"","cx":true,"opts":["실행 시간은 컴퓨터 성능 · 언어 · 구현에 따라 달라지므로, n이 커질 때 연산 횟수가 늘어나는 속도로 비교한다.","입력이 작을 때의 속도가 가장 중요하기 때문이다.","점근적 분석을 하면 정확한 실행 시간(초)을 알 수 있기 때문이다.","상수 계수가 알고리즘의 성능을 결정하기 때문이다."],"a":0,"why":["맞아요. 같은 코드도 기계마다 시간이 다르지만, n에 따른 증가율은 알고리즘 자체의 성질이에요.","작은 입력은 어떤 방법이든 빨라요. 차이는 n이 클 때 드러나요.","점근 표기는 상수와 작은 항을 버리기 때문에 정확한 시간을 알려 주지 않아요.","상수 계수는 오히려 버려요. 증가율(차수)이 성능을 결정해요."]},{"id":"w3-loop-s01","type":"short","ch":3,"diff":1,"topic":"반복문 분석","q":"다음 코드의 시간 복잡도를 빅오(O) 표기로 쓰세요.","ex":"반복문이 n번, 안의 일은 O(1)(인덱스 접근 · 덧셈) → O(n).","code":"total = 0\nfor i in range(n):\n    total += a[i]","cx":true,"ans":["O(n)","Θ(n)"],"bad":["O(1)","O(n^2)","O(log n)"],"ph":"O( ) 꼴로"},{"id":"w3-loop-s02","type":"short","ch":3,"diff":2,"topic":"실행 횟수 세기","q":"n = 8일 때 다음 코드에서 `cnt += 1`은 몇 번 실행될까요? (숫자로)","ex":"모든 쌍 (i < j)을 한 번씩 보는 코드예요. n(n − 1)/2 = 8 × 7 / 2 = 28번.","code":"cnt = 0\nfor i in range(n):\n    for j in range(i + 1, n):\n        cnt += 1","cx":true,"ans":["28"],"bad":["64","56","36"],"ph":"숫자"},{"id":"w3-loop-s03","type":"short","ch":3,"diff":2,"topic":"실행 횟수 세기","q":"n = 100일 때 다음 반복문은 몇 번 돌까요? (숫자로)","ex":"i가 1, 2, 4, 8, 16, 32, 64일 때 돌고 128이 되면 멈춰요 → 7번. ⌈log₂100⌉ = 7.","code":"i = 1\nwhile i < n:\n    i *= 2","cx":true,"ans":["7"],"bad":["6","100","50","8"],"ph":"숫자"},{"id":"w3-loop-s04","type":"short","ch":3,"diff":1,"topic":"반복문 분석","q":"다음 반복문의 시간 복잡도를 빅오(O) 표기로 쓰세요.","ex":"n이 절반씩 줄어들어 약 log₂n번 돌아요. 빅오에서는 밑을 생략해 O(log n)이라고 써요.","code":"while n > 1:\n    n //= 2","cx":true,"ans":["O(log n)","Θ(log n)","O(log₂n)","O(lg n)"],"bad":["O(n)","O(n/2)","O(1)"],"ph":"O( ) 꼴로"},{"id":"w3-loop-s05","type":"short","ch":3,"diff":1,"topic":"반복문 분석","q":"다음 코드의 시간 복잡도를 빅오(O) 표기로 쓰세요.","ex":"n번짜리 반복이 세 겹으로 겹쳐 n × n × n = n³ → O(n³).","code":"for i in range(n):\n    for j in range(n):\n        for k in range(n):\n            s += i * j * k","cx":true,"ans":["O(n³)","O(n^3)","O(n**3)","Θ(n³)","Θ(n^3)"],"bad":["O(n^2)","O(3n)","O(n)"],"ph":"O( ) 꼴로"},{"id":"w3-loop-s06","type":"short","ch":3,"diff":3,"topic":"실행 횟수 세기","q":"n = 8일 때 다음 코드에서 `cnt += 1`은 모두 몇 번 실행될까요? (숫자로)","ex":"안쪽은 j = 8, 4, 2, 1일 때 돌아 4번(⌊log₂8⌋ + 1). 바깥 8번 × 4 = 32번. 일반적으로 Θ(n log n)이에요.","code":"cnt = 0\nfor i in range(n):\n    j = n\n    while j > 0:\n        j //= 2\n        cnt += 1","cx":true,"ans":["32"],"bad":["24","64","8","40"],"ph":"숫자"},{"id":"w3-rec-s01","type":"short","ch":3,"diff":2,"topic":"점화식","q":"점화식 `T(n) = T(n/2) + 1`, `T(1) = 1`의 해를 **Θ 표기**로 쓰세요. (재귀 이진 탐색의 비교 횟수)","ex":"T(n) = T(n/2) + 1 = T(n/4) + 2 = … = T(1) + log₂n = log₂n + 1 → Θ(log n).","code":"","cx":true,"ans":["Θ(log n)","Theta(log n)","Θ(log₂n)","Θ(lg n)"],"bad":["Θ(n)","Θ(n log n)","Θ(1)"],"ph":"Θ( ) 꼴로"},{"id":"w3-rec-s02","type":"short","ch":3,"diff":3,"topic":"점화식","q":"점화식 `T(n) = T(n − 1) + n`, `T(1) = 1`의 해를 **Θ 표기**로 쓰세요.","ex":"T(n) = n + (n − 1) + … + 1 = n(n + 1)/2 → Θ(n²).","code":"","cx":true,"ans":["Θ(n²)","Θ(n^2)","Theta(n^2)","Θ(n**2)"],"bad":["Θ(n)","Θ(n log n)","Θ(2^n)"],"ph":"Θ( ) 꼴로"},{"id":"w3-rec-s03","type":"short","ch":3,"diff":2,"topic":"하노이 탑","q":"원판이 10개인 하노이 탑을 옮길 때 원판을 옮기는 최소 횟수는? (점화식 `T(n) = 2T(n − 1) + 1`, `T(1) = 1`)","ex":"T(n) = 2ⁿ − 1이에요. 2¹⁰ − 1 = 1,023번. 그래서 하노이 탑은 Θ(2ⁿ)이에요.","code":"","cx":true,"ans":["1023","2^10 - 1","2¹⁰ - 1"],"bad":["1024","512","100","20","2^10"],"ph":"숫자"},{"id":"w3-rec-s04","type":"short","ch":3,"diff":1,"topic":"재귀 분석","q":"다음 재귀 함수 `fact(n)`의 시간 복잡도를 빅오(O) 표기로 쓰세요.","ex":"호출 한 번에 곱셈 한 번(상수), n이 1씩 줄어 n번 호출해요. T(n) = T(n − 1) + c → O(n). 결과값 n!과 실행 시간은 달라요.","code":"def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)","cx":true,"ans":["O(n)","Θ(n)"],"bad":["O(n!)","O(1)","O(n^2)","O(2^n)"],"ph":"O( ) 꼴로"},{"id":"w3-simp-s01","type":"short","ch":3,"diff":1,"topic":"빅오 간단히","q":"`T(n) = 5n³ + 100n² + 1000`을 **가장 간단한** 빅오 표기로 쓰세요.","ex":"가장 빨리 크는 항 5n³만 남기고 계수 5도 버려요 → O(n³).","code":"","cx":true,"ans":["O(n³)","O(n^3)","O(n**3)","Θ(n³)","Θ(n^3)"],"bad":["O(5n^3)","O(n^2)","O(1000)","O(5n³+100n²)"],"ph":"O( ) 꼴로"},{"id":"w3-def-s01","type":"short","ch":3,"diff":1,"topic":"점근 표기 정의","q":"“어떤 양의 상수 c, n₀가 있어서 모든 n ≥ n₀에 대해 f(n) ≤ c·g(n)”일 때 쓰는, **점근적 상한**을 나타내는 표기의 이름(기호)은?","ex":"상한은 O(빅오), 하한은 Ω(빅오메가), 상한과 하한을 모두 만족하면 Θ(빅세타)예요.","code":"","cx":true,"ans":["O","Big-O","빅오","빅 오","O 표기","O 표기법","빅오 표기법","빅오 표기","빅오(O)","O(빅오)","Big-Oh","빅오(Big-O)"],"bad":["Ω","Θ","오메가","세타","omega","theta"],"ph":"기호 또는 이름"},{"id":"w3-cn-s01","type":"short","ch":3,"diff":3,"topic":"c와 n₀ 찾기","q":"`f(n) = 2n² + 3n`이 모든 n ≥ 1에서 `f(n) ≤ c·n²`을 만족하게 하는 **가장 작은 정수** c는?","ex":"양변을 n²으로 나누면 2 + 3/n ≤ c. 3/n은 n = 1일 때 가장 커서 c ≥ 5여야 해요. 그래서 c = 5, n₀ = 1이면 f(n) ∈ O(n²)이에요.","code":"","cx":true,"ans":["5"],"bad":["2","3","4","6"],"ph":"숫자"},{"id":"w3-cost-s01","type":"short","ch":3,"diff":2,"topic":"파이썬 리스트 연산 비용","q":"길이 n인 파이썬 리스트 `a`에서 `a.pop(0)`의 시간 복잡도를 빅오(O) 표기로 쓰세요.","ex":"맨 앞 원소를 빼면 나머지 n − 1개를 한 칸씩 앞으로 당겨야 해서 O(n)이에요. 맨 끝 `a.pop()`은 O(1)이에요.","code":"","cx":true,"ans":["O(n)","Θ(n)"],"bad":["O(1)","O(log n)"],"ph":"O( ) 꼴로"},{"id":"w3-es-ot","type":"essay","ch":3,"diff":2,"topic":"O와 Θ의 차이","q":"`f(n) = 3n + 2`를 예로 들어 **O 표기와 Θ 표기의 차이**를 설명하세요.","ex":"","code":"","cx":true,"model":"O(g)는 n이 충분히 클 때 c·g(n)이 f(n)을 위에서 누르는 점근적 상한이라, 3n + 2는 O(n)이기도 하고 O(n²)이기도 해요. Θ(g)는 상한(O)과 하한(Ω)을 동시에 만족하는 정확한 증가율이라, 3n + 2는 Θ(n)이지만 Θ(n²)은 아니에요. 즉 Θ(g) = O(g) ∩ Ω(g)예요.","keys":["O는 점근적 상한 (c·g(n) 이 위에서 누름)","Θ는 상한과 하한을 모두 만족 (꽉 끼는 증가율)","예: 3n + 2 ∈ O(n²)이지만 ∉ Θ(n²) (또는 ∈ Θ(n))","Θ(g) = O(g) ∩ Ω(g)"]},{"id":"w3-es-worst","type":"essay","ch":3,"diff":1,"topic":"최악의 경우","q":"알고리즘의 성능을 말할 때 보통 **최악의 경우**를 기준으로 하는 이유를 설명하세요.","ex":"","code":"","cx":true,"model":"최악의 경우 시간은 어떤 입력이 들어와도 그보다 오래 걸리지 않는다는 보장(상한)이 돼요. 최선의 경우는 운 좋은 특별한 입력이라 성능을 대표하지 못하고, 평균의 경우는 입력이 어떻게 분포하는지 가정해야 해서 구하기 어려워요.","keys":["최악은 모든 입력에 대한 보장(상한)","최선은 특별한 입력이라 성능을 대표하지 못함","평균은 입력 분포 가정이 필요해 구하기 어려움"]},{"id":"w3-es-nlogn","type":"essay","ch":3,"diff":3,"topic":"점화식 T(n) = 2T(n/2) + n","q":"`T(n) = 2T(n/2) + n`이 Θ(n log n)이 되는 이유를 **재귀 트리(단계별 일의 양)**로 설명하세요.","ex":"","code":"","cx":true,"model":"크기 n인 문제를 크기 n/2인 문제 두 개로 나누고, 나누고 합치는 데 n만큼 일해요. 재귀 트리를 그리면 깊이 k에는 크기 n/2ᵏ인 문제가 2ᵏ개 있어서 각 깊이의 일의 합은 항상 n이에요. 크기가 1이 될 때까지 깊이는 log₂n이므로 전체 일은 n × log₂n = Θ(n log n)이에요.","keys":["각 깊이(단계)에서 일의 합이 n","깊이(단계 수)가 log₂n","두 값을 곱해 n log n"]},{"id":"w3-es-const","type":"essay","ch":3,"diff":1,"topic":"상수와 낮은 차수 항 버리기","q":"`5n² + 3n + 7`을 O(n²)으로 쓸 때, **계수와 낮은 차수 항을 버려도 되는 이유**를 설명하세요.","ex":"","code":"","cx":true,"model":"n이 충분히 커지면 가장 차수가 높은 항(5n²)이 전체 값을 거의 다 차지해서, 3n + 7은 비율로 보면 무시할 만해져요. 계수 5는 컴퓨터 속도나 구현 방법에 따라 바뀌는 값이라 알고리즘 자체의 성질이 아니에요. 점근 표기는 n이 커질 때의 증가율만 비교하므로 n²만 남겨요.","keys":["n이 크면 최고차항이 전체를 지배","계수는 하드웨어 · 구현에 따라 바뀌는 값","점근 표기는 증가율(성장 속도)만 비교"]},{"id":"w3-es-amort","type":"essay","ch":3,"diff":3,"topic":"append의 분할 상환 O(1)","q":"파이썬 리스트의 `append`가 가끔은 O(n)이 걸리는데도 **분할 상환(amortized) O(1)**이라고 하는 이유를 설명하세요.","ex":"","code":"","cx":true,"model":"파이썬 리스트는 칸을 여유 있게 잡아 두고, append는 빈 칸에 넣기만 하므로 대부분 O(1)이에요. 칸이 꽉 차면 약 2배 큰 공간을 새로 잡고 원소를 모두 옮기느라 그때만 O(n)이 들어요. 크기를 2배씩 늘리면 n번 append하는 동안 옮기는 총량이 1 + 2 + 4 + … + n < 2n이라, 한 번당 평균 O(1)이에요.","keys":["보통은 빈 칸에 넣기만 해서 O(1)","꽉 차면 약 2배로 늘리며 전부 복사 → 그때만 O(n)","n번 동안 복사 총합이 O(n) → 한 번당 평균 O(1)"]},{"id":"w3-es-100n","type":"essay","ch":3,"diff":2,"topic":"점근적으로 더 좋은 알고리즘","q":"같은 문제를 푸는 알고리즘 A는 연산을 `100n`번, B는 `2n²`번 해요. 어느 쪽이 더 빠른지 n의 크기에 따라 설명하고, 점근적으로 어느 쪽이 더 좋은 알고리즘인지 쓰세요.","ex":"","code":"","cx":true,"model":"2n² < 100n인 n < 50에서는 B가 더 빨라요(n = 50에서는 같아요). n > 50이면 A가 더 빠르고, n이 커질수록 차이가 끝없이 벌어져요. 성능은 큰 입력에서 중요하므로 O(n)인 A가 O(n²)인 B보다 점근적으로 더 좋은 알고리즘이에요.","keys":["n < 50이면 B(2n²)가 더 빠름","n > 50이면 A(100n)가 더 빠르고 차이가 계속 커짐","점근적으로 O(n)인 A가 더 좋다 (n이 클 때가 중요)"]},{"id":"w3-fi-dbl","type":"fill","ch":3,"diff":1,"topic":"로그 시간 반복","q":"다음 함수가 O(log n)번만 반복하고 `steps(1024)`가 10이 되도록 빈칸을 채우세요.","ex":"i가 1, 2, 4, …로 2배씩 커지므로 2ᵏ ≥ n이 되는 k = ⌈log₂n⌉번 돌아요 → O(log n).","code":"","cx":true,"src":"def steps(n):\n    cnt = 0\n    i = 1\n    while i < n:\n        i = i * ⟦2⟧\n        cnt += 1\n    return cnt\n","blanks":[{"ans":["2"],"bad":["3","4"]}]},{"id":"w3-fi-pair","type":"fill","ch":3,"diff":2,"topic":"모든 쌍 세기","q":"서로 다른 두 위치 i < j의 쌍을 **한 번씩만** 보면서 합이 0인 쌍의 수를 세는 함수예요. 빈칸을 채우세요. (실행 횟수 n(n − 1)/2 → O(n²))","ex":"j를 i + 1부터 시작하면 (i, i)와 (j, i) 중복을 피해 쌍마다 한 번만 봐요. 안쪽이 n − 1, n − 2, …, 0번 돌아 합이 n(n − 1)/2예요.","code":"","cx":true,"src":"def pairs(a):\n    n = len(a)\n    cnt = 0\n    for i in range(n):\n        for j in range(⟦i + 1⟧, ⟦n⟧):\n            if a[i] + a[j] == 0:\n                cnt += 1\n    return cnt\n","blanks":[{"ans":["i + 1","1 + i"],"bad":["0","i"]},{"ans":["n","len(a)"],"bad":["n - 1","i"]}]},{"id":"w3-fi-bs","type":"fill","ch":3,"diff":3,"topic":"재귀 이진 탐색","q":"정렬된 리스트 `a`에서 x의 위치를 찾는 재귀 이진 탐색이에요. 호출마다 범위가 절반으로 줄어 `T(n) = T(n/2) + 1` → O(log n)이 되도록 빈칸을 채우세요. (없으면 -1)","ex":"mid는 이미 비교했으니 빼고 오른쪽(mid + 1 ~ hi) 또는 왼쪽(lo ~ mid − 1) 절반만 다시 찾아요. mid를 포함하면 범위가 줄지 않아 끝나지 않을 수 있어요.","code":"","cx":true,"src":"def bsearch(a, x, lo, hi):\n    if lo > hi:\n        return -1\n    mid = (lo + hi) // 2\n    if a[mid] == x:\n        return mid\n    elif a[mid] < x:\n        return bsearch(a, x, ⟦mid + 1⟧, hi)\n    else:\n        return bsearch(a, x, lo, ⟦mid - 1⟧)\n","blanks":[{"ans":["mid + 1","1 + mid"],"bad":["mid","lo + 1"]},{"ans":["mid - 1"],"bad":["mid","hi - 1"]}]},{"id":"w3-fi-prefix","type":"fill","ch":3,"diff":2,"topic":"누적 합을 O(n)으로","q":"`out[k] = a[0] + a[1] + … + a[k]`인 누적 합 리스트를 만들어요. 매번 처음부터 더하면 O(n²)이지만, 앞까지의 합 `s`를 이어서 쓰면 O(n)이에요. 빈칸을 채우세요.","ex":"반복 한 번에 덧셈 한 번(O(1))이고 n번 돌아요 → O(n). `sum(a[:k+1])`을 매번 하면 1 + 2 + … + n번 더해서 O(n²)이에요.","code":"","cx":true,"src":"def prefix(a):\n    out = []\n    s = 0\n    for x in a:\n        s = ⟦s + x⟧\n        out.append(⟦s⟧)\n    return out\n","blanks":[{"ans":["s + x","x + s"],"bad":["x","s"]},{"ans":["s"],"bad":["x"]}]},{"id":"w4-alias-01","type":"mc","ch":4,"diff":1,"topic":"별칭 (이름표)","q":"다음 코드의 출력은?","ex":"파이썬 변수는 값을 담는 상자가 아니라 객체에 붙이는 **이름표**예요. `b = a`는 이름표만 하나 더 붙여요(별칭).","code":"a = [1, 2]\nb = a\nb.append(3)\nprint(a)","cx":false,"opts":["[1, 2]","[1, 2, 3]","[3]","오류가 난다"],"a":1,"why":["`b = a`는 리스트를 복사하지 않아요. a와 b는 **같은 리스트**에 붙은 두 이름표예요.","맞아요. b로 append하면 a가 가리키는 같은 리스트가 바뀌어요.","append는 리스트 끝에 원소를 **더하는** 거예요. 원래 원소는 그대로예요.","문법·실행 모두 문제가 없어요."]},{"id":"w4-copy-01","type":"mc","ch":4,"diff":2,"topic":"별칭과 복사","q":"다음 코드의 출력은?","ex":"`b = a`는 별칭, `b = a[:]`나 `b = a.copy()`, `b = list(a)`는 새 리스트(복사)예요.","code":"a = [1, 2, 3]\nb = a[:]\nb[0] = 9\nprint(a, b)","cx":false,"opts":["[9, 2, 3] [9, 2, 3]","[1, 2, 3] [9, 2, 3]","[9, 2, 3] [1, 2, 3]","[1, 2, 3] [1, 2, 3]"],"a":1,"why":["`a[:]`는 새 리스트를 만들어요. b를 바꿔도 a는 그대로예요.","맞아요. 슬라이싱 `a[:]`로 **복사본**을 만들었으니 b[0]만 9가 돼요.","a와 b가 뒤바뀌었어요. 바꾼 것은 b예요.","b[0] = 9로 b는 바뀌었어요."]},{"id":"w4-mut-01","type":"mc","ch":4,"diff":1,"topic":"가변 · 불변","q":"다음 중 **불변(immutable)** 객체로만 짝지어진 것은?","ex":"int · float · str · tuple은 불변, list · dict · set은 가변이에요.","code":"","cx":false,"opts":["list, dict","str, tuple","list, set","dict, str"],"a":1,"why":["list와 dict는 원소를 바꿀 수 있는 **가변** 객체예요.","맞아요. 문자열과 튜플은 한 번 만들면 안의 값을 바꿀 수 없어요. `s[0] = \"x\"`는 TypeError예요.","list와 set은 모두 가변이에요(append, add).","str은 불변이지만 dict는 가변이에요."]},{"id":"w4-slice-01","type":"mc","ch":4,"diff":1,"topic":"슬라이싱","q":"`a = [10, 20, 30, 40, 50]`일 때 `a[::-2]`의 값은?","ex":"`[start : stop : step]` — step이 음수면 뒤에서 앞으로 가요. `a[::-1]`은 뒤집은 복사본이에요.","code":"","cx":false,"opts":["[10, 30, 50]","[50, 30, 10]","[50, 40]","[40, 20]"],"a":1,"why":["step이 -2라서 **뒤에서부터** 2칸씩 가요.","맞아요. start·stop을 비우고 step이 음수면 맨 끝(50)에서 시작해 2칸씩 앞으로: 50, 30, 10.","`a[-2:]`의 순서를 바꾼 값과 비슷하지만, `::-2`는 끝까지 2칸씩 가요.","`a[-2::-2]`처럼 40에서 시작했을 때의 값이에요."]},{"id":"w4-cost-01","type":"mc","ch":4,"diff":2,"topic":"리스트 메서드 비용","q":"원소가 n개인 파이썬 리스트 `a`에서 시간 복잡도가 **O(1)**(append는 평균)인 연산은?","ex":"리스트(배열)는 **끝은 빠르고 앞은 느려요**. 끝: append · pop() O(1) / 앞: insert(0, x) · pop(0) O(n).","code":"","cx":true,"opts":["a.insert(0, x)","a.pop(0)","a.append(x)","x in a","a.index(x)"],"a":2,"why":["맨 앞에 넣으려면 원소 n개를 모두 한 칸씩 뒤로 밀어야 해서 O(n)이에요.","맨 앞을 빼면 나머지 n-1개를 한 칸씩 앞으로 당겨야 해서 O(n)이에요.","맞아요. 맨 끝에 붙이기만 하면 돼서 평균(분할 상환) O(1)이에요. 칸이 꽉 차면 가끔 2배로 늘려 옮기지만 평균하면 O(1)이에요.","앞에서부터 하나씩 비교하므로 O(n)이에요.","index도 앞에서부터 찾으므로 O(n)이에요."]},{"id":"w4-none-01","type":"mc","ch":4,"diff":1,"topic":"함수와 return","q":"다음 코드의 출력은?","ex":"계산 결과를 돌려주려면 `return x * 2`처럼 써야 해요.","code":"def double(x):\n    x * 2\n\nprint(double(3))","cx":false,"opts":["6","3","None","오류가 난다"],"a":2,"why":["함수 안에서 `x * 2`를 계산만 하고 **return하지 않았어요**.","3은 넘겨준 인자예요. 출력되는 것은 함수의 반환값이에요.","맞아요. return 문이 없는 함수는 자동으로 `None`을 return해요.","실행은 정상적으로 끝나요. 값만 None일 뿐이에요."]},{"id":"w4-dict-01","type":"mc","ch":4,"diff":2,"topic":"딕셔너리와 집합","q":"`d = {\"a\": 1, \"b\": 2}`일 때 실행 결과가 **오류**인 것은?","ex":"dict와 set은 키를 해시로 바로 찾아서 `in` · 조회가 평균 O(1)이에요.","code":"","cx":false,"opts":["d.get(\"z\")","d.get(\"z\", 0)","d[\"z\"]","\"z\" in d"],"a":2,"why":["get은 키가 없으면 None을 돌려줘요. 오류가 아니에요.","키가 없으면 기본값 0을 돌려줘요.","맞아요. 없는 키를 `d[키]`로 읽으면 **KeyError**가 나요.","`in`은 키가 있는지 True/False로 알려줘요(여기서는 False)."]},{"id":"w4-class-01","type":"mc","ch":4,"diff":1,"topic":"클래스와 self","q":"다음 클래스에서 `n = ListNode(5, None)`을 실행한 뒤 `n.item`의 값은?","ex":"객체를 만들 때 `__init__`이 자동으로 불리고, 첫 번째 매개변수 self에 새 객체가 들어가요. 실습 코드 5-1의 ListNode예요.","code":"class ListNode:\n    def __init__(self, newItem, nextNode):\n        self.item = newItem\n        self.next = nextNode","cx":false,"opts":["None","5","'newItem'","AttributeError가 난다"],"a":1,"why":["None은 `n.next`의 값이에요.","맞아요. `__init__`의 self는 새로 만든 객체 n이고, `self.item = newItem`으로 5가 저장돼요.","변수 이름이 아니라 그 변수에 들어 있는 값(5)이 저장돼요.","`self.item`으로 저장했으니 `n.item`으로 읽을 수 있어요."]},{"id":"w4-mangle-01","type":"mc","ch":4,"diff":3,"topic":"이름 맹글링 (__head)","q":"실습 코드 `LinkedListBasic`은 `self.__head`, `self.__numItems`처럼 밑줄 2개로 시작하는 이름을 써요. `lst = LinkedListBasic()` 뒤에 클래스 **밖에서** `lst.__head`를 읽으면?","ex":"밑줄 2개는 “클래스 밖에서 직접 건드리지 말고 insert · pop 같은 메서드(인터페이스)로만 쓰라”는 뜻이에요 — ADT의 정보 은닉이에요.","code":"","cx":false,"opts":["더미 헤드 노드가 나온다","None이 나온다","AttributeError가 난다","0이 나온다"],"a":2,"why":["클래스 안에서는 `self.__head`로 쓸 수 있지만, 밖에서는 그 이름으로 보이지 않아요.","값이 None인 게 아니라 그런 이름의 속성을 찾지 못해요.","맞아요. 밑줄 2개 이름은 파이썬이 `_LinkedListBasic__head`로 이름을 바꿔(이름 맹글링) 저장해서, 밖에서 `lst.__head`로는 찾을 수 없어요.","0은 `size()`(= `__numItems`)의 값이에요."]},{"id":"w4-range-01","type":"short","ch":4,"diff":1,"topic":"range","q":"`list(range(10, 0, -3))`의 값을 쓰세요.","ex":"10에서 시작해 3씩 줄이고, stop인 0은 포함하지 않아요: 10, 7, 4, 1.","code":"","cx":false,"ans":["[10, 7, 4, 1]","10, 7, 4, 1","10 7 4 1"],"bad":["[10, 7, 4, 1, 0]","[10, 7, 4]","[9, 6, 3, 0]","[10, 7, 4, 1, -2]"],"ph":"리스트"},{"id":"w4-alias-02","type":"short","ch":4,"diff":3,"topic":"별칭 (이름표)","q":"다음 코드를 실행한 뒤 `len(a)`의 값은?","ex":"`b += [4]`는 리스트를 **제자리에서** 바꿔서(a도 같이) 길이 4가 돼요. `b = b + [5]`는 **새 리스트**를 만들어 b 이름표만 옮기므로 a는 그대로 4예요.","code":"a = [1, 2, 3]\nb = a\nb += [4]\nb = b + [5]","cx":false,"ans":["4","4개"],"bad":["3","5"],"ph":"숫자"},{"id":"w4-mut-02","type":"short","ch":4,"diff":1,"topic":"가변 · 불변","q":"문자열·튜플처럼 만든 뒤에는 안의 값을 바꿀 수 없는 객체의 성질을 무엇이라고 하나요? (우리말 또는 영어)","ex":"불변(immutable) ↔ 가변(mutable). list · dict · set은 가변이에요.","code":"","cx":false,"ans":["불변","immutable","불변성","불변 객체","불변형","immutability","변경 불가능","이뮤터블"],"bad":["가변","mutable"],"ph":"용어"},{"id":"w4-slice-02","type":"short","ch":4,"diff":1,"topic":"슬라이싱","q":"`s = 'python'`일 때 `s[1:4]`의 값을 쓰세요.","ex":"인덱스 1, 2, 3 (4는 포함하지 않음) → y, t, h.","code":"","cx":false,"ans":["yth","'yth'"],"bad":["ytho","pyt","pyth","'ytho'"],"ph":"문자열"},{"id":"w4-dict-02","type":"short","ch":4,"diff":2,"topic":"딕셔너리와 집합","q":"다음 코드를 실행한 뒤 `d[\"a\"]`의 값은?","ex":"글자 수 세기 패턴이에요. 'banana'에 a가 3번 → d = {'b': 1, 'a': 3, 'n': 2}.","code":"d = {}\nfor ch in 'banana':\n    d[ch] = d.get(ch, 0) + 1","cx":false,"ans":["3","3번","3개"],"bad":["2","1","6"],"ph":"숫자"},{"id":"w4-copy-02","type":"essay","ch":4,"diff":2,"topic":"별칭과 복사","q":"`b = a`와 `b = a[:]`의 차이를, 이후 `b.append(9)`를 했을 때 a가 어떻게 되는지로 2~3문장으로 설명하세요. (a는 리스트)","ex":"","code":"","cx":false,"model":"`b = a`는 새 리스트를 만들지 않고 같은 리스트에 이름표 b를 하나 더 붙이는 별칭이라, `b.append(9)`를 하면 a에도 9가 보여요. `b = a[:]`는 원소를 복사한 새 리스트를 만들므로 b에 append해도 a는 바뀌지 않아요.","keys":["b = a는 같은 객체를 가리키는 별칭(이름표)","b = a[:]는 새 리스트(복사본)를 만든다","별칭이면 a도 바뀌고, 복사면 a는 그대로"]},{"id":"w4-cost-02","type":"essay","ch":4,"diff":2,"topic":"리스트 메서드 비용","q":"파이썬 리스트에서 `a.pop()`은 O(1)인데 `a.pop(0)`은 O(n)인 이유를 리스트(배열)의 저장 방식으로 2~3문장으로 설명하세요.","ex":"","code":"","cx":true,"model":"파이썬 리스트는 원소를 연속된 칸에 빈틈없이 저장하는 배열이에요. 맨 끝 원소를 빼면 다른 원소를 움직일 필요가 없어 O(1)이지만, 맨 앞(0번)을 빼면 빈칸이 생기지 않도록 나머지 n-1개를 한 칸씩 앞으로 당겨야 해서 O(n)이에요.","keys":["리스트는 연속된 칸(배열)에 저장","끝에서 빼면 옮길 원소가 없음 → O(1)","앞에서 빼면 나머지 n-1개를 한 칸씩 당김 → O(n)"]},{"id":"w4-node-01","type":"fill","ch":4,"diff":1,"topic":"ListNode 클래스","q":"실습 코드 5-1의 `ListNode` 클래스예요. 노드가 값(item)과 다음 노드(next)를 기억하도록 빈칸을 채우세요.","ex":"`self.속성 = 값`으로 써야 객체에 저장돼요. 그냥 `item = newItem`이라고 쓰면 함수가 끝날 때 사라지는 지역 변수예요.","code":"","cx":false,"src":"class ListNode:\n    def __init__(self, newItem, nextNode):\n        ⟦self.item⟧ = newItem\n        self.next = ⟦nextNode⟧\n","blanks":[{"ans":["self.item"],"bad":["item","self.newItem","newItem"]},{"ans":["nextNode"],"bad":["None","self.next","newItem"]}]},{"id":"w4-cls-01","type":"fill","ch":4,"diff":2,"topic":"클래스와 self","q":"물건을 담는 `Bag` 클래스예요. 가방마다 **자기만의** 리스트를 갖도록 빈칸을 채우세요.","ex":"메서드 안에서 객체의 속성은 항상 `self.`을 붙여 읽고 써요. `__init__`에서 리스트를 만들어야 객체마다 따로 생겨요.","code":"","cx":false,"src":"class Bag:\n    def __init__(self):\n        self.items = ⟦[]⟧\n\n    def add(self, x):\n        ⟦self.items⟧.append(x)\n\n    def size(self):\n        return ⟦len(self.items)⟧\n","blanks":[{"ans":["[]","list()"],"bad":["None","0"]},{"ans":["self.items"],"bad":["items","Bag.items"]},{"ans":["len(self.items)","self.items.__len__()"],"bad":["len(items)","self.items","len(self)"]}]},{"id":"w4-comp-01","type":"fill","ch":4,"diff":2,"topic":"리스트 컴프리헨션","q":"리스트 `a`에서 **짝수만** 골라 **제곱**한 리스트를 만드는 함수예요. 빈칸을 채우세요.","ex":"`[식 for 변수 in 리스트 if 조건]` 순서예요. 짝수 조건은 `x % 2 == 0`이에요.","code":"","cx":false,"src":"def even_squares(a):\n    return [⟦x * x⟧ for x in a if ⟦x % 2 == 0⟧]\n","blanks":[{"ans":["x * x","x ** 2","x*x"],"bad":["x * 2","x","2 ** x"]},{"ans":["x % 2 == 0","not x % 2","x % 2 != 1"],"bad":["x % 2 == 1","x // 2 == 0","x % 2"]}]},{"id":"w4-range-02","type":"fill","ch":4,"diff":2,"topic":"거꾸로 도는 range","q":"리스트를 뒤에서부터 읽어 새 리스트로 만드는 함수예요. `ListStack.printStack`처럼 `range`로 인덱스를 거꾸로 돌도록 빈칸을 채우세요.","ex":"마지막 인덱스 `len(a) - 1`부터 0까지 가려면 stop을 **-1**로 둬야 0이 포함돼요(stop은 포함 안 됨). step은 -1이에요.","code":"","cx":false,"src":"def backwards(a):\n    out = []\n    for i in range(⟦len(a) - 1⟧, ⟦-1⟧, ⟦-1⟧):\n        out.append(a[i])\n    return out\n","blanks":[{"ans":["len(a) - 1"],"bad":["len(a)","0"]},{"ans":["-1"],"bad":["0","1"]},{"ans":["-1"],"bad":["1","0"]}]},{"id":"w5-arr-01","type":"mc","ch":5,"diff":1,"topic":"배열 리스트 접근","q":"원소 n개가 연속된 칸에 저장된 **배열 리스트**에서 `a[i]`(i번 원소 읽기)의 시간 복잡도는?","ex":"배열 리스트의 가장 큰 장점이 **인덱스로 바로 접근(O(1))**이에요.","code":"","cx":true,"opts":["O(1)","O(log n)","O(n)","O(n²)"],"a":0,"why":["칸이 빈틈없이 붙어 있어서 시작 주소 + i × (칸 크기)로 바로 계산해 찾아가요. n과 상관없어요.","절반씩 줄여 가며 찾는 것이 아니라 주소를 바로 계산해요.","처음부터 따라가는 것은 연결 리스트의 get(i)예요.","이중 반복이 필요한 연산이 아니에요."]},{"id":"w5-arr-02","type":"mc","ch":5,"diff":2,"topic":"배열 리스트 삽입","q":"원소 n개가 들어 있는 배열 리스트의 **0번 위치**에 새 원소를 삽입하려고 해요. 기존 원소는 몇 개를 한 칸씩 옮겨야 할까요?","ex":"i번에 삽입하면 i번 ~ n−1번, 즉 **n − i개**를 옮겨요. i = 0이 최악(n개)이에요.","code":"","cx":true,"opts":["0개","1개","n − 1개","n개"],"a":3,"why":["맨 앞 칸을 비워야 하므로 옮겨야 할 원소가 있어요.","한 개만 옮기면 나머지 원소와 겹쳐요.","0번부터 n−1번까지 모두 뒤로 밀어야 하므로 n − 1개가 아니라 n개예요.","0번 ~ n−1번 원소 n개를 모두 한 칸씩 뒤로 옮겨야 0번 칸이 비어요. 그래서 맨 앞 삽입은 O(n)이에요."]},{"id":"w5-arr-03","type":"mc","ch":5,"diff":2,"topic":"배열 리스트 삽입","q":"배열 `a = [1, 2, 3, 4, None]`(원소 4개, n = 4)의 1번 위치에 9를 넣으려고, 아래처럼 **앞에서부터** 옮기는 코드를 썼어요. 실행 뒤 `a`는?","ex":"앞에서부터 옮기면 아직 옮기지 않은 값을 덮어써요. `for j in range(n - 1, i - 1, -1)`처럼 **맨 끝부터** 옮겨야 해요.","code":"n, i = 4, 1\nfor j in range(i, n):\n    a[j + 1] = a[j]\na[i] = 9","cx":false,"opts":["[1, 9, 2, 3, 4]","[1, 9, 2, 2, 2]","[1, 9, 3, 4, 4]","[9, 1, 2, 3, 4]"],"a":1,"why":["올바른 결과는 뒤에서부터 옮겨야 나와요.","a[2] = a[1](=2)로 3을 덮어쓰고, 다음에 a[3] = a[2](=2)… 처럼 같은 값 2가 계속 복사돼요. 그래서 삽입은 **뒤에서부터** 옮겨야 해요.","왼쪽으로 당기는 결과(삭제 때 모양)와 헷갈린 거예요.","9는 1번 위치(a[1])에 들어가요."]},{"id":"w5-arr-04","type":"mc","ch":5,"diff":3,"topic":"배열 리스트 append","q":"배열 리스트가 꽉 차면 **2배 크기**의 새 배열을 만들어 원소를 모두 옮긴 뒤 추가한다고 해요. 빈 리스트에서 `append`를 n번 할 때 **append 한 번의 평균(분할 상환) 시간**은?","ex":"가끔 O(n)짜리 복사가 있어도 2배씩 늘리면 전체 비용이 O(n)이라 **분할 상환 O(1)**이에요. 파이썬 `list.append`가 이 방식이에요.","code":"","cx":true,"opts":["O(1)","O(log n)","O(n)","O(n log n)"],"a":0,"why":["옮기는 횟수의 합이 1 + 2 + 4 + … < 2n이라 n번 전체가 O(n), 한 번 평균은 O(1)이에요.","크기를 늘리는 횟수는 log n번이지만, 평균 비용을 묻는 것이에요.","꽉 찼을 때 한 번은 O(n)이지만, 그런 일은 드물게(크기가 2배가 될 때만) 일어나요.","n번 전체의 비용도 O(n)이라 이보다 작아요."]},{"id":"w5-node-01","type":"mc","ch":5,"diff":1,"topic":"ListNode","q":"교재의 `ListNode`(코드 5-1)로 값 5를 담고 **다음 노드가 없는** 노드를 만드는 코드는?","ex":"`ListNode(newItem, nextNode)` → `self.item = newItem`, `self.next = nextNode`.","code":"","cx":false,"opts":["ListNode(None, 5)","ListNode(5)","ListNode(5, None)","ListNode(next=5)"],"a":2,"why":["인자 순서가 (item, next)라서 item에 None, next에 5가 들어가요.","`__init__(self, newItem, nextNode)`는 인자 2개가 필요해서 TypeError가 나요.","첫 번째 인자가 item(값), 두 번째가 next(다음 노드)예요. 다음 노드가 없으니 None.","매개변수 이름은 nextNode이고, 값 5를 next 자리에 넣으면 의미도 틀려요."]},{"id":"w5-dummy-01","type":"mc","ch":5,"diff":1,"topic":"더미 헤드","q":"`LinkedListBasic`의 `__init__`에서 `self.__head = ListNode('dummy', None)`처럼 **더미 헤드**를 두는 가장 큰 이유는?","ex":"더미가 없으면 i == 0일 때 head 자체를 바꾸는 **예외 처리**를 따로 써야 해요.","code":"","cx":false,"opts":["메모리를 아끼려고","0번 위치 삽입·삭제도 다른 위치와 같은 코드로 처리하려고","원소를 정렬된 상태로 유지하려고","리스트의 길이를 저장하려고","뒤에서부터 순회하려고"],"a":1,"why":["노드가 하나 더 생기니 메모리는 오히려 조금 더 써요.","0번 노드 앞에도 항상 앞 노드(더미)가 있어서 `prev = __getNode(i - 1)` 한 가지 방법으로 모든 위치를 처리해요.","더미 헤드는 정렬과 관계없어요.","길이는 `__numItems`가 저장해요.","단순 연결 리스트는 next만 있어서 뒤에서부터 갈 수 없어요."]},{"id":"w5-getnode-01","type":"mc","ch":5,"diff":2,"topic":"__getNode","q":"`LinkedListBasic`에서 `self.__getNode(-1)`은 무엇을 돌려줄까요?","ex":"insert(0, x)는 `prev = __getNode(-1)` = 더미 헤드 뒤에 붙이는 것이라 맨 앞 삽입에도 특별한 처리가 필요 없어요.","code":"","cx":false,"opts":["None","0번 노드","마지막 노드","더미 헤드","IndexError가 난다"],"a":3,"why":["range(0)이라 반복을 한 번도 안 하고 시작점을 그대로 돌려줘요.","0번 노드는 `__getNode(0)`이에요.","파이썬 리스트의 -1과 달리, 여기서는 끝에서 첫 번째라는 뜻이 아니에요.","`curr = self.__head`에서 시작해 `range(i + 1)` = range(0)번 이동하니 더미 헤드 그대로예요. 더미 헤드의 번호를 −1로 보는 이유예요.","반복 횟수가 0일 뿐 오류는 나지 않아요."]},{"id":"w5-range-01","type":"mc","ch":5,"diff":2,"topic":"insert 범위","q":"원소가 4개인 `LinkedListBasic`에서 `insert(i, x)`가 **정상적으로 삽입되는** i의 범위는?","ex":"insert는 **0 ~ __numItems**, pop·get은 **0 ~ __numItems − 1**이에요.","code":"","cx":false,"opts":["0 ≤ i ≤ 3","0 ≤ i ≤ 4","1 ≤ i ≤ 4","−1 ≤ i ≤ 4"],"a":1,"why":["i = 4(맨 끝 뒤)에도 넣을 수 있어요. pop은 0~3이에요.","조건이 `i >= 0 and i <= self.__numItems`라서 0~4예요. i = 4는 맨 끝에 붙이는 것과 같아요.","0번(맨 앞)에도 넣을 수 있어요.","음수는 조건에 걸려 `index -1 : out of bound in insert()`를 출력해요."]},{"id":"w5-trace-01","type":"mc","ch":5,"diff":2,"topic":"연결 리스트 추적","q":"아래 코드를 실행했을 때 `printList()`의 출력은?","ex":"번호는 0부터 세요. pop(i)는 i번 원소를, remove(x)는 값이 x인 첫 원소를 지워요.","code":"lst = LinkedListBasic()\nlst.append(10)\nlst.append(20)\nlst.insert(1, 15)\nlst.insert(0, 5)\nlst.pop(2)\nlst.remove(20)\nlst.printList()","cx":false,"opts":["5 10","5 15","10 15","5 10 20","5 15 20"],"a":0,"why":["[10] → [10, 20] → [10, 15, 20] → [5, 10, 15, 20] → pop(2)로 15 삭제 → [5, 10, 20] → remove(20) → [5, 10].","pop(2)는 2번 원소(15)를 지워요.","insert(0, 5)로 맨 앞에 5가 들어가요.","remove(20)으로 20이 지워져요.","pop(2)는 2번 원소(15)를 지워요. 번호는 0부터예요."]},{"id":"w5-cost-01","type":"mc","ch":5,"diff":2,"topic":"연산 비용","q":"실습 코드 `LinkedListBasic.append(x)`의 시간 복잡도는? (원소 n개)","ex":"맨 끝 노드를 기억하는 변수(tail)가 없으면 append도 O(n)이에요. CircularLinkedList는 `__tail`이 있어서 append가 O(1)이에요.","code":"","cx":true,"opts":["O(1)","O(log n)","O(n)","O(n²)"],"a":2,"why":["tail을 따로 기억하지 않아서 맨 끝을 바로 알 수 없어요.","절반씩 줄이는 과정이 없어요.","`self.__getNode(self.__numItems - 1)`로 더미 헤드부터 마지막 노드까지 n번 따라가야 해서 O(n)이에요.","한 번 따라가는 것뿐이라 n²은 아니에요."]},{"id":"w5-cmp-01","type":"mc","ch":5,"diff":1,"topic":"배열 vs 연결","q":"다음 중 **연결 리스트(LinkedListBasic)**가 **배열 리스트**보다 시간 복잡도가 더 좋은 연산은?","ex":"**읽기·바꾸기는 배열**, **앞쪽 삽입·삭제는 연결 리스트**가 유리해요.","code":"","cx":true,"opts":["i번 원소 읽기 get(i)","맨 앞에 삽입 insert(0, x)","원소 개수 알기","맨 끝 원소 읽기","i번 원소 값 바꾸기"],"a":1,"why":["배열은 O(1), 연결 리스트는 i번까지 따라가야 해서 O(n)이에요.","배열은 n개를 모두 뒤로 밀어야 해서 O(n), 연결 리스트는 더미 헤드 뒤에 붙이기만 하면 돼서 O(1)이에요.","둘 다 개수를 저장해 두면 O(1)이에요 (`__numItems`).","배열은 O(1), LinkedListBasic은 끝까지 따라가야 해서 O(n)이에요.","배열은 O(1), 연결 리스트는 i번까지 따라가야 해서 O(n)이에요."]},{"id":"w5-cll-01","type":"mc","ch":5,"diff":2,"topic":"원형 연결 리스트","q":"실습 코드 `CircularLinkedList`는 `self.__tail`만 기억해요. **0번 노드(첫 실제 원소)**를 가리키는 식은?","ex":"`getNode(-1)` = `self.__tail.next` = 더미 헤드예요. 그래서 0번 노드는 더미의 다음이에요.","code":"","cx":false,"opts":["self.__tail","self.__tail.next","self.__tail.next.next","self.__tail.next.next.next"],"a":2,"why":["__tail은 마지막 노드예요 (비어 있으면 더미).","마지막 노드 다음은 **더미 헤드**예요. 원형이라 끝이 더미로 이어져요.","tail → 더미 헤드 → 0번 노드 순서로 이어져 있어요.","이건 1번 노드예요."]},{"id":"w5-cll-02","type":"mc","ch":5,"diff":3,"topic":"원형 연결 리스트 비용","q":"원소 n개인 `CircularLinkedList`에서 **마지막 원소 삭제** `pop()`의 시간 복잡도는? (실습 코드 그대로)","ex":"tail이 있으면 **끝에 추가**는 O(1)이지만 **끝을 삭제**하는 것은 여전히 O(n)이에요.","code":"","cx":true,"opts":["O(1) — tail을 알고 있으니까","O(1) — 더미 헤드가 있으니까","O(n) — tail의 앞 노드를 찾아야 하니까","O(n²)"],"a":2,"why":["tail은 알지만, 지우려면 tail의 **앞 노드**의 next를 바꿔야 해요.","더미 헤드는 맨 앞 처리를 쉽게 할 뿐 앞 노드를 알려 주지 않아요.","단순 연결이라 앞으로 갈 수 없어서 `getNode(i - 1)`로 처음부터 n−1번 따라가요. 그리고 `self.__tail = prev`로 바꿔요.","한 번 따라가는 것뿐이에요."]},{"id":"w5-cdll-01","type":"mc","ch":5,"diff":1,"topic":"원형 이중 연결 리스트","q":"빈 `CircularDoublyLinkedList`(코드 5-25)의 상태로 옳은 것은?","ex":"빈 원형 리스트에서 더미가 자기 자신을 가리키게 해 두면, 삽입·삭제 때 None 검사가 필요 없어요.","code":"","cx":false,"opts":["__head는 None이다","__head.next와 __head.prev가 모두 None이다","__head.next와 __head.prev가 모두 __head 자신이다","__head.next는 __head, __head.prev는 None이다"],"a":2,"why":["더미 헤드 노드(BidirectNode)를 만들어 둬요.","`BidirectNode(\"dummy\", None, None)`로 만든 직후엔 None이지만 바로 자기 자신으로 바꿔요.","`self.__head.prev = self.__head`, `self.__head.next = self.__head` — 원형이라 빈 리스트에서도 자기 자신을 가리켜요.","앞뒤 모두 자기 자신이에요."]},{"id":"w5-cdll-02","type":"mc","ch":5,"diff":3,"topic":"원형 이중 연결 리스트 비용","q":"원소 n개인 `CircularDoublyLinkedList`에서 `pop()`(마지막 원소 삭제)을 **실습 코드 그대로** 실행할 때의 시간 복잡도는?","ex":"**원리상**: 이중 원형이면 마지막 노드 = `__head.prev`라 O(1)에 삭제 가능. **실습 코드 그대로**: getNode를 쓰므로 O(n).","code":"","cx":true,"opts":["O(1) — `getNode`를 쓰지 않으니까","O(n) — `getNode(i)`가 더미 헤드부터 앞으로 n번 따라가니까","O(1) — 원형이니까 어떤 연산이든 O(1)","O(log n)"],"a":1,"why":["실습 코드의 pop은 `curr = self.getNode(i)`를 불러요.","`getNode`는 항상 더미 헤드에서 next로 i + 1번 이동해요. 원리상 `self.__head.prev`로 마지막 노드를 O(1)에 찾을 수 있지만, 실습 코드는 그렇게 하지 않아요.","원형이라고 모든 연산이 O(1)인 것은 아니에요.","절반씩 줄이는 과정이 없어요."]},{"id":"w5-cdll-03","type":"mc","ch":5,"diff":2,"topic":"이중 연결 리스트 삭제","q":"이중 연결 리스트에서 노드 `curr`를 리스트에서 빼내는 두 문장으로 옳은 것은?","ex":"이중 연결 리스트는 curr만 알면 앞 노드를 `curr.prev`로 바로 알 수 있어 삭제가 간단해요.","code":"","cx":false,"opts":["curr.prev = curr.next\ncurr.next = curr.prev","curr.prev.next = curr.next\ncurr.next.prev = curr.prev","curr.next.next = curr.prev\ncurr.prev.prev = curr.next","curr.prev.next = curr.prev\ncurr.next.prev = curr.next"],"a":1,"why":["curr 자신의 포인터만 바꾸면 앞뒤 노드는 여전히 curr를 가리켜요.","앞 노드의 next는 뒤 노드로, 뒤 노드의 prev는 앞 노드로 — curr를 건너뛰게 해요. 실습 코드 pop·remove와 같아요.","건너뛸 노드와 방향이 모두 틀렸어요.","앞 노드가 자기 자신을 가리키게 돼서 리스트가 끊겨요."]},{"id":"w5-bug-01","type":"mc","ch":5,"diff":2,"topic":"실습 코드 오류","q":"배포된 `circularDoublyLinkedList.py`의 `get()`에는 `if len(args) == 0 or i == -1::`처럼 콜론이 두 개인 줄이 있었어요. 이 파일을 실행(import)하면?","ex":"실습 파일을 쓸 때는 `i == -1:`로 고쳐야 해요. (이 사이트의 코드는 고친 버전이에요.)","code":"","cx":false,"opts":["정상 실행된다","SyntaxError가 나서 파일 전체가 실행되지 않는다","get()을 부를 때만 TypeError가 난다","i가 -1일 때만 IndexError가 난다"],"a":1,"why":["문법 오류는 실행 전에 걸러져요.","파이썬은 실행 전에 파일 전체의 문법을 검사해서, 한 줄이라도 문법이 틀리면 아무것도 실행하지 않아요.","호출 때가 아니라 읽는(컴파일) 단계에서 오류가 나요.","실행 중 오류가 아니라 문법 오류예요."]},{"id":"w5-arr-05","type":"short","ch":5,"diff":1,"topic":"배열 리스트 삽입","q":"원소 10개가 들어 있는 배열 리스트의 **3번 위치**(번호는 0부터)에 새 원소를 삽입하면, 기존 원소 몇 개를 한 칸씩 뒤로 옮겨야 할까요?","ex":"3번 ~ 9번 원소, 즉 n − i = 10 − 3 = **7개**를 옮겨요.","code":"","cx":false,"ans":["7","7개"],"bad":["6","3","10"],"ph":"숫자"},{"id":"w5-arr-06","type":"short","ch":5,"diff":1,"topic":"배열 리스트 삭제","q":"배열 리스트에서 **마지막 원소를 삭제**(`pop()`)하는 연산의 시간 복잡도를 빅오로 쓰세요.","ex":"뒤에 옮길 원소가 없으니 상수 시간이에요. 반대로 `pop(0)`은 n−1개를 당겨야 해서 O(n)이에요.","code":"","cx":true,"ans":["O(1)","Θ(1)"],"bad":["O(n)","O(log n)"],"ph":"예: O(n)"},{"id":"w5-arr-07","type":"short","ch":5,"diff":3,"topic":"배열 확장","q":"용량(capacity) 1인 빈 배열 리스트가, 꽉 찬 상태에서 append하면 용량을 **2배**로 늘려요. append를 **17번** 하면 마지막 용량은?","ex":"용량은 1 → 2 → 4 → 8 → 16 → 32. 17번째 원소를 넣을 때 16칸이 꽉 차 있어서 32로 늘어나요.","code":"","cx":false,"ans":["32"],"bad":["17","16","34"],"ph":"숫자"},{"id":"w5-node-02","type":"short","ch":5,"diff":1,"topic":"ListNode","q":"`ListNode`에서 다음 노드를 가리키는 필드(속성) 이름은?","ex":"`self.item`에 값을, `self.next`에 다음 노드를 저장해요. (`nextNode`는 `__init__`의 매개변수 이름이에요)","code":"","cx":false,"ans":["next","self.next",".next"],"bad":["item","prev","link","nextNode"],"ph":"속성 이름"},{"id":"w5-index-01","type":"short","ch":5,"diff":1,"topic":"index","q":"실습 코드 `LinkedListBasic.index(x)`는 x가 리스트에 **없으면** 어떤 값을 돌려줄까요?","ex":"`return -2 # 안 쓰는 인덱스` — 실제 번호(0 이상)와 겹치지 않는 값이에요. (CircularLinkedList·CircularDoublyLinkedList는 -12345)","code":"","cx":false,"ans":["-2"],"bad":["-1","-12345","None","0"],"ph":"값"},{"id":"w5-getnode-02","type":"short","ch":5,"diff":2,"topic":"__getNode","q":"`LinkedListBasic`의 `get(3)`이 부르는 `__getNode(3)`에서 `curr = curr.next`는 몇 번 실행될까요?","ex":"더미 헤드(−1번)에서 시작해 `range(i + 1)` = range(4), 즉 **4번** 이동해야 3번 노드에 닿아요.","code":"def __getNode(self, i:int) -> ListNode:\n    curr = self.__head # 더미 헤드, index: -1\n    for index in range(i+1):\n        curr = curr.next\n    return curr","cx":false,"ans":["4","4번"],"bad":["3","5"],"ph":"숫자"},{"id":"w5-cost-02","type":"short","ch":5,"diff":2,"topic":"연산 비용","q":"원소 n개인 `LinkedListBasic`에서 `get(i)`의 **최악** 시간 복잡도를 빅오로 쓰세요.","ex":"i번 노드까지 더미 헤드부터 하나씩 따라가야 해요. i = n−1이면 n번 이동 → O(n). 배열은 O(1)이에요.","code":"","cx":true,"ans":["O(n)","Θ(n)"],"bad":["O(1)","O(log n)","O(n^2)"],"ph":"예: O(1)"},{"id":"w5-trace-02","type":"short","ch":5,"diff":2,"topic":"연결 리스트 추적","q":"아래 코드의 `printList()` 출력은? (숫자를 공백으로 띄어 쓰세요)","ex":"[1] → [2, 1] → [2, 3, 1] → [2, 3, 1, 4] → pop(0)으로 2 삭제 → **3 1 4**.","code":"lst = LinkedListBasic()\nlst.insert(0, 1)\nlst.insert(0, 2)\nlst.insert(1, 3)\nlst.append(4)\nlst.pop(0)\nlst.printList()","cx":false,"ans":["3 1 4","3, 1, 4","[3, 1, 4]"],"bad":["2 3 1","3 1","2 3 1 4","1 3 4"],"ph":"예: 1 2 3"},{"id":"w5-cll-03","type":"short","ch":5,"diff":2,"topic":"원형 연결 리스트","q":"빈 `CircularLinkedList`를 만든 직후 `self.__tail.next`는 무엇을 가리킬까요? (코드로 쓰거나 말로 쓰세요)","ex":"`self.__tail = ListNode(\"dummy\", None)` 다음 `self.__tail.next = self.__tail` — 빈 리스트에서는 tail이 곧 더미이고, 더미 하나가 **자기 자신**을 가리키는 원이에요.","code":"","cx":false,"ans":["self.__tail","__tail","tail","자기 자신","자기자신","tail 자신","더미 헤드 자신","더미 노드 자신","더미 헤드","더미 노드","더미","dummy"],"bad":["None","self.__tail.next.next"],"ph":"예: self.__tail"},{"id":"w5-cdll-04","type":"short","ch":5,"diff":2,"topic":"원형 이중 연결 리스트","q":"`CircularDoublyLinkedList`에서 **마지막 노드**를 한 번에 가리키는 식을 쓰세요. (더미 헤드는 `self.__head`)","ex":"원형 이중 연결이라 더미 헤드의 **앞(prev)**이 마지막 노드예요. `append`가 `prev = self.__head.prev`로 시작하는 이유예요.","code":"","cx":false,"ans":["self.__head.prev","__head.prev","head.prev"],"bad":["self.__head.next","self.__head","self.__head.prev.prev"],"ph":"예: self.__head.next"},{"id":"w5-cost-03","type":"short","ch":5,"diff":3,"topic":"연산 비용","q":"빈 `LinkedListBasic`에 `append`로 원소 n개를 하나씩 넣어 리스트를 만들 때, **전체** 시간 복잡도를 빅오로 쓰세요.","ex":"k번째 append는 `__getNode`로 k−1개를 따라가요. 0 + 1 + … + (n−1) = n(n−1)/2 → **O(n²)**. tail이 있으면 O(n)으로 줄어요.","code":"","cx":true,"ans":["O(n^2)","O(n²)","Θ(n^2)","Θ(n²)"],"bad":["O(n)","O(1)","O(n log n)"],"ph":"예: O(n)"},{"id":"w5-arr-08","type":"essay","ch":5,"diff":1,"topic":"배열 리스트 삽입","q":"배열 리스트의 i번 위치에 삽입할 때, 원소를 **뒤에서부터**(n−1번 → i번 순서로) 한 칸씩 옮겨야 하는 이유를 설명하세요.","ex":"","code":"","cx":false,"model":"앞에서부터 옮기면 `a[i + 1] = a[i]`가 아직 옮기지 않은 a[i + 1]의 값을 덮어써서, 같은 값이 계속 복사되고 원래 값이 사라져요. 맨 끝(n−1번)부터 빈칸(n번)으로 옮기면 항상 이미 옮긴 칸이나 빈칸에만 쓰기 때문에 값을 잃지 않아요. 다 옮긴 뒤 비어 있는 i번에 새 원소를 넣어요.","keys":["앞에서부터 옮기면 아직 옮기지 않은 값을 덮어씀","끝에서부터 옮기면 빈칸(또는 이미 옮긴 칸)에만 씀","옮긴 뒤 i번에 새 원소를 넣음"]},{"id":"w5-dummy-02","type":"essay","ch":5,"diff":1,"topic":"더미 헤드","q":"`LinkedListBasic`이 값이 없는 **더미 헤드**를 두는 이유를 insert(0, x)를 예로 들어 설명하세요.","ex":"","code":"","cx":false,"model":"더미 헤드가 있으면 0번 노드 앞에도 항상 앞 노드가 있어서, insert(0, x)도 `prev = __getNode(-1)`(더미)로 앞 노드를 구한 뒤 `prev.next`만 바꾸면 돼요. 더미가 없으면 맨 앞에 넣을 때 head 자체를 바꾸는 예외 처리를 따로 해야 해요. 그래서 모든 위치의 삽입·삭제를 같은 코드로 처리할 수 있어요.","keys":["0번 노드 앞에도 앞 노드(더미)가 항상 있음","맨 앞 삽입·삭제의 예외 처리(head 변경)가 필요 없음","모든 위치를 같은 코드로 처리"]},{"id":"w5-cmp-02","type":"essay","ch":5,"diff":2,"topic":"배열 vs 연결","q":"배열 리스트와 연결 리스트 중 무엇을 쓸지 고르는 기준을 **i번 원소 읽기**와 **맨 앞 삽입**의 시간 복잡도를 들어 설명하세요.","ex":"","code":"","cx":true,"model":"배열 리스트는 칸이 연속돼 있어 i번 원소를 O(1)에 읽지만, 맨 앞에 삽입하면 n개를 뒤로 밀어야 해서 O(n)이에요. 연결 리스트는 i번까지 따라가야 해서 읽기가 O(n)이지만, 맨 앞 삽입은 링크만 바꾸면 돼서 O(1)이에요. 그래서 읽기·검색이 많으면 배열, 앞쪽 삽입·삭제가 많으면 연결 리스트가 유리해요.","keys":["배열: 읽기 O(1), 맨 앞 삽입 O(n)","연결: 읽기 O(n), 맨 앞 삽입 O(1)","자주 하는 연산에 맞춰 고름"]},{"id":"w5-cll-04","type":"essay","ch":5,"diff":3,"topic":"원형 연결 리스트","q":"`CircularLinkedList`가 head 대신 **tail(`__tail`)**을 기억하는 이유를 시간 복잡도로 설명하세요.","ex":"","code":"","cx":true,"model":"원형이라 `tail.next`가 더미 헤드(맨 앞)이므로, tail 하나만 기억해도 맨 끝과 맨 앞에 모두 바로 접근할 수 있어요. 그래서 append는 tail 뒤에 붙이고 tail을 새 노드로 바꾸면 돼서 O(1)이고, 맨 앞 삽입도 O(1)이에요. head만 기억하면 맨 끝을 찾으려고 n번 따라가야 해서 append가 O(n)이에요.","keys":["tail.next = 더미 헤드(맨 앞)","맨 앞·맨 끝 모두 O(1)에 접근","append가 O(1) (head만 있으면 O(n))"]},{"id":"w5-cdll-05","type":"essay","ch":5,"diff":2,"topic":"이중 연결 리스트","q":"이중 연결 리스트(`BidirectNode`)에서 노드 하나를 삭제할 때, 단순 연결 리스트보다 편한 점을 설명하세요.","ex":"","code":"","cx":false,"model":"이중 연결 리스트는 노드마다 prev가 있어서, 지울 노드 curr만 찾으면 앞 노드를 `curr.prev`로 바로 알 수 있어요. 그래서 `curr.prev.next = curr.next`, `curr.next.prev = curr.prev` 두 줄로 삭제돼요. 단순 연결 리스트는 앞 노드를 알려고 처음부터 따라가거나 `__findNode`처럼 (prev, curr)를 함께 들고 다녀야 해요.","keys":["prev로 앞 노드를 바로 앎","curr.prev.next = curr.next / curr.next.prev = curr.prev","단순 연결은 앞 노드를 따로 찾아야 함"]},{"id":"w5-ins-01","type":"essay","ch":5,"diff":2,"topic":"삽입 순서","q":"`LinkedListBasic.insert`에서 `newNode = ListNode(newItem, prev.next)`를 `prev.next = newNode`보다 **먼저** 해야 하는 이유를 설명하세요.","ex":"","code":"","cx":false,"model":"새 노드가 먼저 원래 i번 노드(prev.next)를 가리키게 해야 뒷부분을 잃지 않아요. 순서를 바꿔 `prev.next = newNode`를 먼저 하면 원래 i번 노드를 가리키던 유일한 참조가 사라져서, 새 노드의 next에 넣을 노드를 알 수 없게 돼요. 그러면 리스트 뒷부분이 끊어져요.","keys":["새 노드가 먼저 원래 다음 노드(prev.next)를 가리킴","순서를 바꾸면 원래 다음 노드에 대한 참조를 잃음","리스트 뒷부분이 끊어짐"]},{"id":"w5-fa-01","type":"fill","ch":5,"diff":1,"topic":"배열 리스트 삽입","q":"칸이 넉넉한 배열 `a`(원소 n개)의 i번 위치에 x를 삽입하는 함수예요. 빈칸을 채우세요.","ex":"맨 끝(n−1번)부터 i번까지 거꾸로 돌며 한 칸씩 뒤(j + 1)로 옮겨요. range의 끝값은 포함되지 않으니 i까지 돌려면 `i - 1`이에요.","code":"","cx":false,"src":"def insert(a, n, i, x):\n    # a: 배열, n: 현재 원소 수, 0 <= i <= n\n    for j in range(⟦n - 1⟧, ⟦i - 1⟧, -1):\n        a[⟦j + 1⟧] = a[j]\n    a[i] = x\n    return n + 1\n","blanks":[{"ans":["n - 1"],"bad":["n"]},{"ans":["i - 1"],"bad":["i"]},{"ans":["j + 1","1 + j"],"bad":["j - 1"]}]},{"id":"w5-fa-02","type":"fill","ch":5,"diff":1,"topic":"배열 리스트 삭제","q":"배열 `a`(원소 n개)의 i번 원소를 지우고 돌려주는 함수예요. 빈칸을 채우세요.","ex":"삭제는 i번부터 **앞에서부터** 뒤 원소를 당겨요(`a[j] = a[j + 1]`). 마지막 j는 n−2라서 range 끝값은 `n - 1`이에요.","code":"","cx":false,"src":"def delete(a, n, i):\n    x = a[i]\n    for j in range(⟦i⟧, ⟦n - 1⟧):\n        a[j] = a[⟦j + 1⟧]\n    a[n - 1] = None\n    return x\n","blanks":[{"ans":["i"],"bad":["i + 1"]},{"ans":["n - 1"],"bad":["n"]},{"ans":["j + 1","1 + j"],"bad":["j - 1"]}]},{"id":"w5-llb-01","type":"fill","ch":5,"diff":2,"topic":"LinkedListBasic 삽입","q":"실습 코드 `LinkedListBasic.insert`(알고리즘 5-2)의 빈칸을 채우세요. (`ListNode`는 코드 5-1과 같아요)","ex":"① 앞 노드 prev(= i−1번, 0번이면 더미)를 구하고 ② 새 노드가 먼저 prev.next를 가리키게 한 뒤 ③ prev.next를 새 노드로 바꿔요. i = __numItems(맨 끝 뒤)도 허용해요.","code":"","cx":false,"src":"class LinkedListBasic:\n    def __init__(self):\n        self.__head = ListNode('dummy', None)\n        self.__numItems = 0\n\n    def insert(self, i:int, newItem):\n        if i >= 0 and i <= ⟦self.__numItems⟧:\n            prev = self.__getNode(⟦i - 1⟧)\n            newNode = ListNode(newItem, ⟦prev.next⟧)\n            ⟦prev.next⟧ = newNode\n            self.__numItems += 1\n        else:\n            print(\"index\", i, \": out of bound in insert()\")\n\n    def __getNode(self, i:int) -> ListNode:\n        curr = self.__head # 더미 헤드, index: -1\n        for index in range(i+1):\n            curr = curr.next\n        return curr\n","blanks":[{"ans":["self.__numItems"],"bad":["self.__numItems - 1"]},{"ans":["i - 1"],"bad":["i"]},{"ans":["prev.next"],"bad":["prev","None"]},{"ans":["prev.next"],"bad":["prev"]}],"pre":["5-1"]},{"id":"w5-llb-02","type":"fill","ch":5,"diff":2,"topic":"LinkedListBasic 삭제","q":"실습 코드 `LinkedListBasic.pop(i)`(알고리즘 5-3)의 빈칸을 채우세요.","ex":"지울 노드의 **앞 노드**(i−1번)를 구해서 `prev.next = curr.next`로 curr를 건너뛰게 해요. 유효 범위는 0 ~ __numItems − 1이에요.","code":"","cx":false,"src":"class LinkedListBasic:\n    def __init__(self):\n        self.__head = ListNode('dummy', None)\n        self.__numItems = 0\n\n    def append(self, newItem):\n        prev = self.__getNode(self.__numItems - 1)\n        newNode = ListNode(newItem, prev.next)\n        prev.next = newNode\n        self.__numItems += 1\n\n    def pop(self, i:int):\n        if (i >= 0 and i <= ⟦self.__numItems - 1⟧):\n            prev = self.__getNode(⟦i - 1⟧)\n            curr = prev.next\n            prev.next = ⟦curr.next⟧\n            retItem = curr.item\n            self.__numItems -= 1\n            return retItem\n        else:\n            return None\n\n    def __getNode(self, i:int) -> ListNode:\n        curr = self.__head # 더미 헤드, index: -1\n        for index in range(i+1):\n            curr = curr.next\n        return cu istNode(newItem, prev.next)\n            prev.next = newNode\n            if i == ⟦self.__numItems⟧:\n                self.__tail = ⟦newNode⟧\n            self.__numItems += 1\n        else:\n            print(\"index\", i, \": out of bound in insert()\")\n\n    def append(self, newItem) -> None:\n        newNode = ListNode(newItem, self.__tail.next)\n        self.__tail.next = newNode\n        self.__tail = newNode\n        self.__numItems += 1\n\n    def getNode(self, i:int) -> ListNode:\n        curr = self.__tail.next  # 더미 헤드, index: -1\n        for index in range(i+1):\n            curr = curr.next\n        return curr\n","blanks":[{"ans":["self.__numItems"],"bad":["self.__numItems - 1"]},{"ans":["newNode","prev.next"],"bad":["prev"]}],"pre":["5-1"]},{"id":"w5-cll-07","type":"fill","ch":5,"diff":3,"topic":"CircularLinkedList 삭제","q":"실습 코드 `CircularLinkedList.pop`의 빈칸을 채우세요. 인자가 없거나 -1이면 마지막 원소를 지워요.","ex":"마지막 원소를 지우면 그 앞 노드 prev가 새 tail이 돼요. 앞 노드를 찾으려고 getNode로 따라가야 해서 끝 삭제는 O(n)이에요.","code":"","cx":false,"src":"class CircularLinkedList:\n    def __init__(self):\n        self.__tail = ListNode(\"dummy\", None)\n        self.__tail.next = self.__tail\n        self.__numItems = 0\n\n    def append(self, newItem) -> None:\n        newNode = ListNode(newItem, self.__tail.next)\n        self.__tail.next = newNode\n        self.__tail = newNode\n        self.__numItems += 1\n\n    def pop(self, *args):\n        if self.isEmpty():\n            return None\n        if len(args) != 0:\n            i = args[0]\n        if len(args) == 0 or i == -1:\n            i = self.__numItems - 1\n        if (i >= 0 and i <= self.__numItems - 1):\n            prev = self.getNode(⟦i - 1⟧)\n            retItem = prev.next.item\n            prev.next = ⟦prev.next.next⟧\n            if i == self.__numItems - 1:\n                self.__tail = ⟦prev⟧\n            self.__numItems -= 1\n            return retItem\n        else:\n            return None\n\n    def isEmpty(self) -> bool:\n
